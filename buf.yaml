version: v2
modules:
  - path: proto
deps:
  - buf.build/bufbuild/protovalidate
lint:
  use:
    - STANDARD
  except:
    - RPC_RESPONSE_STANDARD_NAME
    - RPC_REQUEST_RESPONSE_UNIQUE
  ignore_only:
    RPC_REQUEST_STANDARD_NAME:
      - proto/deployments/v1/deployments.proto
breaking:
  use:
    - FILE
  ignore:
    - proto/deployments
    - proto/dev
    - proto/environment
    - proto/envvars
    - proto/resources
