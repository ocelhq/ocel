packages:
  - console/*
  - cli/node
  - packages/*
  - frameworks/*/*
  - platform/aws/functions/*
  - platform/aws/membrane
  - platform/aws/provider/edges/cloudfront/resolver
  - platform/edge/contract
  - platform/edge/cloudflare/workers/*
  - platform/edge/cloudflare/lib/*
  - packages/native-lib/*
  - scripts/*
  - examples/*
  - examples/*/apps/*
  - tests/*

allowBuilds:
  '@bufbuild/buf': true
  aws-sdk: false
  better-sqlite3: false
  esbuild: true
  protobufjs: false
  sharp: true
  unrs-resolver: true
  workerd: true

linkWorkspacePackages: true

autoInstallPeers: false
