syntax = "proto3";
package app.blob.v1;

option go_package = "github.com/ocelhq/ocel/pkg/proto/app/blob/v1;blobv1";

import "buf/validate/validate.proto";

service BucketService {
  rpc PresignUpload(PresignUploadRequest) returns (PresignUploadResponse);

  rpc VerifyUploadSignature(VerifyUploadSignatureRequest) returns (VerifyUploadSignatureResponse);

  rpc GetUploadStatus(GetUploadStatusRequest) returns (GetUploadStatusResponse);
}

enum UploadState {
  UPLOAD_STATE_UNSPECIFIED = 0;
  UPLOAD_STATE_PENDING = 1;
  UPLOAD_STATE_SUCCEEDED = 2;
  UPLOAD_STATE_EXPIRED = 3;
}

message PresignFile {
  string key = 1 [
    (buf.validate.field).string.max_len = 1024,
    (buf.validate.field).cel = {
      id: "buckets.presign_file.key"
      message: "a key names a file under the bucket's prefix: every segment must be non-empty and neither \".\" nor \"..\", and the key may carry no backslash and no control character"
      expression: "this.split('/').all(segment, segment != '' && segment != '.' && segment != '..') && !this.contains('\\\\') && !this.matches('[[:cntrl:]]')"
    }
  ];
  string name = 2;
  int64 size = 3;
  string mime_type = 4;
}

message PresignedTarget {
  string url = 1;
  string key = 2;
  string name = 3;

  string content_disposition = 4;
}

message CompletedFile {
  string key = 1;
  string name = 2;
  int64 size = 3;
  string mime_type = 4;
}

message PresignUploadRequest {
  string bucket = 1 [(buf.validate.field).string.min_len = 1];
  repeated PresignFile files = 2 [(buf.validate.field).repeated.min_items = 1];

  bytes metadata = 3;

  string content_disposition = 4;

  string callback_base_url = 5;
}

message PresignUploadResponse {
  string session_id = 1;

  repeated PresignedTarget files = 2;
}

message VerifyUploadSignatureRequest {
  string session_id = 1;

  string signature = 2;

  CompletedFile file = 3 [(buf.validate.field).required = true];
}

message VerifyUploadSignatureResponse {
  bool valid = 1;

  bytes metadata = 2;
}

message GetUploadStatusRequest {
  string session_id = 1;
}

message GetUploadStatusResponse {
  UploadState state = 1;

  string error = 2;
}
