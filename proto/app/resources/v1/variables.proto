syntax = "proto3";
package app.resources.v1;

option go_package = "github.com/ocelhq/ocel/pkg/proto/app/resources/v1;resourcesv1";

import "buf/validate/validate.proto";

enum VariableClass {
  VARIABLE_CLASS_UNSPECIFIED = 0;

  VARIABLE_CLASS_PLAIN = 1;

  VARIABLE_CLASS_SENSITIVE = 2;

  VARIABLE_CLASS_SECRET = 3;

  VARIABLE_CLASS_DERIVED = 4;
}

message VariableDefinition {
  string key = 1 [(buf.validate.field).string = {min_len: 1, pattern: "^[^#\\x00-\\x1f\\x7f]*$"}];
  VariableClass class = 2 [(buf.validate.field).enum.defined_only = true];

  bool required = 4;

  repeated string folders = 5 [(buf.validate.field).repeated = {
    unique: true
    items: {string: {pattern: "^(/[^/#\\x00-\\x1f\\x7f]+)+$"}}
  }];

  string source = 6;

  string description = 9 [(buf.validate.field).cel = {
    id: "variables.definition.description"
    message: "a description is at most 120 bytes, one line, and has no control characters"
    expression: "size(bytes(this)) <= 120 && !this.matches('[\\\\x00-\\\\x1f\\\\x7f]')"
  }];

  string group = 10 [(buf.validate.field).string = {pattern: "^[^#\\x00-\\x1f\\x7f]*$"}];
}

message GroupDefinition {
  string key = 1 [(buf.validate.field).string = {min_len: 1, pattern: "^[^#\\x00-\\x1f\\x7f]*$"}];

  bool required = 2;

  string description = 3 [(buf.validate.field).cel = {
    id: "variables.group.description"
    message: "a description is at most 120 bytes, one line, and has no control characters"
    expression: "size(bytes(this)) <= 120 && !this.matches('[\\\\x00-\\\\x1f\\\\x7f]')"
  }];
}

message DeclareEnvRequest {
  repeated VariableDefinition definitions = 1;

  repeated GroupDefinition groups = 2;
}

message VariableCell {
  string key = 1 [(buf.validate.field).string = {min_len: 1, pattern: "^[^#\\x00-\\x1f\\x7f]*$"}];

  string folder = 2 [(buf.validate.field).string.pattern = "^(/[^/#\\x00-\\x1f\\x7f]+)*$"];

  string value = 3;
}

message DeclareEnvResponse {
  repeated VariableCell cells = 1;
}

message VariableProblem {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_MISSING = 1;
    KIND_INVALID = 2;
  }

  string key = 1;
  string folder = 2 [(buf.validate.field).string.pattern = "^(/[^/#\\x00-\\x1f\\x7f]+)*$"];
  Kind kind = 3 [(buf.validate.field).enum.defined_only = true];

  string detail = 4;
}

message ReportEnvProblemsRequest {
  repeated VariableProblem problems = 1;
}

message ReportEnvProblemsResponse {
}
