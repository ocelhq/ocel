syntax = "proto3";
package env.v1;

option go_package = "github.com/ocelhq/ocel/pkg/proto/env/v1;envv1";

import "deployments/v1/deployments.proto";

// EnvVarsService is the store's whole surface. It is served by the same
// provider binary as DeploymentService, over the same channel and the same
// session-token handshake, because the values live in the user's own cloud
// account and only the provider can reach them: the CLI has no cloud SDK
// dependency and must not gain one. It is generated for Go only and excluded
// from client codegen for that reason.
//
// The store holds values, versions and references, and nothing else. Which
// variables a project requires, what class each carries and what schema it
// must satisfy are declared in code — a field here that expressed any of them
// would be a second source of truth for something the application already
// owns.
service EnvVarsService {
    // SetValue writes a value, recording a new version. Concurrency is
    // optimistic: see SetValueRequest.expected_version.
    rpc SetValue(SetValueRequest) returns (SetValueResponse);

    // ListValues enumerates every current value a project holds, as metadata
    // only. There is deliberately no reveal flag: a listing is the routine
    // operation and must never print secrets to a shared terminal.
    rpc ListValues(ListValuesRequest) returns (ListValuesResponse);

    // GetValue reads one cell, revealing the plaintext only when asked.
    rpc GetValue(GetValueRequest) returns (GetValueResponse);

    // RevealValues reads a named set of cells and answers with their
    // plaintext, in one round trip to the store. It is the batch form of
    // GetValue and nothing more: the caller names every cell, so this is not a
    // reveal-everything listing. It cannot be one — which cells a caller may
    // hold the plaintext of follows from the class each variable was declared
    // under, and that is knowable only where the declaration is.
    rpc RevealValues(RevealValuesRequest) returns (RevealValuesResponse);

    // DeleteValue removes a cell's current pointer. Its version history is
    // left in place: history is an audit record of what the value once was,
    // and deleting the value does not unmake that.
    rpc DeleteValue(DeleteValueRequest) returns (DeleteValueResponse);

    // SetReference points a cell at a value owned elsewhere, so a credential
    // is set once and consumed in many places rather than copied into each.
    // The cell then holds an address: resolution is a read-time follow, never
    // background synchronisation, so a consumer cannot hold a stale copy.
    rpc SetReference(SetReferenceRequest) returns (SetReferenceResponse);

    // ListReferences answers what points at a cell, so the blast radius of an
    // edit is visible before the edit. It is served by the store's one
    // secondary index, populated on reference items alone.
    rpc ListReferences(ListReferencesRequest) returns (ListReferencesResponse);

    // ListVersions reads one cell's change history, newest first, bounded by
    // the window each write prunes to. It is metadata only, for the same
    // reason ListValues is: history answers when a value changed, and a
    // command that printed every retained version's plaintext would keep a
    // rotated-away secret readable for the whole window. Reading one value
    // back is GetValue's job, one named cell at a time.
    rpc ListVersions(ListVersionsRequest) returns (ListVersionsResponse);
}

// Coordinate addresses exactly one cell. Its four components are the only
// axes a value varies along, and every one of them is part of the store's key
// structure rather than an attribute, so each operation is a point read or a
// single prefix query.
message Coordinate {
  // slug is the owning project. Cross-project references name another
  // project's slug here, which is why it travels per operation rather than
  // per session.
  string slug = 1;

  // folder is the app-divergence axis, a leading-slash path ("/checkout").
  // Empty means the project root. Nesting is organisation only: a folder is
  // addressed exactly, never as a parent of the folders under it.
  string folder = 2;

  // key is the variable's name as application code declares it.
  string key = 3;

  // environment is the named-environment override axis: the identity of one
  // preview environment. Empty means the value that binds class-wide, which is
  // the only kind production has.
  string environment = 4;
}

// ValueMetadata is everything about a value except the value: what a listing
// shows, and what a reveal adds the plaintext to.
message ValueMetadata {
  Coordinate coordinate = 1;

  // version is the value's current version number, counting from one. It is
  // what a subsequent write passes as expected_version.
  int64 version = 2;

  // updated_at is when this version was written, epoch seconds.
  int64 updated_at = 3;

  // size is the plaintext's length in bytes, so a listing can show that a
  // value is present and roughly how big without disclosing it.
  int64 size = 4;

  // target is the cell this one references, and is absent for a cell holding
  // a value of its own. The other fields stay this row's own either way: what
  // a reference borrows is the plaintext, not the row, so its version is the
  // one a write against the pointer must expect and its size is zero.
  optional Coordinate target = 5;
}

// VersionEntry is one entry of a cell's change history. It carries no
// plaintext: history records that a value changed, not what it was.
message VersionEntry {
  int64 version = 1;
  int64 created_at = 2;
  int64 size = 3;

  // 4 held the revealed plaintext of this version. History no longer carries
  // one, and the number stays retired so a future field can never be read as
  // that value by a peer built against the old shape.
  reserved 4;
  reserved "value";
}

message SetValueRequest {
  // options is always UTF-8 JSON bytes: `{}` when the provider was given no
  // options, never absent and never an empty string. The CLI never inspects
  // this field; only the provider unmarshals it.
  bytes options = 1;

  // protocol_version pins the wire contract so a provider can reject a
  // request it can't speak.
  string protocol_version = 2;

  // class selects the substrate, and with it the table and the key the value
  // encrypts under. Preview and production ciphertext are encrypted under
  // different keys, so this is not a filter — it is which store is opened.
  deployments.v1.Environment.Class class = 3;

  Coordinate coordinate = 4;
  string value = 5;

  // expected_version is the version the writer believes is current: absent
  // for a blind write, zero to require that no value exists yet. A write whose
  // expectation no longer holds is rejected rather than applied, so two people
  // editing at once cannot silently lose one edit. A blind write still loses
  // to a writer that commits between its read and its own commit. The
  // rejection is FAILED_PRECONDITION and nothing else: that code is how a
  // caller tells a lost race from a store it could not reach, so a provider
  // spending it on anything but a broken expectation tells a user their value
  // changed when it did not.
  optional int64 expected_version = 6;
}

message SetValueResponse {
  ValueMetadata metadata = 1;
}

message ListValuesRequest {
  bytes options = 1;
  string protocol_version = 2;
  deployments.v1.Environment.Class class = 3;

  // slug is the project whose values to enumerate. Resolution — which of them
  // an app actually reads — happens on the CLI side; the provider returns raw
  // cells.
  string slug = 4;
}

message ListValuesResponse {
  repeated ValueMetadata values = 1;
}

message GetValueRequest {
  bytes options = 1;
  string protocol_version = 2;
  deployments.v1.Environment.Class class = 3;
  Coordinate coordinate = 4;

  // reveal asks for the plaintext. Without it the provider never decrypts.
  bool reveal = 5;
}

message GetValueResponse {
  // found distinguishes an unset cell from a set one, so a caller never has to
  // read "no value" out of an empty string.
  bool found = 1;
  ValueMetadata metadata = 2;

  // value is populated only when the request asked to reveal.
  string value = 3;
}

message RevealValuesRequest {
  bytes options = 1;
  string protocol_version = 2;
  deployments.v1.Environment.Class class = 3;

  // slug is the project the cells belong to. cells name them within it.
  string slug = 4;
  repeated Cell cells = 5;
}

// Cell addresses one value inside a project already named. It is Coordinate
// without the slug: a batched read carries the project once for the whole
// request, so there is no second place for it to be stated and no way for two
// cells of one request to disagree about which project they belong to.
message Cell {
  string folder = 1;
  string key = 2;
  string environment = 3;
}

message RevealValuesResponse {
  // values carries only the named cells that hold one. An unset cell is absent
  // rather than empty, which is the distinction GetValue.found draws.
  repeated RevealedValue values = 1;
}

message RevealedValue {
  ValueMetadata metadata = 1;
  string value = 2;
}

message DeleteValueRequest {
  bytes options = 1;
  string protocol_version = 2;
  deployments.v1.Environment.Class class = 3;
  Coordinate coordinate = 4;

  // expected_version is the version the deleter believes is current: absent
  // for a blind delete, zero to require that no value is set — which an unset
  // cell already satisfies, so a repeat of a delete that already landed stays
  // idempotent rather than becoming a conflict. A delete whose expectation no
  // longer holds is rejected rather than applied, so a page showing a value
  // somebody has since replaced cannot destroy the replacement. Like a write,
  // the rejection is FAILED_PRECONDITION and nothing else.
  optional int64 expected_version = 5;
}

message DeleteValueResponse {
  // deleted is false when there was nothing to delete. Deleting is idempotent
  // either way.
  bool deleted = 1;
}

message SetReferenceRequest {
  bytes options = 1;
  string protocol_version = 2;
  deployments.v1.Environment.Class class = 3;

  // coordinate is the cell that will hold the reference; target is the cell it
  // will read. target names its own slug, which is how a value owned by
  // another project is consumed, and it addresses that project's class-wide
  // value: a named environment belongs to the project holding it, and means
  // nothing in the target's namespace.
  Coordinate coordinate = 4;
  Coordinate target = 5;

  // expected_version is read exactly as SetValue reads it, against the cell
  // that will hold the reference — the pointer's own version, never the
  // target's.
  optional int64 expected_version = 6;
}

message SetReferenceResponse {
  ValueMetadata metadata = 1;
}

message ListReferencesRequest {
  bytes options = 1;
  string protocol_version = 2;
  deployments.v1.Environment.Class class = 3;

  // coordinate is the value being asked about, not the reference: the answer
  // is what points here.
  Coordinate coordinate = 4;
}

message ListReferencesResponse {
  // references are the cells reading this value, sorted. It is the whole
  // answer: a reference may only point at a value, so nothing sits behind one
  // of these reading the same value at a second remove.
  repeated Coordinate references = 1;
}

message ListVersionsRequest {
  bytes options = 1;
  string protocol_version = 2;
  deployments.v1.Environment.Class class = 3;
  Coordinate coordinate = 4;

  // 5 asked history to reveal every retained version at once. There is
  // deliberately no reveal flag here now, for the reason ListValues states:
  // the bulk form must never print secrets to a shared terminal. The number
  // stays retired so an old peer's `reveal = true` can never be read as
  // whatever field 5 becomes.
  reserved 5;
  reserved "reveal";
}

message ListVersionsResponse {
  // versions are newest first.
  repeated VersionEntry versions = 1;
}
