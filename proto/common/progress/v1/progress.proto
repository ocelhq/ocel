syntax = "proto3";
package common.progress.v1;

option go_package = "github.com/ocelhq/ocel/pkg/proto/common/progress/v1;progressv1";

import "buf/validate/validate.proto";
import "common/links/v1/links.proto";
import "common/plan/v1/plan.proto";

message OperationEvent {
  oneof event {
    option (buf.validate.oneof).required = true;

    ProgressEvent progress = 1;
    LogEvent log = 2;
    ResultEvent result = 3;
    StagePlanEvent stage_plan = 4;
    SpanEvent span = 5;
    DegradedEvent degraded = 6;
    DnsOwedEvent dns_owed = 7;
    common.plan.v1.ChangePlan plan = 8;
  }
}

enum Phase {
  PHASE_UNSPECIFIED = 0;
  PHASE_UPLOADING = 1;
  PHASE_PROVISIONING = 2;
  PHASE_FINALIZING = 3;
  PHASE_DELETING = 4;
  PHASE_BUILDING = 5;
}

// A node of the run's stage tree, app-major: a parentless stage is a unit, a child of a
// unit is a phase, deeper is detail. Events attach at phase depth or deeper, never at a
// unit; ids are derived from canonical names, so either side derives them alone.
message Stage {
  bytes id = 1 [(buf.validate.field).bytes.len = 8];

  bytes parent_id = 2 [(buf.validate.field).bytes.len = 8, (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE];

  string title = 3;

  // Set on a phase-depth stage; PHASE_UNSPECIFIED on a unit and on detail.
  Phase phase = 4;
}

// Stages this run has committed to. Always additive, never a complete picture.
message StagePlanEvent {
  repeated Stage stages = 1;
}

enum SpanStatus {
  SPAN_STATUS_UNSPECIFIED = 0;
  SPAN_STATUS_OK = 1;
  SPAN_STATUS_ERROR = 2;
}

enum AttributeKey {
  ATTRIBUTE_KEY_UNSPECIFIED = 0;
  ATTRIBUTE_KEY_COMMAND = 1;
  ATTRIBUTE_KEY_STAGE = 2;
  ATTRIBUTE_KEY_APP = 3;
  ATTRIBUTE_KEY_PHASE = 4;
  ATTRIBUTE_KEY_PROVIDER = 5;
  ATTRIBUTE_KEY_EXIT_CODE = 6;
  ATTRIBUTE_KEY_ERROR_KIND = 7;
  ATTRIBUTE_KEY_RESOURCE_COUNT = 8;
  ATTRIBUTE_KEY_BYTES = 9;
  ATTRIBUTE_KEY_RETRY_COUNT = 10;
  ATTRIBUTE_KEY_DURATION_MS = 11;
  ATTRIBUTE_KEY_RESOURCE_TYPE = 12;
  ATTRIBUTE_KEY_RESOURCE_NAME = 13;
  ATTRIBUTE_KEY_CACHED = 14;
}

message SpanAttribute {
  AttributeKey key = 1;
  string value = 2;
}

// A span whose span_id equals a declared stage id closes it — the only end-of-stage signal.
message SpanEvent {
  bytes span_id = 1 [(buf.validate.field).bytes.len = 8];
  bytes parent_span_id = 2 [(buf.validate.field).bytes.len = 8, (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE];

  string name = 3;

  int64 start_time_unix_nano = 4;
  int64 end_time_unix_nano = 5;

  SpanStatus status = 6;

  repeated SpanAttribute attributes = 7;
}

// A line of progress inside one declared stage. current/total are producer-declared and
// the only counter; total may grow while a phase runs.
message ProgressEvent {
  string message = 1;

  optional uint32 current = 2;
  optional uint32 total = 3;

  bytes stage_id = 4 [(buf.validate.field).bytes.len = 8];
}

// Detail text inside one declared stage. Run-scoped text is a diagnostic on the CLI's
// own stream instead.
message LogEvent {
  string message = 1;

  bytes stage_id = 2 [(buf.validate.field).bytes.len = 8];
}

message DnsRecord {
  string name = 1;

  string type = 2;

  string value = 3;

  bool proxied = 4;
}

message DnsOwedEvent {
  string headline = 1;

  repeated DnsRecord records = 2;

  repeated string notes = 3;
}

message DegradedEvent {
  string need = 1;

  string detail = 2;
}

// What became of one app in a multi-app apply. Promotion is the failure gate: unless
// every app SUCCEEDED, none is promoted, so a run can carry successes and still fail.
enum AppOutcome {
  APP_OUTCOME_UNSPECIFIED = 0;

  APP_OUTCOME_SUCCEEDED = 1;

  APP_OUTCOME_FAILED = 2;

  // The run failed before this app was reached, so nothing of it was attempted.
  APP_OUTCOME_NOT_RUN = 3;
}

message AppResult {
  string app = 1;

  AppOutcome outcome = 2;

  // Set only on APP_OUTCOME_FAILED.
  string error = 3;
}

message ResultEvent {
  bool success = 1;
  string error = 2;

  repeated common.links.v1.Link links = 3;

  repeated FunctionOutput functions = 4;

  repeated string app_urls = 5;

  string promotion_id = 6;

  FlipBound flip_bound = 7;

  string url_note = 8;

  // One entry per app the apply covered, in manifest order whatever order they finished in.
  repeated AppResult apps = 9;
}

message FunctionOutput {
  string logical_name = 2;
  string url = 1;
}

message FlipBound {
  int64 typical_ms = 1;
  bool published = 2;
}
