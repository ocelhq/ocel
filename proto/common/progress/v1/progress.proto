syntax = "proto3";
package common.progress.v1;

option go_package = "github.com/ocelhq/ocel/pkg/proto/common/progress/v1;progressv1";

import "buf/validate/validate.proto";
import "common/plan/v1/plan.proto";
import "google/protobuf/timestamp.proto";

message OperationEvent {
  google.protobuf.Timestamp time = 9;
  Level level = 10;
  Phase phase = 11;
  string subject = 12;
  string message = 13;
  bytes span_id = 14 [(buf.validate.field).bytes.len = 8, (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE];

  oneof body {
    Started started = 15;
    Ended ended = 16;
    Output output = 17;
    common.plan.v1.ChangePlan plan = 8;
    DnsManualRecordsEvent dns_manual_records = 7;
    OperationResult result = 3;
  }
}

message Started {
  bytes parent_span_id = 1 [(buf.validate.field).bytes.len = 8, (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE];
}

message Ended {
  SpanStatus status = 1;
  int64 start_time_unix_nano = 2;
  repeated SpanAttribute attributes = 3;
  string title = 4;
}

enum Stream {
  STREAM_UNSPECIFIED = 0;
  STREAM_STDOUT = 1;
  STREAM_STDERR = 2;
}

message Output {
  Stream stream = 1;
}

enum Level {
  LEVEL_UNSPECIFIED = 0;
  LEVEL_DEBUG = 1;
  LEVEL_INFO = 2;
  LEVEL_WARN = 3;
  LEVEL_ERROR = 4;
}

enum Phase {
  PHASE_UNSPECIFIED = 0;
  PHASE_CHECK = 1;
  PHASE_BUILD = 2;
  PHASE_PLAN = 3;
  PHASE_PROVISION = 4;
  PHASE_DEPLOY = 5;
  PHASE_PROMOTE = 6;
  PHASE_DESTROY = 7;
}

enum SpanStatus {
  SPAN_STATUS_UNSPECIFIED = 0;
  SPAN_STATUS_OK = 1;
  SPAN_STATUS_ERROR = 2;
}

enum AttributeKey {
  ATTRIBUTE_KEY_UNSPECIFIED = 0;
  ATTRIBUTE_KEY_COMMAND = 1;
  ATTRIBUTE_KEY_SPAN_NAME = 2;
  ATTRIBUTE_KEY_APP = 3;
  ATTRIBUTE_KEY_PHASE = 4;
  ATTRIBUTE_KEY_PROVIDER = 5;
  ATTRIBUTE_KEY_EXIT_CODE = 6;
  ATTRIBUTE_KEY_ERROR_KIND = 7;
  ATTRIBUTE_KEY_RESOURCE_COUNT = 8;
  ATTRIBUTE_KEY_BYTES = 9;
  ATTRIBUTE_KEY_RETRY_COUNT = 10;
  ATTRIBUTE_KEY_DURATION_MS = 11;
  ATTRIBUTE_KEY_RESOURCE_TYPE = 12;
  ATTRIBUTE_KEY_RESOURCE_NAME = 13;
  ATTRIBUTE_KEY_CACHED = 14;
  ATTRIBUTE_KEY_RESOURCE_ACTION = 15;
}

message SpanAttribute {
  AttributeKey key = 1;
  string value = 2;
}

message DnsRecord {
  string name = 1;

  string type = 2;

  string value = 3;

  bool proxied = 4;
}

message DnsManualRecordsEvent {
  string headline = 1;

  repeated DnsRecord records = 2;

  repeated string notes = 3;
}

enum AppOutcome {
  APP_OUTCOME_UNSPECIFIED = 0;

  APP_OUTCOME_SUCCEEDED = 1;

  APP_OUTCOME_FAILED = 2;

  APP_OUTCOME_NOT_RUN = 3;
}

message AppResult {
  string app = 1;

  AppOutcome outcome = 2;

  string error = 3;

  repeated string urls = 4;

  string deployment_url = 5;

  string storage_prefix = 6;
}

message OperationResult {
  bool success = 1;
  string error = 2;

  string promotion_id = 6;

  Propagation propagation = 7;

  repeated string url_notes = 8;

  repeated AppResult apps = 9;

  bool refused = 10;

  ConnectorInstalled connector = 11;
}

message ConnectorInstalled {
  string url = 1;

  string public_key = 2;

  string compute = 3;
}

message Propagation {
  int64 typical_ms = 1;
  bool published = 2;
}
