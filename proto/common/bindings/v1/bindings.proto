syntax = "proto3";
package common.bindings.v1;

import "google/protobuf/struct.proto";

option go_package = "github.com/ocelhq/ocel/pkg/proto/common/bindings/v1;bindingsv1";

enum BindingType {
  BINDING_TYPE_UNSPECIFIED = 0;
  BINDING_TYPE_POSTGRES = 1;
  BINDING_TYPE_BUCKET = 2;
  BINDING_TYPE_CUSTOM = 3;
}

enum PostgresTlsMode {
  POSTGRES_TLS_MODE_UNSPECIFIED = 0;
  POSTGRES_TLS_MODE_REQUIRE = 1;
  POSTGRES_TLS_MODE_VERIFY_FULL = 2;
}

message Binding {
  string name = 1;

  oneof properties {
    PostgresProperties postgres = 2;
    BucketProperties bucket = 3;
    google.protobuf.Struct custom = 6;
  }

  repeated Grant grants = 4;

  string source = 5;
}

message PostgresProperties {
  string host = 1;
  int32 port = 2;
  string database = 3;
  string username = 4;
  string password = 5 [debug_redact = true];
  string url = 6 [debug_redact = true];
  PostgresTlsMode tls_mode = 7;
  string tls_ca = 8;
}

message BucketProperties {
  string bucket = 1;

  string public_base_url = 2;

  bool public = 3;

  string endpoint = 4;
  string region = 5;
  bool path_style = 6;
  string prefix = 7;
  string access_key_id = 8;
  string secret_access_key = 9 [debug_redact = true];
}

message Grant {
  repeated string actions = 1;

  repeated string resources = 2;

  string label = 3;

  repeated GrantCondition conditions = 4;
}

message GrantCondition {
  string operator = 1;

  string key = 2;

  repeated string values = 3;
}
