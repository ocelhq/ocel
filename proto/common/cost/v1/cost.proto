syntax = "proto3";
package common.cost.v1;

option go_package = "github.com/ocelhq/ocel/pkg/proto/common/cost/v1;costv1";

import "buf/validate/validate.proto";
import "google/protobuf/struct.proto";

message ResourceSet {
  string source = 1 [(buf.validate.field).string = {in: ["ocel", "pulumi", "sst", "terraform"]}];

  repeated Scope scopes = 2;

  repeated Resource resources = 3;
}

message Scope {
  string id = 1 [(buf.validate.field).string.min_len = 1];

  string parent = 2;

  string kind = 3 [(buf.validate.field).string.min_len = 1];

  string name = 4;
}

message Resource {
  string id = 1 [(buf.validate.field).string.min_len = 1];

  string scope = 2 [(buf.validate.field).string.min_len = 1];

  string vendor = 3 [(buf.validate.field).string.min_len = 1];

  string type = 4 [(buf.validate.field).string.min_len = 1];

  string name = 5;

  string region = 6;

  google.protobuf.Struct properties = 7;

  repeated string unknown = 8;

  map<string, string> tags = 9;

  map<string, string> references = 10;
}

enum Profile {
  PROFILE_UNSPECIFIED = 0;
  PROFILE_LIGHT = 1;
  PROFILE_MODERATE = 2;
  PROFILE_HEAVY = 3;
}

message Usage {
  Profile profile = 1 [(buf.validate.field).enum.defined_only = true];

  map<string, google.protobuf.Struct> resources = 2;
}

message Estimate {
  string currency = 1;

  Profile profile = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];

  repeated ResourceEstimate resources = 3;

  repeated ScopeTotal scopes = 4;

  Coverage coverage = 5;

  repeated string notes = 6;

  string monthly_fixed = 7;

  string monthly_usage = 8;

  repeated CatalogVersion catalogs = 9;
}

message CatalogVersion {
  string vendor = 1;

  string service = 2;

  string version = 3;
}

message ResourceEstimate {
  enum Status {
    STATUS_UNSPECIFIED = 0;
    STATUS_PRICED = 1;
    STATUS_FREE = 2;
    STATUS_UNSUPPORTED = 3;
    STATUS_NO_PRICE = 4;
  }

  string resource = 1;

  Status status = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];

  repeated CostComponent components = 3;

  string monthly_fixed = 4;

  string monthly_usage = 5;
}

message CostComponent {
  enum PriceStatus {
    PRICE_STATUS_UNSPECIFIED = 0;
    PRICE_STATUS_PRICED = 1;
    PRICE_STATUS_UNKNOWN_INPUT = 2;
    PRICE_STATUS_MISSING = 3;
    PRICE_STATUS_AMBIGUOUS = 4;
    PRICE_STATUS_UNAVAILABLE = 5;
  }

  string name = 1;

  string unit = 2;

  string monthly_quantity = 3;

  string unit_price = 4;

  string monthly_cost = 5;

  bool usage_based = 6;

  string assumption = 7;

  repeated string depends_on_unknown = 8;

  PriceStatus price_status = 9 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];

  string price_detail = 10;

  string sku = 11;

  string price_source = 12;
}

message ScopeTotal {
  string scope = 1;

  string monthly_fixed = 2;

  string monthly_usage = 3;
}

message Coverage {
  uint32 supported = 1;

  uint32 free = 2;

  uint32 unsupported = 3;

  uint32 no_price = 4;

  map<string, uint32> unsupported_types = 5;

  repeated string supported_types = 6;
}

message EstimateDiff {
  Estimate current = 1;

  Estimate proposed = 2;

  repeated ResourceChange resources = 3;

  string monthly_fixed_delta = 4;

  string monthly_usage_delta = 5;
}

message ResourceChange {
  enum Change {
    CHANGE_UNSPECIFIED = 0;
    CHANGE_ADDED = 1;
    CHANGE_REMOVED = 2;
    CHANGE_MODIFIED = 3;
  }

  string resource = 1;

  Change change = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];

  string monthly_fixed_delta = 3;

  string monthly_usage_delta = 4;
}
