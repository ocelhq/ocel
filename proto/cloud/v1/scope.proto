syntax = "proto3";
package cloud.v1;

option go_package = "github.com/ocelhq/ocel/pkg/proto/cloud/v1;cloudv1";

import "google/protobuf/descriptor.proto";

extend google.protobuf.EnumValueOptions {
  string claim = 50001;
}

enum Scope {
  SCOPE_UNSPECIFIED = 0;
  SCOPE_APPS_READ = 1 [(claim) = "cloud.apps.read"];
  SCOPE_APPS_WRITE = 2 [(claim) = "cloud.apps.write"];
  SCOPE_VARIABLES_WRITE = 3 [(claim) = "cloud.variables.write"];
  SCOPE_VARIABLES_REVEAL = 4 [(claim) = "cloud.variables.reveal"];
  SCOPE_PROVIDER = 5 [(claim) = "cloud.provider"];
}
