syntax = "proto3";
package cloud.v1;

option go_package = "github.com/ocelhq/ocel/pkg/proto/cloud/v1;cloudv1";

import "buf/validate/validate.proto";
import "common/environment/v1/environment.proto";
import "console/v1/deployment.proto";
import "google/protobuf/timestamp.proto";

enum JobCommand {
  JOB_COMMAND_UNSPECIFIED = 0;
  JOB_COMMAND_BUILD = 1;
  JOB_COMMAND_DEPLOY = 2;
  JOB_COMMAND_PREVIEW_UP = 3;
}

enum JobState {
  JOB_STATE_UNSPECIFIED = 0;
  JOB_STATE_QUEUED = 1;
  JOB_STATE_RUNNING = 2;
  JOB_STATE_INPUT_REQUIRED = 3;
  JOB_STATE_SUCCEEDED = 4;
  JOB_STATE_FAILED = 5;
  JOB_STATE_CANCELED = 6;
}

enum JobPhase {
  JOB_PHASE_UNSPECIFIED = 0;
  JOB_PHASE_CHECK = 1;
  JOB_PHASE_BUILD = 2;
  JOB_PHASE_PLAN = 3;
  JOB_PHASE_PROVISION = 4;
  JOB_PHASE_DEPLOY = 5;
  JOB_PHASE_PROMOTE = 6;
}

enum JobEventLevel {
  JOB_EVENT_LEVEL_UNSPECIFIED = 0;
  JOB_EVENT_LEVEL_DEBUG = 1;
  JOB_EVENT_LEVEL_INFO = 2;
  JOB_EVENT_LEVEL_WARN = 3;
  JOB_EVENT_LEVEL_ERROR = 4;
}

message GitContext {
  string commit = 1 [(buf.validate.field) = {
    ignore: IGNORE_IF_ZERO_VALUE
    string: {pattern: "^[0-9a-f]{7,64}$"}
  }];

  string branch = 2 [(buf.validate.field).string = {
    max_len: 256
    pattern: "^[^\\x00-\\x1f\\x7f]*$"
  }];

  bool dirty = 3;

  uint32 pull_request = 4;
}

message PreviewTarget {
  string name = 1 [(buf.validate.field).string = {
    max_len: 63
    pattern: "^[a-z][a-z0-9]*(-[a-z0-9]+)*$"
  }];

  bool persistent = 2;

  string label = 3 [(buf.validate.field) = {
    ignore: IGNORE_IF_ZERO_VALUE
    string: {
      max_len: 63
      pattern: "^[a-z][a-z0-9]*(-[a-z0-9]+)*$"
    }
  }];
}

message StartJobRequest {
  option (buf.validate.message).cel = {
    id: "start_job.preview_only_for_preview_up"
    message: "a preview target is given for a preview up job, and only for one"
    expression: "has(this.preview) == (this.command == 3)"
  };
  option (buf.validate.message).cel = {
    id: "start_job.tag_only_for_deploy"
    message: "a tag is given only for a deploy job"
    expression: "this.tag == '' || this.command == 2"
  };

  string project_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
    pattern: "^[A-Za-z0-9_-]+$"
  }];

  string slug = 2 [(buf.validate.field).string = {
    max_len: 63
    pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
  }];

  JobCommand command = 3 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];

  string source_id = 4 [(buf.validate.field).string.pattern = "^[0-9a-f]{64}$"];

  string cli_version = 5 [(buf.validate.field).string = {
    max_len: 128
    pattern: "^[0-9A-Za-z][0-9A-Za-z.+_-]*$"
  }];

  GitContext git = 6;

  string tag = 7 [(buf.validate.field).string = {pattern: "^[A-Za-z0-9._-]*$", max_len: 64}];

  PreviewTarget preview = 8;

  string project_path = 9 [
    (buf.validate.field).string.max_len = 4096,
    (buf.validate.field).cel = {
      id: "start_job.project_path"
      message: "a project path is empty for the source root, or relative and slash-separated: every segment must be non-empty and neither \".\" nor \"..\", and the path may contain no backslash and no control character"
      expression: "this == '' || (this.split('/').all(segment, segment != '' && segment != '.' && segment != '..') && !this.contains('\\\\') && !this.matches('[\\\\x00-\\\\x1f\\\\x7f]'))"
    }
  ];
}

message StartJobResponse {
  Job job = 1;
}

message GetJobRequest {
  string job_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
    pattern: "^[A-Za-z0-9_-]+$"
  }];
}

message GetJobResponse {
  Job job = 1;
}

message CancelJobRequest {
  string job_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
    pattern: "^[A-Za-z0-9_-]+$"
  }];
}

message CancelJobResponse {
  Job job = 1;
}

message ListJobEventsRequest {
  string job_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
    pattern: "^[A-Za-z0-9_-]+$"
  }];

  uint64 after_seq = 2;

  uint32 limit = 3 [(buf.validate.field).uint32.lte = 1000];
}

message ListJobEventsResponse {
  repeated JobEvent events = 1;

  bool more = 2;

  Job job = 3;
}

message Job {
  string id = 1;

  string project_id = 2;

  JobCommand command = 3;

  JobState state = 4;

  JobPhase phase = 5;

  string step = 6;

  google.protobuf.Timestamp created_at = 7;

  google.protobuf.Timestamp started_at = 8;

  google.protobuf.Timestamp ended_at = 9;

  JobError error = 10;

  JobResult result = 11;

  string source_id = 12;

  JobInput input = 13;

  console.v1.Deployment report = 14;
}

message JobInput {
  string id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
    pattern: "^[A-Za-z0-9_-]+$"
  }];

  oneof need {
    option (buf.validate.oneof).required = true;

    VariablesNeeded variables = 2;

    Confirmation confirmation = 3;
  }
}

message VariablesNeeded {
  common.environment.v1.Tier tier = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];

  repeated NeededVariable variables = 2 [(buf.validate.field).repeated.min_items = 1];

  repeated NeededGroup groups = 3;
}

message NeededVariable {
  string key = 1 [(buf.validate.field).string = {min_len: 1, pattern: "^[^#\\x00-\\x1f\\x7f]*$"}];

  string folder = 2 [(buf.validate.field).string.pattern = "^(/[^/#\\x00-\\x1f\\x7f]+)*$"];

  bool secret = 3;

  string description = 4;

  string reason = 5;

  string group = 6 [(buf.validate.field).string.pattern = "^[^#\\x00-\\x1f\\x7f]*$"];
}

message NeededGroup {
  string key = 1 [(buf.validate.field).string = {min_len: 1, pattern: "^[^#\\x00-\\x1f\\x7f]*$"}];

  string description = 2;
}

message Confirmation {
  string finding = 1;

  string question = 2 [(buf.validate.field).string.min_len = 1];
}

message RespondJobRequest {
  string job_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
    pattern: "^[A-Za-z0-9_-]+$"
  }];

  string input_id = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
    pattern: "^[A-Za-z0-9_-]+$"
  }];

  oneof answer {
    option (buf.validate.oneof).required = true;

    VariableValues variables = 3;

    bool confirmed = 4;
  }
}

message VariableValues {
  repeated VariableValue values = 1 [(buf.validate.field).repeated.min_items = 1];
}

message VariableValue {
  string key = 1 [(buf.validate.field).string = {min_len: 1, pattern: "^[^#\\x00-\\x1f\\x7f]*$"}];

  string folder = 2 [(buf.validate.field).string.pattern = "^(/[^/#\\x00-\\x1f\\x7f]+)*$"];

  string value = 3 [debug_redact = true];
}

message RespondJobResponse {
  Job job = 1;
}

message JobError {
  string code = 1;

  string message = 2;
}

message JobResult {
  repeated string urls = 1;

  string deployment_id = 2;

  repeated AppBuild builds = 3;
}

message AppBuild {
  string app = 1;

  string build_id = 2;
}

// The builder derives each event from the `--json` stream (cli.stream.v1.RunEvent) of the `ocel` run the job runs.
message JobEvent {
  uint64 seq = 1;

  google.protobuf.Timestamp time = 2;

  JobEventLevel level = 3;

  JobPhase phase = 4;

  string message = 5;
}

service JobService {
  rpc StartJob(StartJobRequest) returns (StartJobResponse);

  rpc GetJob(GetJobRequest) returns (GetJobResponse);

  rpc CancelJob(CancelJobRequest) returns (CancelJobResponse);

  rpc ListJobEvents(ListJobEventsRequest) returns (ListJobEventsResponse);

  rpc RespondJob(RespondJobRequest) returns (RespondJobResponse);
}
