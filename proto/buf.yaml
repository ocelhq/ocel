version: v2
modules:
  - path: .
deps:
  - buf.build/bufbuild/protovalidate
lint:
  use:
    - STANDARD
  except:
    - RPC_RESPONSE_STANDARD_NAME
    - RPC_REQUEST_RESPONSE_UNIQUE
  ignore_only:
    RPC_REQUEST_STANDARD_NAME:
      - provider/contract/v1/contract.proto
breaking:
  use:
    - FILE
  ignore:
    - common/environment
    - common/progress
    - provider
