version: v2
modules:
  - path: .
    name: buf.build/ocelhq/ocel
deps:
  - buf.build/bufbuild/protovalidate
  - buf.build/opentelemetry/opentelemetry
lint:
  use:
    - STANDARD
  except:
    - RPC_RESPONSE_STANDARD_NAME
    - RPC_REQUEST_RESPONSE_UNIQUE
  ignore_only:
    RPC_REQUEST_STANDARD_NAME:
      - console/v1/connector.proto
      - console/v1/project.proto
      - provider/contract/v1/contract.proto
breaking:
  use:
    - FILE
  ignore:
    - common/progress
    - provider/contract
    - provider/cost
