syntax = "proto3";
package provider.contract.v1;

option go_package = "github.com/ocelhq/ocel/pkg/proto/provider/contract/v1;contractv1";

import "app/resources/v1/resources.proto";
import "app/resources/v1/variables.proto";
import "app/topic/v1/topic.proto";
import "buf/validate/validate.proto";
import "common/bindings/v1/bindings.proto";
import "common/environment/v1/environment.proto";
import "common/plan/v1/plan.proto";
import "common/progress/v1/progress.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "provider/cost/v1/cost.proto";

service ProviderService {
    rpc Configure(ConfigureRequest) returns (ConfigureResponse);

    rpc ProvisionInfra(ProvisionInfraRequest) returns (stream common.progress.v1.OperationEvent);

    rpc Deploy(DeployRequest) returns (stream common.progress.v1.OperationEvent);

    rpc Bootstrap(BootstrapRequest) returns (stream common.progress.v1.OperationEvent);

    rpc DescribeBootstrap(DescribeBootstrapRequest) returns (DescribeBootstrapResponse);

    rpc GetCredentialPermissions(CredentialPermissionsRequest) returns (CredentialPermissionsResponse);

    rpc RemoveBootstrap(BootstrapScope) returns (stream common.progress.v1.OperationEvent);

    rpc PlanRemoveBootstrap(BootstrapScope) returns (common.plan.v1.ChangePlan);

    rpc RemoveEnvironment(RemoveEnvironmentRequest) returns (stream common.progress.v1.OperationEvent);

    rpc RemoveProject(ProjectRequest) returns (stream common.progress.v1.OperationEvent);

    rpc PlanRemoveProject(ProjectRequest) returns (common.plan.v1.ChangePlan);

    rpc ListEnvironments(ListEnvironmentsRequest) returns (ListEnvironmentsResponse);

    rpc GetEnvironment(GetEnvironmentRequest) returns (GetEnvironmentResponse);

    rpc EnsurePreviewAlias(EnsurePreviewAliasRequest) returns (EnsurePreviewAliasResponse);

    rpc ForgetPreviewAlias(ForgetPreviewAliasRequest) returns (ForgetPreviewAliasResponse);

    rpc Preflight(PreflightRequest) returns (stream PreflightEvent);

    rpc ListPromotions(ListPromotionsRequest) returns (ListPromotionsResponse);

    rpc Rollback(RollbackRequest) returns (RollbackResponse);

    rpc RemoveStalePromotions(RemoveStalePromotionsRequest) returns (stream common.progress.v1.OperationEvent);

    rpc UsePreviewWildcard(UsePreviewWildcardRequest) returns (stream common.progress.v1.OperationEvent);

    rpc GetPreviewWildcard(PreviewWildcardRequest) returns (GetPreviewWildcardResponse);

    rpc PlanRemovePreviewWildcard(PreviewWildcardRequest) returns (common.plan.v1.ChangePlan);

    rpc RemovePreviewWildcard(PreviewWildcardRequest) returns (stream common.progress.v1.OperationEvent);

    rpc AddHostname(HostnameRequest) returns (stream common.progress.v1.OperationEvent);

    rpc RemoveHostname(HostnameRequest) returns (stream common.progress.v1.OperationEvent);

    rpc GetHostnameStatus(HostnameRequest) returns (GetHostnameStatusResponse);

    rpc DescribeConnectorTarget(DescribeConnectorTargetRequest) returns (DescribeConnectorTargetResponse);

    rpc InstallConnector(InstallConnectorRequest) returns (stream common.progress.v1.OperationEvent);

    rpc RemoveConnector(RemoveConnectorRequest) returns (stream common.progress.v1.OperationEvent);

    rpc Shape(ShapeRequest) returns (provider.cost.v1.ResourceSet);

    rpc Confirm(ConfirmRequest) returns (ConfirmResponse);

    rpc ReadLogs(ReadLogsRequest) returns (stream ReadLogsResponse);

    rpc ForwardPorts(ForwardPortsRequest) returns (stream ForwardPortsEvent);
}

message ProviderConfig {
  google.protobuf.Struct options = 1;

  repeated string transforms = 2;

  string slug = 3;

  string project_dir = 4 [(buf.validate.field).string.min_len = 1];
}

message ConfigureRequest {
  ProviderConfig config = 1 [(buf.validate.field).required = true];
}

message ConfigureResponse {
  ProviderFacts facts = 1;
}

message ProviderFacts {
  bool prices_deploys = 1;

  repeated string computes = 2;

  repeated WorkerCeiling worker_ceilings = 3;

  int64 max_function_bytes = 5 [(buf.validate.field).int64.gte = 0];

  bool next_refreshes_by_request = 6;

  bool forwards_ports = 8;
}

message UsePreviewWildcardRequest {
  common.environment.v1.Tier tier = 1 [(buf.validate.field).enum.const = 1];

  string base_domain = 2;

  EdgeSelection edge = 3;
}

message PreviewWildcardRequest {
  common.environment.v1.Tier tier = 1 [(buf.validate.field).enum.const = 1];

  EdgeSelection edge = 2;
}

message GetPreviewWildcardResponse {
  PreviewWildcard wildcard = 1;

  repeated string projects = 2;
}

message ConfiguredHostname {
  string hostname = 1;

  string app = 2;
}

message HostnameRequest {
  string slug = 1 [(buf.validate.field).string = {pattern: "^[a-z0-9]+(-[a-z0-9]+)*$", max_len: 63}];

  repeated ConfiguredHostname configured = 2;

  string host = 3;

  EdgeSelection edge = 4;

  bool probe = 5;
}

message GetHostnameStatusResponse {
  repeated ProductionHostname hostnames = 1;

  bool ready = 2;

  repeated string records_written = 3;

  repeated string manual_records = 4;
}

message CertificateState {
  string certificate_id = 1;

  string certificate_status = 2;

  repeated string records_written = 3;

  repeated string manual_records = 4;

  int64 last_probe_at = 5;

  bool last_probe_ok = 6;
}

message ProductionHostname {
  string hostname = 1;

  bool declared = 2;

  CertificateState certificate = 3;

  string renewal_status = 4;

  int64 expires_at = 5;

  bool expiring_soon = 6;

  string serving_pointer = 7;

  bool ready = 8;

  string pending = 9;
}

message Manifest {
  repeated ManifestResource resources = 2;

  string slug = 4 [(buf.validate.field).string = {pattern: "^[a-z0-9]+(-[a-z0-9]+)*$", max_len: 63}];

  repeated TierDomains domains = 5;

  repeated ManifestApp apps = 6;

  repeated ManifestUsage usages = 7;

  repeated ManifestWorker workers = 8;
}

message ManifestWorker {
  string name = 1 [(buf.validate.field).string = {pattern: "^[a-z0-9]+(-[a-z0-9]+)*$", max_len: 63}];

  int32 concurrency = 2 [(buf.validate.field).int32.gte = 0];

  string app = 3 [(buf.validate.field).string.min_len = 1];

  string path = 4;

  string compute = 5 [(buf.validate.field).string.min_len = 1];
}

message ServerlessArtifact {
  repeated ManifestFunction functions = 1;
}

message ContainerArtifact {
  option (buf.validate.message).cel = {
    id: "container.instances"
    message: "a container runs at least min_instances and at most max_instances, so min_instances may not exceed max_instances"
    expression: "this.min_instances <= this.max_instances"
  };

  string image = 1 [(buf.validate.field).string.pattern = "^([^/@: \\t\\n\\v\\f\\r]+(:[0-9]+)?/)?[^/@: \\t\\n\\v\\f\\r]+(/[^/@: \\t\\n\\v\\f\\r]+)*@sha256:[0-9a-f]{64}$"];

  string health_check_path = 2 [(buf.validate.field).string.pattern = "^/[^#? \\t\\n\\v\\f\\r\\x00-\\x1f\\x7f]*$", (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE];

  string arch = 3 [(buf.validate.field).string = {in: ["x86_64", "arm64"]}, (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE];

  uint32 min_instances = 4;

  uint32 max_instances = 5 [(buf.validate.field).uint32.gte = 1];
}

message ManifestUsage {
  string app = 1;
  string resource = 2;
  repeated string files = 3;
}

message TierDomains {
  common.environment.v1.Tier tier = 1 [(buf.validate.field).enum = {defined_only: true, not_in: [0]}];

  repeated string hostnames = 2;
}

message Framework {
  string name = 1 [(buf.validate.field).string = {in: ["node", "next", "go", "python", "rust"]}];

  string arch = 2 [(buf.validate.field).string = {in: ["x86_64", "arm64"]}, (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE];
}

message ManifestApp {
  string name = 1;
  Framework framework = 2;
  repeated TierDomains domains = 3;

  repeated ManifestVariable variables = 4;

  string folder = 5 [(buf.validate.field).string.pattern = "^(/[^/#\\x00-\\x1f\\x7f]+)*$"];

  string build_id = 6;

  bool client_bundle = 8;

  oneof artifact {
    option (buf.validate.oneof).required = true;

    ServerlessArtifact serverless = 9;

    ContainerArtifact container = 10;
  }
}

message ManifestVariable {
  string key = 1 [(buf.validate.field).string = {min_len: 1, pattern: "^[^#\\x00-\\x1f\\x7f]*$"}];
  app.resources.v1.VariableClass class = 2 [(buf.validate.field).enum.defined_only = true];

  string value = 3 [debug_redact = true];

  string folder = 4 [(buf.validate.field).string.pattern = "^(/[^/#\\x00-\\x1f\\x7f]+)*$"];

  int64 version = 5;

  string description = 6;
}

message ManifestFunction {
  string logical_name = 1;
  Framework framework = 2;
  string entry_file = 3;
  string artifact_path = 4;
  string route_id = 6;
}

message ManifestResource {
  string logical_name = 1;
  app.resources.v1.ResourceIdentifier resource = 2;

  oneof config {
    app.resources.v1.PostgresConfig postgres = 3;
    app.resources.v1.BucketConfig bucket = 4;
    ManifestTopic topic = 6;
    app.resources.v1.KvConfig kv = 7;
    app.resources.v1.RealtimeConfig realtime = 8;
  }

  string binding = 5;
}

message ManifestTopic {
  string schema = 1;

  bool ordered = 2;

  app.resources.v1.RetryPolicy retry = 3;

  repeated ManifestConsumer consumers = 4;

  google.protobuf.Duration ttl = 5;

  string cron = 6;
}

message ManifestConsumer {
  string name = 1 [(buf.validate.field).string = {pattern: "^[a-z0-9]+(-[a-z0-9]+)*$", max_len: 63}];

  string worker = 2 [(buf.validate.field).string = {pattern: "^[a-z0-9]+(-[a-z0-9]+)*$", max_len: 63}];

  bool exclusive = 3;

  app.resources.v1.RetryPolicy retry = 4;

  int32 concurrency = 5;

  google.protobuf.Duration max_duration = 6;

  repeated app.topic.v1.Lane lanes = 7;

  app.resources.v1.BatchPolicy batch = 8;
}

message DeployRequest {
  Manifest manifest = 1 [(buf.validate.field).required = true];

  common.environment.v1.Environment environment = 2;

  string tag = 3 [(buf.validate.field).string = {pattern: "^[A-Za-z0-9._-]*$", max_len: 64}];

  EdgeSelection edge = 4;

  bool dry = 5;

  ImageRegistry project_registry = 6;

  repeated common.bindings.v1.Binding inline_bindings = 7;

  string alias_token = 8 [(buf.validate.field).string.pattern = "^([a-z2-7]{16})?$"];

  bool infra_provisioned = 9;
}

message ProvisionInfraRequest {
  Manifest manifest = 1 [(buf.validate.field).required = true];

  common.environment.v1.Environment environment = 2;

  EdgeSelection edge = 3;

  repeated common.bindings.v1.Binding inline_bindings = 4;

  string alias_token = 5 [(buf.validate.field).string.pattern = "^([a-z2-7]{16})?$"];
}

message ShapeRequest {
  Manifest manifest = 1 [(buf.validate.field).required = true];

  common.environment.v1.Environment environment = 2;

  EdgeSelection edge = 3;
}

message ImageRegistry {
  string server = 1;

  string namespace = 2;

  string username = 3;

  string password = 4 [debug_redact = true];
}

message BootstrapRequest {
  common.environment.v1.Tier tier = 1 [(buf.validate.field).enum.defined_only = true];

  repeated string features = 2;

  bool force = 3;

  optional bool repair_on_deploy = 4;

  bool accept_replacements = 5;

  EdgeSelection edge = 6;

  repeated string remove = 7;

  // Draw the plan, emit it as a plan event and stop: the stream changes nothing.
  bool dry = 8;

  // An apply that sends a consented plan emits no plan of its own and refuses
  // work that plan never showed.
  common.plan.v1.ChangePlan consented = 9;
}

message DescribeBootstrapRequest {
  common.environment.v1.Tier tier = 1 [(buf.validate.field).enum.defined_only = true];

  bool with_dependents = 2;

  EdgeSelection edge = 3;
}

message DescribeBootstrapResponse {
  repeated Feature features = 1;

  BootstrapStatus bootstrap = 2;
}

message BootstrapStack {
  string name = 1;

  string feature = 2;

  bool present = 3;

  bool digest_current = 4;

  string written_by = 5;

  bool required = 6;
}

message BootstrapStatus {
  common.environment.v1.Tier tier = 1;

  bool present = 2;

  bool repair_on_deploy = 3;

  repeated BootstrapStack stacks = 4;

  string writer = 5;

  bool downgrade = 6;

  bool unfinished = 7;
}

enum CredentialPurpose {
  CREDENTIAL_PURPOSE_UNSPECIFIED = 0;

  CREDENTIAL_PURPOSE_BOOTSTRAP = 1;

  CREDENTIAL_PURPOSE_DEPLOY = 2;
}

message CredentialPermissionsRequest {
  CredentialPurpose purpose = 1 [(buf.validate.field).enum.defined_only = true];

  EdgeSelection edge = 2;
}

message CredentialPermissionsResponse {
  repeated CredentialGroup groups = 1;
}

message CredentialGroup {
  string heading = 1;

  string document = 2;
}

message Feature {
  string name = 1;

  string summary = 2;

  repeated string depends_on = 3;

  bool enabled = 4;

  repeated string dependents = 5;

  repeated string edges = 6;
}

message Dns {
  string kind = 1;

  string zone = 2;
}

message EdgeSelection {
  string kind = 1;

  Dns dns = 2;

  repeated string allow_degraded = 3;

  google.protobuf.Struct options = 4;
}

message BootstrapScope {
  common.environment.v1.Tier tier = 1 [(buf.validate.field).enum.defined_only = true];

  EdgeSelection edge = 2;

  // A removal that sends a consented plan refuses work that plan never showed.
  common.plan.v1.ChangePlan consented = 3;
}

message RemoveEnvironmentRequest {
  common.environment.v1.Environment environment = 1;

  string slug = 2 [(buf.validate.field).string = {pattern: "^[a-z0-9]+(-[a-z0-9]+)*$", max_len: 63}];

  EdgeSelection edge = 3;
}

message ProjectRequest {
  string slug = 1 [(buf.validate.field).string = {pattern: "^[a-z0-9]+(-[a-z0-9]+)*$", max_len: 63}];

  common.environment.v1.Environment environment = 2;

  EdgeSelection edge = 3;

  // A removal that sends a consented plan refuses work that plan never showed.
  common.plan.v1.ChangePlan consented = 4;
}

message ListEnvironmentsRequest {
  string slug = 1 [(buf.validate.field).string = {pattern: "^[a-z0-9]+(-[a-z0-9]+)*$", max_len: 63}];
}

message ListEnvironmentsResponse {
  repeated PreviewEnvironment environments = 1;
}

message GetEnvironmentRequest {
  string slug = 1 [(buf.validate.field).string = {pattern: "^[a-z0-9]+(-[a-z0-9]+)*$", max_len: 63}];

  common.environment.v1.Environment environment = 2;
}

message GetEnvironmentResponse {
  PreviewEnvironment environment = 1;
}

message PreviewEnvironment {
  string identity = 1;
  common.environment.v1.Lifecycle lifecycle = 2;

  string label = 3;

  int64 created_at = 4;

  repeated string alias_urls = 5;
}

message EnsurePreviewAliasRequest {
  string slug = 1 [(buf.validate.field).string = {pattern: "^[a-z0-9]+(-[a-z0-9]+)*$", max_len: 63}];

  common.environment.v1.Environment environment = 2;

  string token = 3 [(buf.validate.field).string.pattern = "^[a-z2-7]{16}$"];

  repeated string apps = 4;

  repeated string domains = 5;

  bool dry = 6;
}

message EnsurePreviewAliasResponse {
  map<string, string> hostnames = 1;

  string token = 2;
}

message ForgetPreviewAliasRequest {
  string slug = 1 [(buf.validate.field).string = {pattern: "^[a-z0-9]+(-[a-z0-9]+)*$", max_len: 63}];

  common.environment.v1.Environment environment = 2;

  string token = 3 [(buf.validate.field).string.pattern = "^[a-z2-7]{16}$"];
}

message ForgetPreviewAliasResponse {}

message PreflightRequest {
  common.environment.v1.Tier required_tier = 1 [(buf.validate.field).enum.defined_only = true];

  string slug = 2 [(buf.validate.field).string = {pattern: "^[a-z0-9]+(-[a-z0-9]+)*$", max_len: 63}, (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE];

  repeated string domains = 3;

  EdgeSelection edge = 4;

  repeated string frameworks = 6;

  bool check_hosts = 7;

  repeated string host_check_domains = 8;

  repeated ContainerApp containers = 9;

  ImageRegistry project_registry = 10;
}

message ContainerApp {
  string app = 1 [(buf.validate.field).string.min_len = 1];

  string arch = 2 [(buf.validate.field).string = {in: ["x86_64", "arm64"]}, (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE];
}

message PreflightEvent {
  oneof body {
    option (buf.validate.oneof).required = true;

    common.progress.v1.OperationEvent progress = 1;
    PreflightResponse response = 2;
  }
}

message PreflightResponse {
  common.environment.v1.Tier infra_tier = 1;

  bool infrastructure_present = 2;

  Identity identity = 3;

  repeated CredentialProblem credential_problems = 4;

  repeated string known_slugs = 5;

  repeated DomainClaim domain_claims = 6;

  PreviewWildcard preview_wildcard = 7;

  BootstrapStatus bootstrap = 8;

  repeated HostCheck host_checks = 10;

  map<string, string> container_archs = 12 [(buf.validate.field).map.values.string = {in: ["amd64", "arm64"]}];

  bool hostname_required = 13;
}

message WorkerCeiling {
  string compute = 1 [(buf.validate.field).string.min_len = 1];

  google.protobuf.Duration max_duration = 2;
}


message PreviewWildcard {
  string base_domain = 1;

  string edge_scope = 2;

  bool route_installed = 5;

  CertificateState certificate = 6;

  string renewal_status = 7;

  int64 expires_at = 8;

  bool expiring_soon = 9;
}

message HostCheck {
  enum Verdict {
    VERDICT_UNSPECIFIED = 0;
    VERDICT_PASS = 1;
    VERDICT_NEEDS_ACTION = 2;
    VERDICT_FAIL = 3;
  }

  string subject = 1;

  Verdict verdict = 2;

  string finding = 3;

  string fix = 4;
}

message DomainClaim {
  enum Status {
    STATUS_UNSPECIFIED = 0;
    STATUS_UNCLAIMED = 1;
    STATUS_CLAIMED = 2;
  }

  string hostname = 1;

  Status status = 2;

  string owner = 3;

  string cause = 4;
}

message Identity {
  string provider = 1;

  string account = 2;

  string principal = 3;

  string edge_scope = 6;

  repeated Detail details = 7;

  string location = 8;
}

message Detail {
  string label = 1;

  string value = 2;
}

message CredentialProblem {
  string provider = 1;
  string message = 2;
  string hint = 3;
}

message Promotion {
  string promotion_id = 1;
  int64 ts = 2;
  map<string, string> releases = 3;
  string tag = 4;
  common.progress.v1.Propagation propagation = 5;
}

message PromotionHistoryEntry {
  Promotion promotion = 1;
  bool active = 2;
  bool unpromoted = 3;
}

message ListPromotionsRequest {
  string slug = 1 [(buf.validate.field).string = {pattern: "^[a-z0-9]+(-[a-z0-9]+)*$", max_len: 63}];

  EdgeSelection edge = 2;
}

message ListPromotionsResponse {
  repeated PromotionHistoryEntry promotions = 1;
}

message RollbackRequest {
  string slug = 1 [(buf.validate.field).string = {pattern: "^[a-z0-9]+(-[a-z0-9]+)*$", max_len: 63}];

  string to = 2;

  string tag = 3 [(buf.validate.field).string = {pattern: "^[A-Za-z0-9._-]*$", max_len: 64}];

  EdgeSelection edge = 4;
}

message RollbackResponse {
  Promotion promoted = 1;
  repeated string warnings = 2;
}

message RemoveStalePromotionsRequest {
  string slug = 1 [(buf.validate.field).string = {pattern: "^[a-z0-9]+(-[a-z0-9]+)*$", max_len: 63}];

  int32 keep_n = 2 [(buf.validate.field).int32.gte = 0];

  common.environment.v1.Environment environment = 3;

  EdgeSelection edge = 4;
}

message Question {
  string id = 1;

  string finding = 2;

  string prompt = 3;

  string remedy = 4;
}

message ConfirmRequest {
  string question_id = 1 [(buf.validate.field).string.min_len = 1];
}

message ConfirmResponse {}

message Refusal {
  RefusalCode code = 1;
}

enum RefusalCode {
  REFUSAL_CODE_UNSPECIFIED = 0;

  REFUSAL_CODE_INVALID = 1;

  REFUSAL_CODE_NOT_READY = 2;

  REFUSAL_CODE_DENIED = 3;

  REFUSAL_CODE_BUSY = 4;

  REFUSAL_CODE_UNKNOWN_OPTION = 5;

  REFUSAL_CODE_UNSUPPORTED = 6;
}

message DescribeConnectorTargetRequest {}

message DescribeConnectorTargetResponse {
  string target_fingerprint = 1;

  string hostname = 2;

  string arch = 3;

  InstalledConnector installed = 4;

  string os = 5;
}

message InstalledConnector {
  string version = 1;

  string public_key = 2;

  string compute = 3;
}

message InstallConnectorRequest {
  bytes binary = 1 [(buf.validate.field).bytes.min_len = 1];

  string version = 2 [(buf.validate.field).string.min_len = 1];

  bytes config_json = 3 [(buf.validate.field).bytes.min_len = 1];

  string compute = 4 [(buf.validate.field).string = {in: ["serverless", "container"]}, (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE];
}

message RemoveConnectorRequest {}

message ReadLogsRequest {
  string slug = 1 [(buf.validate.field).string = {pattern: "^[a-z0-9]+(-[a-z0-9]+)*$", max_len: 63}];

  common.environment.v1.Environment environment = 2;

  EdgeSelection edge = 3;

  repeated string apps = 4;

  bool all_releases = 5;

  google.protobuf.Timestamp since = 6;

  google.protobuf.Timestamp until = 7;

  uint32 limit = 8 [(buf.validate.field).uint32 = {gte: 1, lte: 10000}];

  string contains = 9;

  bool tail = 10;
}

message ReadLogsResponse {
  oneof body {
    LogBatch batch = 1;

    LogNotice notice = 2;
  }
}

message LogBatch {
  repeated LogEntry entries = 1;
}

message LogEntry {
  google.protobuf.Timestamp time = 1;

  string app = 2;

  string source = 3;

  string release = 4;

  string instance = 5;

  LogStream stream = 6;

  string message = 7;

  string severity = 8;

  bool failure = 9;
}

enum LogStream {
  LOG_STREAM_UNSPECIFIED = 0;

  LOG_STREAM_STDOUT = 1;

  LOG_STREAM_STDERR = 2;
}

message LogNotice {
  enum Kind {
    KIND_UNSPECIFIED = 0;

    KIND_CAUGHT_UP = 1;

    KIND_SAMPLED = 2;

    KIND_SOURCE_GONE = 3;

    KIND_RECONNECTED = 4;
  }

  Kind kind = 1;

  string message = 2;

  uint64 omitted = 3;
}

message ForwardPortsRequest {
  string slug = 1 [(buf.validate.field).string = {pattern: "^[a-z0-9]+(-[a-z0-9]+)*$", max_len: 63}];

  common.environment.v1.Environment environment = 2;

  repeated string bindings = 3 [(buf.validate.field).repeated = {min_items: 1, unique: true}];
}

message ForwardPortsEvent {
  oneof body {
    option (buf.validate.oneof).required = true;

    common.progress.v1.OperationEvent progress = 1;
    ForwardPortsResponse response = 2;
  }
}

message ForwardPortsResponse {
  repeated common.bindings.v1.Binding bindings = 1 [debug_redact = true];

  repeated string unforwarded = 2;

  BindingProxy binding_proxy = 3 [debug_redact = true];
}

message BindingProxy {
  string address = 1 [(buf.validate.field).string.min_len = 1];

  string session_token = 2 [(buf.validate.field).string.min_len = 1];
}
