syntax = "proto3";
package cli.result.v1;

option go_package = "github.com/ocelhq/ocel/pkg/proto/cli/result/v1;resultv1";

import "common/environment/v1/environment.proto";
import "google/protobuf/struct.proto";
import "provider/cost/v1/cost.proto";

message BindingSetResult {
  string name = 1;

  string owner = 2;

  uint64 version = 3;
}

message BindingRemoveResult {
  string name = 1;

  bool removed = 2;
}

message BindingListResult {
  repeated BindingSummary bindings = 1;
}

message BindingGenerateResult {
  string path = 1;

  repeated BindingSummary bindings = 2;
}

message BindingSummary {
  string name = 1;

  string type = 2;

  string source = 3;

  string owner = 4;

  uint64 version = 5;
}

message DomainStatusResult {
  bool ready = 1;

  repeated string records_written = 2;

  repeated string manual_records = 3;

  repeated DomainHostStatus hosts = 4;
}

message DomainHostStatus {
  string hostname = 1;

  bool declared = 2;

  bool ready = 3;

  string pending = 4;

  Certificate certificate = 5;

  string serving_pointer = 6;
}

message Certificate {
  string id = 1;

  string status = 2;

  string renewal_status = 3;

  string expires_at = 4;

  bool expiring_soon = 5;

  repeated string records_written = 6;

  repeated string manual_records = 7;

  string last_probe_at = 8;

  bool last_probe_ok = 9;
}

message CostScanResult {
  provider.cost.v1.ResourceSet resources = 1;

  provider.cost.v1.Estimate estimate = 2;

  repeated string assumptions = 3;
}

message DeploymentListResult {
  repeated DeploymentSummary deployments = 1;
}

message DeploymentSummary {
  string promotion_id = 1;

  string tag = 2;

  string created_at = 3;

  map<string, string> builds = 4;

  DeploymentState state = 5;
}

enum DeploymentState {
  DEPLOYMENT_STATE_UNSPECIFIED = 0;
  DEPLOYMENT_STATE_ACTIVE = 1;
  DEPLOYMENT_STATE_UNPROMOTED = 2;
  DEPLOYMENT_STATE_SUPERSEDED = 3;
}

message PreviewListResult {
  repeated PreviewSummary previews = 1;
}

message PreviewSummary {
  string identity = 1;

  common.environment.v1.Lifecycle lifecycle = 2;

  string label = 3;

  string created_at = 4;

  repeated string alias_urls = 5;
}

message DomainListResult {
  repeated DomainHostStatus hosts = 1;
}

message PreviewDomainResult {
  string base_domain = 1;

  string edge_scope = 2;

  bool route_installed = 3;

  Certificate certificate = 4;

  repeated string projects = 5;
}

message ConnectorStatusResult {
  repeated ConnectorStatus connectors = 1;
}

message ConnectorStatus {
  string target = 1;

  string vendor = 2;

  string compute = 3;

  string reach = 4;

  string url = 5;

  string version = 6;

  repeated string capabilities = 7;

  ConnectorLiveness liveness = 8;

  string connected_at = 9;

  string last_seen_at = 10;

  ConnectorDenial last_denied = 11;
}

enum ConnectorLiveness {
  CONNECTOR_LIVENESS_UNSPECIFIED = 0;
  CONNECTOR_LIVENESS_ONLINE = 1;
  CONNECTOR_LIVENESS_OFFLINE = 2;
  CONNECTOR_LIVENESS_NEVER_CONNECTED = 3;
}

message ConnectorDenial {
  string verb = 1;

  string at = 2;

  string message = 3;
}

enum DoctorVerdict {
  DOCTOR_VERDICT_UNSPECIFIED = 0;

  DOCTOR_VERDICT_PASS = 1;

  DOCTOR_VERDICT_WARN = 2;

  DOCTOR_VERDICT_FAIL = 3;

  DOCTOR_VERDICT_NEUTRAL = 4;
}

message DoctorResult {
  DoctorVerdict verdict = 1;

  int32 problems = 2;

  int32 warnings = 3;

  repeated DoctorSection sections = 4;
}

message DoctorSection {
  string name = 1;

  string identity = 2;

  repeated DoctorCheck checks = 3;
}

message DoctorCheck {
  DoctorVerdict verdict = 1;

  string text = 2;

  repeated string detail = 3;

  string fix = 4;
}

message EnvCoordinate {
  string project = 1;

  string folder = 2;

  string key = 3;

  string environment = 4;
}

message EnvListResult {
  common.environment.v1.Tier tier = 1;

  repeated EnvValueSummary values = 2;
}

message EnvValueSummary {
  EnvCoordinate coordinate = 1;

  string description = 2;

  string group = 3;

  bool orphaned = 4;

  int64 version = 5;

  int64 size = 6;

  string updated_at = 7;

  string env_source = 8;

  optional EnvCoordinate target = 9;
}

message EnvGetResult {
  common.environment.v1.Tier tier = 1;

  EnvCoordinate coordinate = 2;

  int64 version = 3;

  int64 size = 4;

  string updated_at = 5;

  optional EnvCoordinate target = 6;

  bool revealed = 7;

  optional string value = 8;
}

message EnvRefsResult {
  common.environment.v1.Tier tier = 1;

  EnvCoordinate coordinate = 2;

  repeated EnvCoordinate references = 3;
}

message EnvHistoryResult {
  common.environment.v1.Tier tier = 1;

  EnvCoordinate coordinate = 2;

  repeated EnvVersion versions = 3;
}

message EnvVersion {
  int64 version = 1;

  string created_at = 2;

  int64 size = 3;
}

message EnvSourceResult {
  common.environment.v1.Tier tier = 1;

  string env_source = 2;

  bool owns_values = 3;

  bool scheduled = 4;

  bool can_create = 5;

  bool can_update = 6;

  string last_attempt_at = 7;

  string last_success_at = 8;

  string last_error = 9;

  repeated EnvSourceLink links = 10;

  repeated string credentials = 11;

  string configured_env_source = 12;

  string dev_env_source = 13;

  string dev_local_file = 14;
}

message EnvSourceLink {
  string folder = 1;

  string url = 2;
}

message PermissionsResult {
  repeated PermissionGroup groups = 1;
}

message PermissionGroup {
  string heading = 1;

  google.protobuf.Value document = 2;
}

message LoginResult {
  string email = 1;

  string console_url = 2;
}

message LogoutResult {
  bool logged_out = 1;

  bool session_revoked = 2;
}

message LinkResult {
  ConsoleOrganization organization = 1;

  ConsoleProject project = 2;
}

message ConsoleOrganization {
  string id = 1;

  string name = 2;

  string slug = 3;
}

message ConsoleProject {
  string id = 1;

  string name = 2;

  string slug = 3;
}

message UnlinkResult {
  bool unlinked = 1;
}

message LockResult {
  string path = 1;

  string cli_version = 2;

  repeated PinnedExecutable providers = 3;

  repeated PinnedExecutable connectors = 4;
}

message PinnedExecutable {
  string name = 1;

  map<string, string> digests = 2;
}

message GenerateResult {
  repeated string files = 1;

  int32 client_variable_count = 2;
}

enum ConfigFormat {
  CONFIG_FORMAT_UNSPECIFIED = 0;
  CONFIG_FORMAT_JSON = 1;
  CONFIG_FORMAT_YAML = 2;
  CONFIG_FORMAT_TYPESCRIPT = 3;
}

message InitResult {
  string config_path = 1;

  ConfigFormat format = 2;

  string slug = 3;

  string provider = 4;

  string language = 5;

  optional string sdk_package = 6;
}

message SchemaListResult {
  repeated CommandSchema commands = 1;
}

message CommandSchema {
  string path = 1;

  CommandOutput output = 2;
}

enum CommandOutput {
  COMMAND_OUTPUT_UNSPECIFIED = 0;
  COMMAND_OUTPUT_RESULT = 1;
  COMMAND_OUTPUT_RUN_EVENTS = 2;
}
