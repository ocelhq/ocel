syntax = "proto3";
package cli.stream.v1;

option go_package = "github.com/ocelhq/ocel/pkg/proto/cli/stream/v1;streamv1";

import "buf/validate/validate.proto";
import "common/environment/v1/environment.proto";
import "common/plan/v1/plan.proto";
import "common/progress/v1/progress.proto";
import "google/protobuf/timestamp.proto";

message RunEvent {
  google.protobuf.Timestamp time = 8;
  common.progress.v1.Level level = 9;
  common.progress.v1.Phase phase = 10;
  string subject = 11;
  string message = 12;
  bytes span_id = 13 [(buf.validate.field).bytes.len = 8, (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE];

  oneof body {
    common.progress.v1.Started started = 14;
    common.progress.v1.Ended ended = 15;
    common.progress.v1.Output output = 16;
    common.plan.v1.ChangePlan plan = 1;
    common.progress.v1.DnsManualRecordsEvent dns_manual_records = 18;
    common.progress.v1.ResultEvent outcome = 19;
    WaitingEvent waiting = 3;
    ResumedEvent resumed = 4;
    RunResultEvent result = 5;
    IdentityEvent identity = 7;
  }
}

message IdentityEvent {
  string project = 1;

  common.environment.v1.Tier tier = 2;

  Party origin = 3;

  // Absent when the project has no edge.
  Party edge = 4;
}

// One account a run acts in, at the origin cloud or at the edge.
message Party {
  string vendor = 1;

  string account = 2;

  string principal = 3;

  string location = 4;
}

// A pause the run opened for a human. `url` is where they answer.
message WaitingEvent {
  string url = 2;

  MissingVariables missing = 3;
}

message MissingVariables {
  repeated MissingVariable cells = 1;

  string remedy = 2;

  repeated MissingGroup groups = 3;
}

message MissingVariable {
  string key = 1;

  string folder = 2 [(buf.validate.field).string.pattern = "^(/[^/#[:cntrl:]]+)*$"];

  string reason = 3;

  string description = 4;

  string group = 5 [(buf.validate.field).string.pattern = "^[^#[:cntrl:]]*$"];
}

message MissingGroup {
  string key = 1 [(buf.validate.field).string = {min_len: 1, pattern: "^[^#[:cntrl:]]*$"}];

  string description = 2;
}

// The end of a pause.
message ResumedEvent {
  string reason = 1;
}

message RunResultEvent {
  bool success = 1;

  string detail = 2;

  int64 duration_ms = 3;

  string log_path = 4;

  string headline = 5;

  repeated string url_notes = 7;

  common.progress.v1.FlipBound flip_bound = 8;

  bool interrupted = 9;

  // common.progress.v1.ResultEvent.apps as the provider reported it.
  repeated common.progress.v1.AppResult apps = 10;

  MissingVariables missing = 11;
}
