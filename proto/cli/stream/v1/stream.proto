syntax = "proto3";
package cli.stream.v1;

option go_package = "github.com/ocelhq/ocel/pkg/proto/cli/stream/v1;streamv1";

import "buf/validate/validate.proto";
import "common/environment/v1/environment.proto";
import "common/progress/v1/progress.proto";

message RunEvent {
  common.progress.v1.OperationEvent operation = 1;

  oneof cli {
    WaitingEvent waiting = 20;
    ResumedEvent resumed = 21;
    RunSummary summary = 22;
    IdentityEvent identity = 23;
  }
}

message IdentityEvent {
  string project = 1;

  common.environment.v1.Tier tier = 2;

  Party origin = 3;

  Party edge = 4;
}

message Party {
  string vendor = 1;

  string account = 2;

  string principal = 3;

  string location = 4;
}

message WaitingEvent {
  string url = 2;

  MissingVariables missing = 3;
}

message MissingVariables {
  repeated MissingVariable cells = 1;

  string remedy = 2;

  repeated MissingGroup groups = 3;
}

message MissingVariable {
  string key = 1;

  string folder = 2 [(buf.validate.field).string.pattern = "^(/[^/#[:cntrl:]]+)*$"];

  string reason = 3;

  string description = 4;

  string group = 5 [(buf.validate.field).string.pattern = "^[^#[:cntrl:]]*$"];
}

message MissingGroup {
  string key = 1 [(buf.validate.field).string = {min_len: 1, pattern: "^[^#[:cntrl:]]*$"}];

  string description = 2;
}

message ResumedEvent {
  string reason = 1;
}

message RunSummary {
  bool success = 1;

  string detail = 2;

  int64 duration_ms = 3;

  string log_path = 4;

  string headline = 5;

  repeated string url_notes = 7;

  common.progress.v1.Propagation propagation = 8;

  bool interrupted = 9;

  repeated common.progress.v1.AppResult apps = 10;

  MissingVariables missing = 11;

  bool change_started = 12;

  common.environment.v1.Tier tier = 13;

  Party origin = 14;

  string promotion_id = 15;

  RunError error = 16;
}

message RunError {
  string code = 1 [(buf.validate.field).string.pattern = "^[a-z][a-z0-9_]*(\\.[a-z][a-z0-9_]*)*$"];

  string message = 2;

  optional string hint = 3;

  optional string docs_url = 4;

  bool retryable = 5;
}
