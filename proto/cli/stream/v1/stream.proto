syntax = "proto3";
package cli.stream.v1;

option go_package = "github.com/ocelhq/ocel/pkg/proto/cli/stream/v1;streamv1";

import "buf/validate/validate.proto";
import "common/environment/v1/environment.proto";
import "common/plan/v1/plan.proto";
import "common/progress/v1/progress.proto";

// One event of a run as the CLI tells it. Stable: the arm and its typed fields.
// Presentation, free to change: human text, level, order of concurrent events.
message RunEvent {
  oneof event {
    option (buf.validate.oneof).required = true;

    common.plan.v1.ChangePlan plan = 1;

    // Everything the provider says, verbatim.
    common.progress.v1.OperationEvent operation = 2;

    WaitingEvent waiting = 3;

    ResumedEvent resumed = 4;

    RunResultEvent result = 5;

    // Text belonging to the run rather than to any stage.
    DiagnosticEvent diagnostic = 6;

    // Where the run acts, told once before anything else happens.
    IdentityEvent identity = 7;
  }
}

message IdentityEvent {
  string project = 1;

  common.environment.v1.Tier tier = 2;

  Party origin = 3;

  // Absent when the project has no edge.
  Party edge = 4;
}

// One account a run acts in, at the origin cloud or at the edge.
message Party {
  string vendor = 1;

  string account = 2;

  string principal = 3;

  string location = 4;
}

// A pause the run opened for a human. `url` is where they answer.
message WaitingEvent {
  string url = 2;

  VariablesOwed owed = 3;
}

// The variables a run is owed before it can build, one cell per entry, and
// the one command that fills them in.
message VariablesOwed {
  repeated OwedVariable cells = 1;

  string remedy = 2;
}

message OwedVariable {
  string key = 1;

  string folder = 2 [(buf.validate.field).string.pattern = "^(/[^/#[:cntrl:]]+)*$"];

  string reason = 3;
}

// The end of a pause.
message ResumedEvent {
  string reason = 1;
}

message RunResultEvent {
  bool success = 1;

  string detail = 2;

  int64 duration_ms = 3;

  string log_path = 4;

  string headline = 5;

  string url_note = 7;

  common.progress.v1.FlipBound flip_bound = 8;

  bool interrupted = 9;

  // common.progress.v1.ResultEvent.apps as the provider reported it.
  repeated common.progress.v1.AppResult apps = 10;

  VariablesOwed owed = 11;
}

enum DiagnosticLevel {
  DIAGNOSTIC_LEVEL_UNSPECIFIED = 0;
  DIAGNOSTIC_LEVEL_INFO = 1;
  DIAGNOSTIC_LEVEL_WARNING = 2;
}

message DiagnosticEvent {
  string code = 1;

  string message = 2;

  DiagnosticLevel level = 3;
}
