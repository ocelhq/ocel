syntax = "proto3";
package console.v1;

option go_package = "github.com/ocelhq/ocel/pkg/proto/console/v1;consolev1";

import "buf/validate/validate.proto";
import "common/scope/v1/scope.proto";
import "google/protobuf/timestamp.proto";

message CloudOffer {
  string api_url = 1;

  string provider_url = 2;

  string audience = 3;

  string version = 4;
}

message DescribeRequest {
}

message DescribeResponse {
  string console_version = 1;

  repeated string capabilities = 2;

  CloudOffer cloud = 3;
}

message IssueEndpointTokenRequest {
  string organization_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
    pattern: "^[A-Za-z0-9_-]+$"
  }];

  string endpoint_id = 2 [(buf.validate.field).string.pattern = "^(ocel-cloud|[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})$"];

  repeated common.scope.v1.Scope scopes = 3 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 16
    unique: true
    items: {enum: {defined_only: true, not_in: [0]}}
  }];
}

message IssueEndpointTokenResponse {
  string token = 1 [debug_redact = true];

  google.protobuf.Timestamp expires_at = 2;
}

service ConsoleService {
  rpc Describe(DescribeRequest) returns (DescribeResponse);

  rpc IssueEndpointToken(IssueEndpointTokenRequest) returns (IssueEndpointTokenResponse);
}
