syntax = "proto3";
package deployments.v1;

option go_package = "github.com/ocelhq/ocel/pkg/proto/deployments/v1;deploymentsv1";

import "links/v1/links.proto";
import "resources/v1/env.proto";
import "resources/v1/resources.proto";

service DeploymentService {
    rpc Deploy(DeployRequest) returns (stream DeployEvent);

    rpc Bootstrap(BootstrapRequest) returns (stream DeployEvent);

    rpc DestroyPreview(DestroyPreviewRequest) returns (stream DeployEvent);

    rpc DestroyProject(DestroyProjectRequest) returns (stream DeployEvent);

    rpc PlanDestroyProject(PlanDestroyProjectRequest) returns (PlanDestroyProjectResponse);

    rpc ListEnvironments(ListEnvironmentsRequest) returns (ListEnvironmentsResponse);

    rpc Preflight(PreflightRequest) returns (PreflightResponse);

    rpc ListPromotions(ListPromotionsRequest) returns (ListPromotionsResponse);

    rpc Rollback(RollbackRequest) returns (RollbackResponse);

    rpc Prune(PruneRequest) returns (stream DeployEvent);

    rpc UseDomain(UseDomainRequest) returns (stream DeployEvent);

    rpc ListDomain(ListDomainRequest) returns (ListDomainResponse);

    rpc ReleaseDomain(ReleaseDomainRequest) returns (stream DeployEvent);

    rpc SetLink(SetLinkRequest) returns (SetLinkResponse);

    rpc RemoveLink(RemoveLinkRequest) returns (RemoveLinkResponse);

    rpc ListLinks(ListLinksRequest) returns (ListLinksResponse);
}

message UseDomainRequest {
  Environment.Class class = 1;

  string base_domain = 2;
}

message ListDomainRequest {
  Environment.Class class = 1;
}

message ListDomainResponse {
  GlobalPreviewDomain domain = 1;

  repeated string projects = 2;
}

message ReleaseDomainRequest {
  Environment.Class class = 1;
}

message Environment {
  enum Class {
    CLASS_UNSPECIFIED = 0;
    CLASS_DEVELOPMENT = 1;
    CLASS_PREVIEW = 2;
    CLASS_PRODUCTION = 3;
  }

  enum Lifecycle {
    LIFECYCLE_UNSPECIFIED = 0;
    LIFECYCLE_EPHEMERAL = 1;
    LIFECYCLE_PERSISTENT = 2;
  }

  enum IdentitySource {
    IDENTITY_SOURCE_UNSPECIFIED = 0;
    IDENTITY_SOURCE_GIT = 1;
    IDENTITY_SOURCE_DECLARED = 2;
  }

  Class class = 1;
  Lifecycle lifecycle = 2;

  string identity = 3;
  IdentitySource identity_source = 4;

  string label = 5;
}

message Manifest {
  string schema_version = 1;
  repeated ManifestResource resources = 3;
  repeated ManifestFunction functions = 4;

  reserved 2;

  string slug = 7;

  map<string, DomainList> domains = 5;

  repeated ManifestApp apps = 6;

  repeated ManifestUsage usages = 8;
}

message ManifestUsage {
  string app = 1;
  string resource = 2;
  repeated string files = 3;
}

message DomainList {
  repeated string hostnames = 1;
}

message ManifestApp {
  string name = 1;
  string framework = 2;
  map<string, DomainList> domains = 3;

  repeated ManifestVariable variables = 4;

  string folder = 5;

  string deployment_id = 6;
}

message ManifestVariable {
  string key = 1;
  resources.v1.VariableClass class = 2;

  string value = 3;

  string folder = 4;

  int64 version = 5;
}

message ManifestFunction {
  string logical_name = 1;
  string runtime = 2;
  string handler = 3;
  string artifact_path = 4;
  string framework = 5;
  string route_id = 6;
  string app = 7;
}

message ManifestResource {
  string logical_name = 1;
  resources.v1.ResourceIdentifier resource = 2;

  oneof config {
    resources.v1.PostgresConfig postgres = 3;
    resources.v1.BucketConfig bucket = 4;
  }

  bool linked = 5;
}

message DeployRequest {
  Manifest manifest = 1;

  bytes options = 2;

  string protocol_version = 3;

  Environment environment = 4;

  string tag = 5;

  string edge_kind = 6;

  bytes edge_options = 7;

  Dns dns = 8;

  repeated string allow_degraded = 9;
}

message BootstrapRequest {
  bytes options = 1;

  string protocol_version = 2;

  Environment.Class class = 3;

  string edge_kind = 4;

  bytes edge_options = 5;

  Dns dns = 6;

  repeated string allow_degraded = 7;
}

message Dns {
  string kind = 1;

  string zone = 2;
}

message DestroyPreviewRequest {
  Environment environment = 1;

  bytes options = 2;

  string protocol_version = 3;

  string slug = 4;
}

message DestroyProjectRequest {
  bytes options = 1;

  string protocol_version = 2;

  string slug = 3;

  Environment environment = 4;
}

message PlanDestroyProjectRequest {
  bytes options = 1;

  string protocol_version = 2;

  string slug = 3;
}

message PlanDestroyProjectResponse {
  repeated string app_stacks = 1;

  string infra_stack = 2;

  EdgeStackPlan edge_stack = 3;
}

message EdgeStackPlan {
  message Item {
    enum Action {
      ACTION_UNSPECIFIED = 0;
      ACTION_DELETE = 1;
      ACTION_DISABLE_THEN_DELETE = 2;
      ACTION_KEEP = 3;
    }

    string kind = 1;
    string name = 2;
    Action action = 3;
    string reason = 4;
    bool slow = 5;
  }

  string edge_kind = 1;

  repeated Item items = 2;
}

message ListEnvironmentsRequest {
  bytes options = 1;

  string protocol_version = 2;

  string slug = 3;
}

message ListEnvironmentsResponse {
  repeated PreviewEnvironment environments = 1;
}

message PreviewEnvironment {
  string identity = 1;
  Environment.Lifecycle lifecycle = 2;

  string label = 3;

  int64 created_at = 4;
  int64 expires_at = 5;
}

message PreflightRequest {
  bytes options = 1;

  string protocol_version = 2;

  Environment.Class required_class = 3;

  string slug = 4;

  repeated string domains = 5;
}

message PreflightResponse {
  Environment.Class infra_class = 1;

  bool infrastructure_present = 2;

  Identity identity = 3;

  repeated CredentialProblem credential_problems = 4;

  repeated string known_slugs = 5;

  repeated DomainClaim domain_claims = 6;

  GlobalPreviewDomain global_preview_domain = 7;
}

message GlobalPreviewDomain {
  string base_domain = 1;

  string cloudflare_account = 2;

  uint32 grammar_min = 3;

  uint32 grammar_max = 4;

  bool route_installed = 5;
}

message DomainClaim {
  enum Status {
    STATUS_UNSPECIFIED = 0;
    STATUS_UNCLAIMED = 1;
    STATUS_CLAIMED = 2;
  }

  string hostname = 1;

  Status status = 2;

  string owner = 3;
}

message Identity {
  string aws_account = 1;
  string aws_profile = 2;
  string aws_region = 3;
  string aws_arn = 4;

  string cloudflare_account = 5;
}

message CredentialProblem {
  string provider = 1;
  string message = 2;
  string hint = 3;
}

message Promotion {
  string promotion_id = 1;
  int64 ts = 2;
  map<string, string> builds = 3;
  string tag = 4;
}

message PromotionHistoryEntry {
  Promotion promotion = 1;
  bool active = 2;
}

message ListPromotionsRequest {
  bytes options = 1;

  string protocol_version = 2;

  string slug = 3;
}

message ListPromotionsResponse {
  repeated PromotionHistoryEntry promotions = 1;
}

message RollbackRequest {
  bytes options = 1;

  string protocol_version = 2;

  string slug = 3;

  string to = 4;

  string tag = 5;
}

message RollbackResponse {
  Promotion promoted = 1;
}

message PruneRequest {
  bytes options = 1;

  string protocol_version = 2;

  string slug = 3;

  int32 keep_n = 4;

  Environment environment = 5;
}

message DeployEvent {
  oneof event {
    ProgressEvent progress = 1;
    LogEvent log = 2;
    ResultEvent result = 3;
    StagePlanEvent stage_plan = 4;
    SpanEvent span = 5;
  }
}

enum Phase {
  PHASE_UNSPECIFIED = 0;
  PHASE_UPLOADING = 2;
  PHASE_PROVISIONING = 3;
  PHASE_FINALIZING = 4;
  PHASE_DELETING = 5;

  reserved 1;
  reserved "PHASE_BUILDING";
}

message Stage {
  bytes id = 1;

  bytes parent_id = 2;

  string title = 4;

  reserved 3;
  reserved "position";
}

message StagePlanEvent {
  repeated Stage stages = 1;

  bool final = 2;
}

enum SpanStatus {
  SPAN_STATUS_UNSPECIFIED = 0;
  SPAN_STATUS_OK = 1;
  SPAN_STATUS_ERROR = 2;
}

enum AttributeKey {
  ATTRIBUTE_KEY_UNSPECIFIED = 0;
  ATTRIBUTE_KEY_COMMAND = 1;
  ATTRIBUTE_KEY_STAGE = 2;
  ATTRIBUTE_KEY_APP = 3;
  ATTRIBUTE_KEY_PHASE = 4;
  ATTRIBUTE_KEY_PROVIDER = 5;
  ATTRIBUTE_KEY_EXIT_CODE = 6;
  ATTRIBUTE_KEY_ERROR_KIND = 7;
  ATTRIBUTE_KEY_RESOURCE_COUNT = 8;
  ATTRIBUTE_KEY_BYTES = 9;
  ATTRIBUTE_KEY_RETRY_COUNT = 10;
  ATTRIBUTE_KEY_DURATION_MS = 11;
  ATTRIBUTE_KEY_RESOURCE_TYPE = 12;
  ATTRIBUTE_KEY_RESOURCE_NAME = 13;
}

message SpanAttribute {
  AttributeKey key = 1;
  string value = 2;
}

message SpanEvent {
  bytes span_id = 2;
  bytes parent_span_id = 3;

  string name = 4;

  int64 start_time_unix_nano = 5;
  int64 end_time_unix_nano = 6;

  SpanStatus status = 7;

  repeated SpanAttribute attributes = 9;

  reserved 1, 8;
  reserved "trace_id", "error";
}

message ProgressEvent {
  string message = 1;

  Phase phase = 2;

  optional uint32 current = 3;
  optional uint32 total = 4;

  bytes stage_id = 5;
}

message LogEvent {
  string message = 1;
}

message ResultEvent {
  bool success = 1;
  string error = 2;

  repeated links.v1.Link links = 6;

  repeated FunctionOutput functions = 7;

  repeated string app_urls = 4;

  string promotion_id = 5;

  reserved 3;
  reserved "outputs";
}

message FunctionOutput {
  string logical_name = 2;
  string url = 1;
}

message SetLinkRequest {
  bytes options = 1;

  string protocol_version = 2;

  string slug = 3;

  Environment.Class class = 4;

  string environment = 5;

  links.v1.Link link = 6;

  string owner = 7;
}

message SetLinkResponse {
  uint64 version = 1;
}

message RemoveLinkRequest {
  bytes options = 1;

  string protocol_version = 2;

  string slug = 3;

  Environment.Class class = 4;

  string environment = 5;

  string name = 6;
}

message RemoveLinkResponse {
  bool removed = 1;
}

message ListLinksRequest {
  bytes options = 1;

  string protocol_version = 2;

  string slug = 3;

  Environment.Class class = 4;

  string environment = 5;
}

message ListLinksResponse {
  repeated LinkSummary links = 1;
}

message LinkSummary {
  string name = 1;

  links.v1.LinkType type = 2;

  string source = 3;

  string owner = 4;

  uint64 version = 5;

  repeated PropertyShape properties = 6;
}

message PropertyShape {
  string name = 1;

  string json_type = 2;

  bool list = 3;
}
