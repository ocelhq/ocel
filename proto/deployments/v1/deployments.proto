syntax = "proto3";
package deployments.v1;

option go_package = "github.com/ocelhq/ocel/pkg/proto/deployments/v1;deploymentsv1";

import "buf/validate/validate.proto";
import "links/v1/links.proto";
import "resources/v1/env.proto";
import "resources/v1/resources.proto";

service ProviderService {
    rpc Configure(ConfigureRequest) returns (ConfigureResponse);

    rpc Deploy(DeployRequest) returns (stream DeployEvent);

    rpc Bootstrap(BootstrapRequest) returns (stream DeployEvent);

    rpc DescribeBootstrap(DescribeBootstrapRequest) returns (DescribeBootstrapResponse);

    rpc Teardown(TeardownRequest) returns (stream DeployEvent);

    rpc PlanTeardown(PlanTeardownRequest) returns (PlanTeardownResponse);

    rpc DestroyPreview(DestroyPreviewRequest) returns (stream DeployEvent);

    rpc DestroyProject(DestroyProjectRequest) returns (stream DeployEvent);

    rpc PlanDestroyProject(PlanDestroyProjectRequest) returns (PlanDestroyProjectResponse);

    rpc ListEnvironments(ListEnvironmentsRequest) returns (ListEnvironmentsResponse);

    rpc Preflight(PreflightRequest) returns (PreflightResponse);

    rpc ListPromotions(ListPromotionsRequest) returns (ListPromotionsResponse);

    rpc Rollback(RollbackRequest) returns (RollbackResponse);

    rpc Prune(PruneRequest) returns (stream DeployEvent);

    rpc UseDomain(UseDomainRequest) returns (stream DeployEvent);

    rpc ListDomain(ListDomainRequest) returns (ListDomainResponse);

    rpc PlanReleaseDomain(PlanReleaseDomainRequest) returns (PlanReleaseDomainResponse);

    rpc ReleaseDomain(ReleaseDomainRequest) returns (stream DeployEvent);

    rpc AddDomain(AddDomainRequest) returns (stream DeployEvent);

    rpc RemoveDomain(RemoveDomainRequest) returns (stream DeployEvent);

    rpc DomainStatus(DomainStatusRequest) returns (DomainStatusResponse);
}

message AwsProviderConfig {
  string region = 1;

  repeated string transforms = 2;

  map<string, string> certificates = 3;
}

message ProviderConfig {
  oneof provider {
    AwsProviderConfig aws = 1;
  }
}

message ConfigureRequest {
  ProviderConfig config = 1;
}

message ConfigureResponse {}

message UseDomainRequest {
  Environment.Class class = 1 [(buf.validate.field).enum.const = 1];

  string base_domain = 2;

  EdgeSelection edge = 3;
}

message ListDomainRequest {
  Environment.Class class = 1 [(buf.validate.field).enum.const = 1];
}

message ListDomainResponse {
  GlobalPreviewDomain domain = 1;

  repeated string projects = 2;
}

message ReleaseDomainRequest {
  Environment.Class class = 1 [(buf.validate.field).enum.const = 1];

  EdgeSelection edge = 2;
}

message AddDomainRequest {
  string slug = 1 [(buf.validate.field).string = {pattern: "^[a-z0-9]+(-[a-z0-9]+)*$", max_len: 63}];

  repeated string configured = 2;

  string host = 3;

  EdgeSelection edge = 4;
}

message RemoveDomainRequest {
  string slug = 1 [(buf.validate.field).string = {pattern: "^[a-z0-9]+(-[a-z0-9]+)*$", max_len: 63}];

  repeated string configured = 2;

  string host = 3;

  EdgeSelection edge = 4;
}

message DomainStatusRequest {
  string slug = 1 [(buf.validate.field).string = {pattern: "^[a-z0-9]+(-[a-z0-9]+)*$", max_len: 63}];

  repeated string configured = 2;

  EdgeSelection edge = 3;
}

message DomainStatusResponse {
  repeated DomainHost hosts = 1;

  bool ready = 2;

  repeated string records_written = 3;

  repeated string records_owed = 4;
}

message DomainHost {
  string hostname = 1;

  bool declared = 2;

  string certificate_id = 3;

  string certificate_status = 4;

  string renewal_status = 5;

  int64 expires_at = 6;

  bool expiring_soon = 7;

  repeated string records_written = 8;

  repeated string records_owed = 9;

  int64 last_probe_at = 10;

  bool last_probe_ok = 11;

  string last_probe_edge = 12;

  string serving_pointer = 13;

  bool ready = 14;

  string pending = 15;
}

message Environment {
  enum Class {
    CLASS_UNSPECIFIED = 0;
    CLASS_PREVIEW = 1;
    CLASS_PRODUCTION = 2;
  }

  enum Lifecycle {
    LIFECYCLE_UNSPECIFIED = 0;
    LIFECYCLE_EPHEMERAL = 1;
    LIFECYCLE_PERSISTENT = 2;
  }

  Class class = 1 [(buf.validate.field).enum.defined_only = true];
  Lifecycle lifecycle = 2 [(buf.validate.field).enum.defined_only = true];

  string identity = 3;
}

message Manifest {
  string schema_version = 1 [(buf.validate.field).string.min_len = 1];
  repeated ManifestResource resources = 2;
  repeated ManifestFunction functions = 3;

  string slug = 4 [(buf.validate.field).string = {pattern: "^[a-z0-9]+(-[a-z0-9]+)*$", max_len: 63}];

  map<string, DomainList> domains = 5;

  repeated ManifestApp apps = 6;

  repeated ManifestUsage usages = 7;
}

message ManifestUsage {
  string app = 1;
  string resource = 2;
  repeated string files = 3;
}

message DomainList {
  repeated string hostnames = 1;
}

message ManifestApp {
  string name = 1;
  string framework = 2;
  map<string, DomainList> domains = 3;

  repeated ManifestVariable variables = 4;

  string folder = 5 [(buf.validate.field).string.pattern = "^(/[^/#[:cntrl:]]+)*$"];

  string deployment_id = 6;
}

message ManifestVariable {
  string key = 1;
  resources.v1.VariableClass class = 2 [(buf.validate.field).enum.defined_only = true];

  string value = 3;

  string folder = 4 [(buf.validate.field).string.pattern = "^(/[^/#[:cntrl:]]+)*$"];

  int64 version = 5;
}

message ManifestFunction {
  string logical_name = 1;
  string runtime = 2;
  string handler = 3;
  string artifact_path = 4;
  string framework = 5;
  string route_id = 6;
  string app = 7;
}

message ManifestResource {
  string logical_name = 1;
  resources.v1.ResourceIdentifier resource = 2;

  oneof config {
    resources.v1.PostgresConfig postgres = 3;
    resources.v1.BucketConfig bucket = 4;
  }

  bool linked = 5;
}

message DeployRequest {
  Manifest manifest = 1 [(buf.validate.field).required = true];

  Environment environment = 2;

  string tag = 3 [(buf.validate.field).string = {pattern: "^[A-Za-z0-9._-]*$", max_len: 64}];

  EdgeSelection edge = 4;

  repeated string required_features = 5;
}

message BootstrapRequest {
  Environment.Class class = 1 [(buf.validate.field).enum.defined_only = true];

  repeated string features = 2;

  bool force = 3;
}

message DescribeBootstrapRequest {
  Environment.Class class = 1 [(buf.validate.field).enum.defined_only = true];
}

message DescribeBootstrapResponse {
  repeated Feature features = 1;
}

message Feature {
  string name = 1;

  string summary = 2;

  repeated string depends_on = 3;

  bool enabled = 4;

  repeated string dependents = 5;
}

message Dns {
  string kind = 1;

  string zone = 2;
}

message EdgeSelection {
  string kind = 1;

  Dns dns = 2;

  repeated string allow_degraded = 3;
}

message TeardownRequest {
  Environment.Class class = 1 [(buf.validate.field).enum.defined_only = true];

  EdgeSelection edge = 2;
}

message PlanTeardownRequest {
  Environment.Class class = 1 [(buf.validate.field).enum.defined_only = true];

  EdgeSelection edge = 2;
}

message PlanTeardownResponse {
  string edge_kind = 1;

  repeated TeardownItem items = 2;
}

message DestroyPreviewRequest {
  Environment environment = 1;

  string slug = 2 [(buf.validate.field).string = {pattern: "^[a-z0-9]+(-[a-z0-9]+)*$", max_len: 63}];

  EdgeSelection edge = 3;
}

message DestroyProjectRequest {
  string slug = 1 [(buf.validate.field).string = {pattern: "^[a-z0-9]+(-[a-z0-9]+)*$", max_len: 63}];

  Environment environment = 2;

  EdgeSelection edge = 3;
}

message PlanDestroyProjectRequest {
  string slug = 1 [(buf.validate.field).string = {pattern: "^[a-z0-9]+(-[a-z0-9]+)*$", max_len: 63}];

  Environment environment = 2;

  EdgeSelection edge = 3;
}

message PlanDestroyProjectResponse {
  repeated string app_stacks = 1;

  repeated string infra_stacks = 2;

  EdgeStackPlan edge_stack = 3;

  bool nothing_to_destroy = 4;
}

message PlanReleaseDomainRequest {
  Environment.Class class = 1 [(buf.validate.field).enum.const = 1];
}

message PlanReleaseDomainResponse {
  string base_domain = 1;

  EdgeStackPlan edge_stack = 2;
}

message TeardownItem {
  enum Action {
    ACTION_UNSPECIFIED = 0;
    ACTION_DELETE = 1;
    ACTION_DISABLE_THEN_DELETE = 2;
    ACTION_KEEP = 3;
  }

  string kind = 1;
  string name = 2;
  Action action = 3;
  string reason = 4;
  bool slow = 5;
}

message EdgeStackPlan {
  string edge_kind = 1;

  repeated TeardownItem items = 2;
}

message ListEnvironmentsRequest {
  string slug = 1 [(buf.validate.field).string = {pattern: "^[a-z0-9]+(-[a-z0-9]+)*$", max_len: 63}];
}

message ListEnvironmentsResponse {
  repeated PreviewEnvironment environments = 1;
}

message PreviewEnvironment {
  string identity = 1;
  Environment.Lifecycle lifecycle = 2;

  string label = 3;

  int64 created_at = 4;
  int64 expires_at = 5;
}

message PreflightRequest {
  Environment.Class required_class = 1 [(buf.validate.field).enum.defined_only = true];

  string slug = 2 [(buf.validate.field).string = {pattern: "^[a-z0-9]+(-[a-z0-9]+)*$", max_len: 63}, (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE];

  repeated string domains = 3;

  EdgeSelection edge = 4;

  repeated string required_features = 5;
}

message PreflightResponse {
  Environment.Class infra_class = 1;

  bool infrastructure_present = 2;

  Identity identity = 3;

  repeated CredentialProblem credential_problems = 4;

  repeated string known_slugs = 5;

  repeated DomainClaim domain_claims = 6;

  GlobalPreviewDomain global_preview_domain = 7;
}

message GlobalPreviewDomain {
  string base_domain = 1;

  string edge_scope = 2;

  uint32 grammar_min = 3;

  uint32 grammar_max = 4;

  bool route_installed = 5;

  string certificate_id = 6;

  string certificate_status = 7;

  repeated string records_written = 8;

  repeated string records_owed = 9;

  int64 last_probe_at = 10;

  bool last_probe_ok = 11;

  string last_probe_edge = 12;
}

message DomainClaim {
  enum Status {
    STATUS_UNSPECIFIED = 0;
    STATUS_UNCLAIMED = 1;
    STATUS_CLAIMED = 2;
  }

  string hostname = 1;

  Status status = 2;

  string owner = 3;
}

message Identity {
  string aws_account = 1;
  string aws_profile = 2;
  string aws_region = 3;
  string aws_arn = 4;

  string edge_scope = 5;
}

message CredentialProblem {
  string provider = 1;
  string message = 2;
  string hint = 3;
}

message FlipBound {
  int64 typical_ms = 1;
  bool published = 2;
}

message Promotion {
  string promotion_id = 1;
  int64 ts = 2;
  map<string, string> builds = 3;
  string tag = 4;
  FlipBound flip_bound = 5;
}

message PromotionHistoryEntry {
  Promotion promotion = 1;
  bool active = 2;
}

message ListPromotionsRequest {
  string slug = 1 [(buf.validate.field).string = {pattern: "^[a-z0-9]+(-[a-z0-9]+)*$", max_len: 63}];

  EdgeSelection edge = 2;
}

message ListPromotionsResponse {
  repeated PromotionHistoryEntry promotions = 1;
}

message RollbackRequest {
  string slug = 1 [(buf.validate.field).string = {pattern: "^[a-z0-9]+(-[a-z0-9]+)*$", max_len: 63}];

  string to = 2;

  string tag = 3 [(buf.validate.field).string = {pattern: "^[A-Za-z0-9._-]*$", max_len: 64}];

  EdgeSelection edge = 4;
}

message RollbackResponse {
  Promotion promoted = 1;
}

message PruneRequest {
  string slug = 1 [(buf.validate.field).string = {pattern: "^[a-z0-9]+(-[a-z0-9]+)*$", max_len: 63}];

  int32 keep_n = 2 [(buf.validate.field).int32.gte = 0];

  Environment environment = 3;

  EdgeSelection edge = 4;
}

message DeployEvent {
  oneof event {
    option (buf.validate.oneof).required = true;

    ProgressEvent progress = 1;
    LogEvent log = 2;
    ResultEvent result = 3;
    StagePlanEvent stage_plan = 4;
    SpanEvent span = 5;
    DegradedEvent degraded = 6;
    DnsOwedEvent dns_owed = 7;
  }
}

enum Phase {
  PHASE_UNSPECIFIED = 0;
  PHASE_UPLOADING = 1;
  PHASE_PROVISIONING = 2;
  PHASE_FINALIZING = 3;
  PHASE_DELETING = 4;
}

message Stage {
  bytes id = 1;

  bytes parent_id = 2;

  string title = 3;
}

message StagePlanEvent {
  repeated Stage stages = 1;

  bool final = 2;
}

enum SpanStatus {
  SPAN_STATUS_UNSPECIFIED = 0;
  SPAN_STATUS_OK = 1;
  SPAN_STATUS_ERROR = 2;
}

enum AttributeKey {
  ATTRIBUTE_KEY_UNSPECIFIED = 0;
  ATTRIBUTE_KEY_COMMAND = 1;
  ATTRIBUTE_KEY_STAGE = 2;
  ATTRIBUTE_KEY_APP = 3;
  ATTRIBUTE_KEY_PHASE = 4;
  ATTRIBUTE_KEY_PROVIDER = 5;
  ATTRIBUTE_KEY_EXIT_CODE = 6;
  ATTRIBUTE_KEY_ERROR_KIND = 7;
  ATTRIBUTE_KEY_RESOURCE_COUNT = 8;
  ATTRIBUTE_KEY_BYTES = 9;
  ATTRIBUTE_KEY_RETRY_COUNT = 10;
  ATTRIBUTE_KEY_DURATION_MS = 11;
  ATTRIBUTE_KEY_RESOURCE_TYPE = 12;
  ATTRIBUTE_KEY_RESOURCE_NAME = 13;
}

message SpanAttribute {
  AttributeKey key = 1;
  string value = 2;
}

message SpanEvent {
  bytes span_id = 1 [(buf.validate.field).bytes.len = 8];
  bytes parent_span_id = 2 [(buf.validate.field).bytes.len = 8, (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE];

  string name = 3;

  int64 start_time_unix_nano = 4;
  int64 end_time_unix_nano = 5;

  SpanStatus status = 6;

  repeated SpanAttribute attributes = 7;
}

message ProgressEvent {
  string message = 1;

  Phase phase = 2;

  optional uint32 current = 3;
  optional uint32 total = 4;

  bytes stage_id = 5;
}

message LogEvent {
  string message = 1;
}

message DnsRecord {
  string name = 1;

  string type = 2;

  string value = 3;

  bool proxied = 4;
}

message DnsOwedEvent {
  string headline = 1;

  repeated DnsRecord records = 2;

  repeated string notes = 3;
}

message DegradedEvent {
  string need = 1;

  string detail = 2;
}

message ResultEvent {
  bool success = 1;
  string error = 2;

  repeated links.v1.Link links = 3;

  repeated FunctionOutput functions = 4;

  repeated string app_urls = 5;

  string promotion_id = 6;

  FlipBound flip_bound = 7;

  string url_note = 8;
}

message FunctionOutput {
  string logical_name = 2;
  string url = 1;
}
