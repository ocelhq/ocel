name: test-e2e-deploy

on:
  workflow_dispatch:
    inputs:
      nextjsRef:
        description: "Next.js repo ref (branch/tag/SHA). Match the `next` version frameworks/next/adapter pins."
        default: "v16.2.10"
        type: string
      recordBaseline:
        description: "Record a new known-failure baseline instead of filtering against the committed one"
        default: false
        type: boolean

concurrency:
  group: test-e2e-deploy
  cancel-in-progress: false

env:
  BASELINE_MANIFEST: test/ocel-deploy-tests-manifest.json
  ADAPTER_BASELINE: tests/e2e-next.js/baseline-manifest.json
  NODE_VERSION: "22"
  PNPM_VERSION: "11.10.0"
  # FIXME: must match pinnedPulumiVersion in platform/aws/provider/pulumiruntime/runtime.go —
  # nothing checks that it does, and a mismatch silently warms the wrong directory.
  PULUMI_VERSION: "3.146.0"

permissions:
  contents: read

jobs:
  build:
    name: Build Next.js + adapter
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.E2E_AWS_REGION }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.E2E_CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.E2E_CLOUDFLARE_API_TOKEN }}
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: adapter

      - uses: actions/checkout@v4
        with:
          repository: vercel/next.js
          ref: ${{ inputs.nextjsRef }}
          path: nextjs
          fetch-depth: 25

      - uses: ./adapter/.github/actions/e2e-session
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
          aws-region: ${{ vars.E2E_AWS_REGION }}
          role-to-assume: ${{ secrets.E2E_AWS_ROLE_ARN }}
          role-session-name: ocel-e2e-build-${{ github.run_id }}
          expected-aws-account-id: ${{ secrets.E2E_EXPECTED_AWS_ACCOUNT_ID }}
          expected-cloudflare-account-id: ${{ secrets.E2E_EXPECTED_CLOUDFLARE_ACCOUNT_ID }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: adapter/cli/go.mod
          cache-dependency-path: |
            adapter/cli/go.sum
            adapter/platform/aws/provider/go.sum
            adapter/cloud/edge/cloudflare/go.sum
            adapter/pkg/proto/go.sum
            adapter/sdk/go.sum

      - name: Install & build Next.js
        working-directory: nextjs
        run: pnpm install && pnpm build && pnpm install

      - name: Install Playwright
        working-directory: nextjs
        run: pnpm playwright install --with-deps chromium

      - name: Install & build the adapter workspace
        working-directory: adapter
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter ocel build
          pnpm --filter @framework/next-adapter build
          pnpm --filter @platform/cf-entry build
          pnpm --filter @platform/cf-deployments-store build

      - name: Build the Go binaries for this host
        working-directory: adapter
        run: |
          node scripts/build-native.mjs --host --target cli
          node scripts/build-native.mjs --host --target provider

      - name: Build the ocel sidecar
        working-directory: adapter
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/sidecar" "$GITHUB_WORKSPACE/tarballs"
          for pkg in ocel @ocel/provider-aws @ocel/provider-aws-linux-x64; do
            pnpm --filter "$pkg" exec pnpm pack --pack-destination "$GITHUB_WORKSPACE/tarballs"
          done
          cd "$GITHUB_WORKSPACE/sidecar"
          npm init -y >/dev/null
          npm install --no-audit --no-fund "$GITHUB_WORKSPACE"/tarballs/*.tgz
          test -x node_modules/@ocel/provider-aws-linux-x64/bin/deploy

      - uses: actions/cache/save@v4
        with:
          path: |
            nextjs
            adapter
            sidecar
            ~/.cache/ms-playwright
          key: build-${{ github.sha }}-${{ github.run_id }}

  sweep:
    name: Prepare the shared preview substrate
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    env:
      ADAPTER_DIR: ${{ github.workspace }}/adapter
      OCEL_ACCESS_TOKEN: ${{ secrets.E2E_OCEL_ACCESS_TOKEN }}
      OCEL_API_URL: ${{ vars.E2E_OCEL_API_URL }}
      OCEL_E2E_SIDECAR_DIR: ${{ github.workspace }}/sidecar
      AWS_REGION: ${{ vars.E2E_AWS_REGION }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.E2E_CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.E2E_CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/cache/restore@v4
        with:
          path: |
            nextjs
            adapter
            sidecar
            ~/.cache/ms-playwright
          key: build-${{ github.sha }}-${{ github.run_id }}
          fail-on-cache-miss: true

      - uses: ./adapter/.github/actions/e2e-session
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
          aws-region: ${{ vars.E2E_AWS_REGION }}
          role-to-assume: ${{ secrets.E2E_AWS_ROLE_ARN }}
          role-session-name: ocel-e2e-sweep-${{ github.run_id }}
          expected-aws-account-id: ${{ secrets.E2E_EXPECTED_AWS_ACCOUNT_ID }}
          expected-cloudflare-account-id: ${{ secrets.E2E_EXPECTED_CLOUDFLARE_ACCOUNT_ID }}

      - name: Reclaim every e2e project that is not this run's
        run: node adapter/tests/e2e-next.js/sweep-projects.mjs

      - name: Reconcile the shared preview entry worker
        env:
          OCEL_E2E_PREVIEW_DOMAIN: ${{ vars.E2E_PREVIEW_DOMAIN }}
        run: node adapter/tests/e2e-next.js/reconcile-entry.mjs

  test:
    name: Tests (${{ matrix.group }})
    needs: sweep
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.E2E_AWS_REGION }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.E2E_CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.E2E_CLOUDFLARE_API_TOKEN }}
      TESTS_FILTERS: ${{ inputs.recordBaseline && 'test/deploy-tests-manifest.json' || 'test/deploy-tests-manifest.json,test/ocel-deploy-tests-manifest.json' }}
    strategy:
      fail-fast: false
      matrix:
        group:
          [
            1/20,
            2/20,
            3/20,
            4/20,
            5/20,
            6/20,
            7/20,
            8/20,
            9/20,
            10/20,
            11/20,
            12/20,
            13/20,
            14/20,
            15/20,
            16/20,
            17/20,
            18/20,
            19/20,
            20/20,
          ]
    steps:
      - uses: actions/cache/restore@v4
        with:
          path: |
            nextjs
            adapter
            sidecar
            ~/.cache/ms-playwright
          key: build-${{ github.sha }}-${{ github.run_id }}
          fail-on-cache-miss: true

      - uses: ./adapter/.github/actions/e2e-session
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
          aws-region: ${{ vars.E2E_AWS_REGION }}
          role-to-assume: ${{ secrets.E2E_AWS_ROLE_ARN }}
          role-session-name: ocel-e2e-${{ github.run_id }}-${{ strategy.job-index }}
          role-duration-seconds: "21600"
          expected-aws-account-id: ${{ secrets.E2E_EXPECTED_AWS_ACCOUNT_ID }}
          expected-cloudflare-account-id: ${{ secrets.E2E_EXPECTED_CLOUDFLARE_ACCOUNT_ID }}

      - name: Ensure Playwright browser
        working-directory: nextjs
        run: pnpm playwright install chromium

      - name: Warm the Pulumi runtime before the concurrent deploys install it
        run: |
          set -euo pipefail
          root="$HOME/.ocel/pulumi/$PULUMI_VERSION"
          curl -fsSL https://get.pulumi.com/install.sh | sh -s -- \
            --no-edit-path --install-root "$root" --version "$PULUMI_VERSION"
          "$root/bin/pulumi" version

      - name: Copy the baseline manifest into the Next.js checkout
        if: ${{ !inputs.recordBaseline }}
        run: cp "adapter/$ADAPTER_BASELINE" "nextjs/$BASELINE_MANIFEST"

      - name: Assert the manifest chain puts the same suites in scope the baseline assumes
        run: node adapter/tests/e2e-next.js/assert-filter-scope.mjs nextjs "$TESTS_FILTERS"

      - name: Run deploy tests
        working-directory: nextjs
        env:
          NEXT_TEST_MODE: deploy
          NEXT_E2E_TEST_TIMEOUT: 240000
          IS_TURBOPACK_TEST: 1
          NEXT_ENABLE_ADAPTER: 1
          NEXT_TEST_JOB: 1
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_TEST_CI: 1
          NEXT_EXTERNAL_TESTS_FILTERS: ${{ env.TESTS_FILTERS }}
          NEXT_TEST_EMIT_ALL_OUTPUT: ${{ inputs.recordBaseline && '1' || '' }}

          ADAPTER_DIR: ${{ github.workspace }}/adapter
          NEXT_TEST_DEPLOY_SCRIPT_PATH: ${{ github.workspace }}/adapter/tests/e2e-next.js/deploy.mjs
          NEXT_TEST_DEPLOY_LOGS_SCRIPT_PATH: ${{ github.workspace }}/adapter/tests/e2e-next.js/logs.mjs
          NEXT_TEST_CLEANUP_SCRIPT_PATH: ${{ github.workspace }}/adapter/tests/e2e-next.js/cleanup.mjs

          OCEL_ACCESS_TOKEN: ${{ secrets.E2E_OCEL_ACCESS_TOKEN }}
          OCEL_API_URL: ${{ vars.E2E_OCEL_API_URL }}
          OCEL_E2E_SIDECAR_DIR: ${{ github.workspace }}/sidecar
        shell: bash
        run: |
          node run-tests.js --timings -g ${{ matrix.group }} -c 3 --type e2e \
            2>&1 | tee "$RUNNER_TEMP/deploy-tests.log"

      - name: Collect this group's results into a baseline fragment
        if: ${{ always() && inputs.recordBaseline }}
        run: |
          set -euo pipefail
          group="$(echo '${{ matrix.group }}' | tr '/' '-')"
          node adapter/tests/e2e-next.js/merge-baseline.mjs collect \
            nextjs "$RUNNER_TEMP/deploy-tests.log" "baseline-$group.json"
          echo "BASELINE_FRAGMENT=baseline-$group.json" >> "$GITHUB_ENV"

      - name: Upload this group's baseline fragment
        if: ${{ always() && inputs.recordBaseline }}
        uses: actions/upload-artifact@v4
        with:
          name: baseline-${{ strategy.job-index }}
          path: ${{ env.BASELINE_FRAGMENT }}
          if-no-files-found: warn

  destroy:
    name: Destroy this run's project
    needs: test
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    env:
      ADAPTER_DIR: ${{ github.workspace }}/adapter
      OCEL_ACCESS_TOKEN: ${{ secrets.E2E_OCEL_ACCESS_TOKEN }}
      OCEL_API_URL: ${{ vars.E2E_OCEL_API_URL }}
      OCEL_E2E_SIDECAR_DIR: ${{ github.workspace }}/sidecar
      AWS_REGION: ${{ vars.E2E_AWS_REGION }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.E2E_CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.E2E_CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/cache/restore@v4
        with:
          path: |
            nextjs
            adapter
            sidecar
            ~/.cache/ms-playwright
          key: build-${{ github.sha }}-${{ github.run_id }}
          fail-on-cache-miss: true

      - uses: ./adapter/.github/actions/e2e-session
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
          aws-region: ${{ vars.E2E_AWS_REGION }}
          role-to-assume: ${{ secrets.E2E_AWS_ROLE_ARN }}
          role-session-name: ocel-e2e-destroy-${{ github.run_id }}
          expected-aws-account-id: ${{ secrets.E2E_EXPECTED_AWS_ACCOUNT_ID }}
          expected-cloudflare-account-id: ${{ secrets.E2E_EXPECTED_CLOUDFLARE_ACCOUNT_ID }}

      - name: Destroy the project this run deployed into
        run: node adapter/tests/e2e-next.js/project-teardown.mjs

  baseline:
    name: Merge the recorded baseline
    needs: test
    if: ${{ always() && inputs.recordBaseline }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: adapter

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/download-artifact@v4
        with:
          pattern: baseline-*
          path: fragments
          merge-multiple: true

      - name: Merge every group's fragment
        run: |
          set -euo pipefail
          node adapter/tests/e2e-next.js/merge-baseline.mjs merge baseline-manifest.json fragments/*.json

      - name: Upload the merged baseline for review
        uses: actions/upload-artifact@v4
        with:
          name: baseline-manifest
          path: baseline-manifest.json
