name: test-e2e-deploy

# Next.js's deployment-adapter compatibility harness, run against the Ocel Next
# adapter with NEXT_TEST_MODE=deploy: every suite builds and deploys a real
# isolated app into a disposable AWS + Cloudflare account through
# `ocel preview up`, tests it over the network, and tears it down.
#
# A run deploys into ONE Ocel project, `e2e-<run id>`, and every fixture is an
# ephemeral preview pointer inside it. The project owns the preview wildcard
# domain, so two runs cannot share the account — hence the concurrency group
# below — and a run that dies without reaching `destroy` strands that claim,
# which is what the `sweep` job reclaims.
#
# Manual dispatch only, deliberately. A run deploys hundreds of apps and costs
# real money — it is not something to trigger from a push.
#
# See scripts/e2e-next/README.md for the one-time account setup, the secrets and
# variables this needs, and how to record or promote the known-failure baseline.

on:
  workflow_dispatch:
    inputs:
      nextjsRef:
        description: "Next.js repo ref (branch/tag/SHA). Match the `next` version packages/next-runtime pins."
        default: "v16.2.10"
        type: string
      recordBaseline:
        description: "Record a new known-failure baseline instead of filtering against the committed one"
        default: false
        type: boolean

# One run at a time, account-wide. A run's project claims the preview wildcard
# domain by holding the worker route bound to it, so two runs would contend for
# a claim only one can hold, and `sweep` would tear down a live run's project.
#
# cancel-in-progress is deliberately FALSE: cancelling a run mid-flight kills
# its runners, so nothing tears down the deployed apps or the project, and the
# stranded project keeps the domain claim until something reclaims it. Queueing
# lets the running one reach its `destroy` job. `sweep` is only the backstop for
# the runs that die anyway — a cancelled job, an expired session, a killed
# runner — not the ordinary path.
concurrency:
  group: test-e2e-deploy
  cancel-in-progress: false

env:
  # Where the baseline has to sit inside the Next.js checkout for
  # NEXT_EXTERNAL_TESTS_FILTERS to resolve it (the harness resolves the path
  # against its own cwd). Applied on a normal run so only regressions fail the
  # job; skipped on a recording run, which must see every suite's real outcome.
  BASELINE_MANIFEST: test/ocel-deploy-tests-manifest.json
  # Where this repo keeps it, alongside the scripts that produce it.
  ADAPTER_BASELINE: scripts/e2e-next/baseline-manifest.json
  NODE_VERSION: "22"
  PNPM_VERSION: "11.10.0"

# AWS is reached through OIDC, never a stored key: every job that touches the
# account mints a short-lived role session from the run's own identity token, so
# there is no long-lived credential to leak or rotate. Each such job re-declares
# `id-token: write` — a job-level permissions block replaces this one rather than
# extending it.
permissions:
  contents: read

jobs:
  build:
    name: Build Next.js + adapter
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.E2E_AWS_REGION }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.E2E_CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.E2E_CLOUDFLARE_API_TOKEN }}
      # Next.js builds itself with turbo, so its build is reusable across runs —
      # which nothing else here makes it: the cache below is keyed by run id
      # because it ships one run's artifacts between jobs, not across runs. Turbo
      # reads these from the environment, so the checkout of vercel/next.js needs
      # no change of ours. Unset, turbo builds locally exactly as before.
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: adapter

      - uses: actions/checkout@v4
        with:
          repository: vercel/next.js
          ref: ${{ inputs.nextjsRef }}
          path: nextjs
          fetch-depth: 25

      - uses: ./adapter/.github/actions/e2e-session
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
          aws-region: ${{ vars.E2E_AWS_REGION }}
          role-to-assume: ${{ secrets.E2E_AWS_ROLE_ARN }}
          role-session-name: ocel-e2e-build-${{ github.run_id }}
          expected-aws-account-id: ${{ secrets.E2E_EXPECTED_AWS_ACCOUNT_ID }}
          expected-cloudflare-account-id: ${{ secrets.E2E_EXPECTED_CLOUDFLARE_ACCOUNT_ID }}

      # There is no module at the repo root, so setup-go's default hunt for a
      # root go.sum finds nothing and silently restores no build cache at all —
      # every Go step below then compiles cold. Naming every module's go.sum
      # keys the cache on the whole workspace's dependency set, which is what
      # `go build`/`go generate` here actually span.
      - uses: actions/setup-go@v5
        with:
          go-version-file: adapter/cli/go.mod
          cache-dependency-path: |
            adapter/cli/go.sum
            adapter/cloud/aws/go.sum
            adapter/cloud/edge/cloudflare/go.sum
            adapter/pkg/proto/go.sum
            adapter/sdk/go.sum

      - name: Install & build Next.js
        working-directory: nextjs
        run: pnpm install && pnpm build && pnpm install

      - name: Install Playwright
        working-directory: nextjs
        run: pnpm playwright install --with-deps chromium

      # ocel's built dist is what the sidecar packs. The CLI bundles the
      # builder, the Next adapter and the worker bundles itself at `go generate`.
      - name: Install & build the adapter workspace
        working-directory: adapter
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter ocel build
          pnpm --filter @ocel/next-runtime build
          pnpm --filter @ocel/worker-nextjs build
          pnpm --filter @ocel/worker-deployments-store build

      # The launcher resolves the CLI binary out of packages/native-lib, and the
      # sidecar packs the provider package from there, so HEAD's Go code has to
      # land there first.
      - name: Build the Go binaries for this host
        working-directory: adapter
        run: |
          node scripts/build-native.mjs --host --target cli
          node scripts/build-native.mjs --host --target provider

      # The sidecar is the only thing the harness's temp apps see of Ocel:
      # ocel.config.ts is bundled and executed from the app dir (so `ocel` and
      # @ocel/provider-aws must resolve from there), and providerlocator
      # require.resolve's @ocel/provider-aws-linux-x64 from the app dir too.
      # deploy.mjs symlinks <temp-app>/node_modules/{ocel,@ocel} at this directory.
      - name: Build the ocel sidecar
        working-directory: adapter
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/sidecar" "$GITHUB_WORKSPACE/tarballs"
          for pkg in ocel @ocel/provider-aws @ocel/provider-aws-linux-x64; do
            pnpm --filter "$pkg" exec pnpm pack --pack-destination "$GITHUB_WORKSPACE/tarballs"
          done
          cd "$GITHUB_WORKSPACE/sidecar"
          npm init -y >/dev/null
          npm install --no-audit --no-fund "$GITHUB_WORKSPACE"/tarballs/*.tgz
          test -x node_modules/@ocel/provider-aws-linux-x64/bin/deploy

      - uses: actions/cache/save@v4
        with:
          path: |
            nextjs
            adapter
            sidecar
            ~/.cache/ms-playwright
          key: build-${{ github.sha }}-${{ github.run_id }}

  sweep:
    name: Reclaim projects earlier runs stranded
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    env:
      ADAPTER_DIR: ${{ github.workspace }}/adapter
      OCEL_ACCESS_TOKEN: ${{ secrets.E2E_OCEL_ACCESS_TOKEN }}
      OCEL_API_URL: ${{ vars.E2E_OCEL_API_URL }}
      OCEL_E2E_PREVIEW_DOMAIN: ${{ vars.E2E_OCEL_PREVIEW_DOMAIN }}
      OCEL_E2E_SIDECAR_DIR: ${{ github.workspace }}/sidecar
      AWS_REGION: ${{ vars.E2E_AWS_REGION }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.E2E_CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.E2E_CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/cache/restore@v4
        with:
          path: |
            nextjs
            adapter
            sidecar
            ~/.cache/ms-playwright
          key: build-${{ github.sha }}-${{ github.run_id }}
          fail-on-cache-miss: true

      - uses: ./adapter/.github/actions/e2e-session
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
          aws-region: ${{ vars.E2E_AWS_REGION }}
          role-to-assume: ${{ secrets.E2E_AWS_ROLE_ARN }}
          role-session-name: ocel-e2e-sweep-${{ github.run_id }}
          expected-aws-account-id: ${{ secrets.E2E_EXPECTED_AWS_ACCOUNT_ID }}
          expected-cloudflare-account-id: ${{ secrets.E2E_EXPECTED_CLOUDFLARE_ACCOUNT_ID }}

      # Unconditional, and it fails the run when it cannot finish: whatever it
      # finds holds the preview domain's wildcard route, and deploying into a
      # domain another project still claims fails later and less legibly.
      - name: Reclaim every e2e project that is not this run's
        run: node adapter/scripts/e2e-next/sweep-projects.mjs

  smoke:
    name: Smoke (one app through deploy/logs, kept as the run's canary)
    needs: sweep
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    env:
      ADAPTER_DIR: ${{ github.workspace }}/adapter
      OCEL_ACCESS_TOKEN: ${{ secrets.E2E_OCEL_ACCESS_TOKEN }}
      OCEL_API_URL: ${{ vars.E2E_OCEL_API_URL }}
      OCEL_E2E_PREVIEW_DOMAIN: ${{ vars.E2E_OCEL_PREVIEW_DOMAIN }}
      OCEL_E2E_SIDECAR_DIR: ${{ github.workspace }}/sidecar
      AWS_REGION: ${{ vars.E2E_AWS_REGION }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.E2E_CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.E2E_CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/cache/restore@v4
        with:
          path: |
            nextjs
            adapter
            sidecar
            ~/.cache/ms-playwright
          key: build-${{ github.sha }}-${{ github.run_id }}
          fail-on-cache-miss: true

      # The session's default duration is sized past this job's own cap so the
      # teardown at the end of the job is still holding a live session: an
      # expired one strands the deployment.
      - uses: ./adapter/.github/actions/e2e-session
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
          aws-region: ${{ vars.E2E_AWS_REGION }}
          role-to-assume: ${{ secrets.E2E_AWS_ROLE_ARN }}
          role-session-name: ocel-e2e-smoke-${{ github.run_id }}
          expected-aws-account-id: ${{ secrets.E2E_EXPECTED_AWS_ACCOUNT_ID }}
          expected-cloudflare-account-id: ${{ secrets.E2E_EXPECTED_CLOUDFLARE_ACCOUNT_ID }}

      # Installed off the `nextjs` checkout by the harness's own
      # create-next-install, so the smoke app builds against the same Next the
      # matrix tests whatever nextjsRef was dispatched.
      - name: Stage the smoke app
        run: |
          set -euo pipefail
          node adapter/scripts/e2e-next/stage-smoke-app.mjs nextjs adapter/scripts/e2e-next/smoke-app "$RUNNER_TEMP/smoke-app-dir"
          app=$(cat "$RUNNER_TEMP/smoke-app-dir")
          echo "SMOKE_APP=$app" >> "$GITHUB_ENV"
          echo "staged in $app"

      # Exercises exactly what the harness will: deploy prints only a URL, the
      # URL serves the app, logs carries all three markers. The matrix costs
      # hours and hundreds of deploys, so it only starts once one round trip is
      # known to work — and this deploy is also what initializes the run's
      # project (its first root-stack reconcile), so every matrix deploy after
      # it finds the entrypoint worker and the wildcard route already there.
      #
      # Its pointer is deliberately KEPT for the whole run, as a canary: a URL
      # that stops serving while the matrix is running says the project's
      # entrypoint broke, not that one fixture did. The `destroy` job takes it
      # with the rest of the project.
      - name: Deploy the smoke app
        working-directory: ${{ env.SMOKE_APP }}
        env:
          NEXT_TEST_DIR: ${{ env.SMOKE_APP }}
        run: |
          set -euo pipefail
          url=$(node "$ADAPTER_DIR/scripts/e2e-next/deploy.mjs")
          echo "SMOKE_URL=$url" >> "$GITHUB_ENV"
          echo "deployed to $url"

      - name: Assert the deployment serves a 200
        run: |
          set -euo pipefail
          for attempt in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$SMOKE_URL" || true)
            echo "attempt $attempt: $code"
            if [ "$code" = "200" ]; then
              exit 0
            fi
            sleep 15
          done
          echo "::error::$SMOKE_URL never returned 200"
          exit 1

      # A 200 from every route cannot see revalidation dying: the worker's
      # `revalidates` flag going wrong leaves every route serving correctly and
      # only stops cache entries being rewritten. This asserts a rewrite.
      - name: Assert the ISR route's cache entry is rewritten
        env:
          NEXT_TEST_DEPLOY_URL: ${{ env.SMOKE_URL }}
        run: node "$ADAPTER_DIR/scripts/e2e-next/assert-isr.mjs"

      - name: Assert the logs script emits all three markers
        working-directory: ${{ env.SMOKE_APP }}
        env:
          NEXT_TEST_DIR: ${{ env.SMOKE_APP }}
          NEXT_TEST_DEPLOY_URL: ${{ env.SMOKE_URL }}
        run: |
          set -euo pipefail
          node "$ADAPTER_DIR/scripts/e2e-next/logs.mjs" > logs.txt
          # `|| true` keeps a missing marker from aborting the step under
          # `set -e` before its diagnostic can print. Only the first match
          # counts: the replayed build log carries the fixture's own markers.
          for marker in BUILD_ID DEPLOYMENT_ID IMMUTABLE_ASSET_TOKEN; do
            line=$(grep -m1 "^$marker: " logs.txt || true)
            if [ -z "$line" ]; then
              echo "::error::logs script emitted no $marker marker"
              exit 1
            fi
            echo "$line"
            # IMMUTABLE_ASSET_TOKEN is legitimately undefined for this adapter.
            if [ "$marker" != IMMUTABLE_ASSET_TOKEN ] && [ "$line" = "$marker: undefined" ]; then
              echo "::error::$marker resolved to undefined"
              exit 1
            fi
          done

      - name: Upload the smoke logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logs
          path: |
            ${{ env.SMOKE_APP }}/.adapter-build.log
            ${{ env.SMOKE_APP }}/.ocel/logs/ocel.log
            ${{ env.SMOKE_APP }}/logs.txt
          if-no-files-found: ignore

  test:
    name: Tests (${{ matrix.group }})
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.E2E_AWS_REGION }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.E2E_CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.E2E_CLOUDFLARE_API_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        group:
          [
            1/16,
            2/16,
            3/16,
            4/16,
            5/16,
            6/16,
            7/16,
            8/16,
            9/16,
            10/16,
            11/16,
            12/16,
            13/16,
            14/16,
            15/16,
            16/16,
          ]
    steps:
      - uses: actions/cache/restore@v4
        with:
          path: |
            nextjs
            adapter
            sidecar
            ~/.cache/ms-playwright
          key: build-${{ github.sha }}-${{ github.run_id }}
          fail-on-cache-miss: true

      # 6h, matching the job's own cap: the group deploys and tears down apps
      # for its whole life off this one session, and nothing refreshes it. The
      # role's MaxSessionDuration must be at least 21600 or the assume fails
      # outright at the top of the job — which is the failure mode to want, a
      # shorter session would instead die hours in with apps already deployed.
      - uses: ./adapter/.github/actions/e2e-session
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
          aws-region: ${{ vars.E2E_AWS_REGION }}
          role-to-assume: ${{ secrets.E2E_AWS_ROLE_ARN }}
          role-session-name: ocel-e2e-${{ github.run_id }}-${{ strategy.job-index }}
          role-duration-seconds: "21600"
          expected-aws-account-id: ${{ secrets.E2E_EXPECTED_AWS_ACCOUNT_ID }}
          expected-cloudflare-account-id: ${{ secrets.E2E_EXPECTED_CLOUDFLARE_ACCOUNT_ID }}

      - name: Ensure Playwright browser
        working-directory: nextjs
        run: pnpm playwright install chromium

      - name: Copy the baseline manifest into the Next.js checkout
        if: ${{ !inputs.recordBaseline }}
        run: cp "adapter/$ADAPTER_BASELINE" "nextjs/$BASELINE_MANIFEST"

      - name: Run deploy tests
        working-directory: nextjs
        env:
          NEXT_TEST_MODE: deploy
          NEXT_E2E_TEST_TIMEOUT: 240000
          IS_TURBOPACK_TEST: 1
          NEXT_TEST_JOB: 1
          NEXT_TELEMETRY_DISABLED: 1
          # Takes the harness's retry loop out. A retry redeploys the whole app,
          # and a suite that fails against this adapter fails again — the
          # baseline is what tells a regression from a known failure, so the
          # retries only ever cost deploys. merge-baseline.mjs and lib.mjs's
          # retry-aware collection stay as they are: they read stdout precisely
          # because a retry's `git clean` can delete another suite's results
          # file, which is a claim about the harness, not about this variable.
          NEXT_TEST_CI: 1
          # Empty on a recording run: the manifest excludes known-failing cases,
          # and a recording run has to observe them.
          NEXT_EXTERNAL_TESTS_FILTERS: ${{ !inputs.recordBaseline && env.BASELINE_MANIFEST || '' }}
          # Emits a results file for every suite, not just failing ones, so a
          # recording run can build the baseline from them.
          NEXT_TEST_EMIT_ALL_OUTPUT: ${{ inputs.recordBaseline && '1' || '' }}

          ADAPTER_DIR: ${{ github.workspace }}/adapter
          NEXT_TEST_DEPLOY_SCRIPT_PATH: ${{ github.workspace }}/adapter/scripts/e2e-next/deploy.mjs
          NEXT_TEST_DEPLOY_LOGS_SCRIPT_PATH: ${{ github.workspace }}/adapter/scripts/e2e-next/logs.mjs
          NEXT_TEST_CLEANUP_SCRIPT_PATH: ${{ github.workspace }}/adapter/scripts/e2e-next/cleanup.mjs

          OCEL_ACCESS_TOKEN: ${{ secrets.E2E_OCEL_ACCESS_TOKEN }}
          OCEL_API_URL: ${{ vars.E2E_OCEL_API_URL }}
          OCEL_E2E_PREVIEW_DOMAIN: ${{ vars.E2E_OCEL_PREVIEW_DOMAIN }}
          OCEL_E2E_SIDECAR_DIR: ${{ github.workspace }}/sidecar
        # Tee'd to RUNNER_TEMP, deliberately outside the checkout: the harness
        # runs `git clean -fdx` on a failing suite's directory between retries,
        # and for a top-level test/e2e/<name>.test.ts that is all of test/e2e —
        # anything kept in there is liable to be deleted mid-run.
        shell: bash
        run: |
          node run-tests.js --timings -g ${{ matrix.group }} -c 2 --type e2e \
            2>&1 | tee "$RUNNER_TEMP/deploy-tests.log"

      - name: Collect this group's results into a baseline fragment
        if: ${{ always() && inputs.recordBaseline }}
        run: |
          set -euo pipefail
          group="$(echo '${{ matrix.group }}' | tr '/' '-')"
          node adapter/scripts/e2e-next/merge-baseline.mjs collect \
            nextjs "$RUNNER_TEMP/deploy-tests.log" "baseline-$group.json"
          echo "BASELINE_FRAGMENT=baseline-$group.json" >> "$GITHUB_ENV"

      - name: Upload this group's baseline fragment
        if: ${{ always() && inputs.recordBaseline }}
        uses: actions/upload-artifact@v4
        with:
          name: baseline-${{ strategy.job-index }}
          path: ${{ env.BASELINE_FRAGMENT }}
          if-no-files-found: warn

  destroy:
    name: Destroy this run's project
    needs: [smoke, test]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    env:
      ADAPTER_DIR: ${{ github.workspace }}/adapter
      OCEL_ACCESS_TOKEN: ${{ secrets.E2E_OCEL_ACCESS_TOKEN }}
      OCEL_API_URL: ${{ vars.E2E_OCEL_API_URL }}
      OCEL_E2E_PREVIEW_DOMAIN: ${{ vars.E2E_OCEL_PREVIEW_DOMAIN }}
      OCEL_E2E_SIDECAR_DIR: ${{ github.workspace }}/sidecar
      AWS_REGION: ${{ vars.E2E_AWS_REGION }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.E2E_CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.E2E_CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/cache/restore@v4
        with:
          path: |
            nextjs
            adapter
            sidecar
            ~/.cache/ms-playwright
          key: build-${{ github.sha }}-${{ github.run_id }}
          fail-on-cache-miss: true

      - uses: ./adapter/.github/actions/e2e-session
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
          aws-region: ${{ vars.E2E_AWS_REGION }}
          role-to-assume: ${{ secrets.E2E_AWS_ROLE_ARN }}
          role-session-name: ocel-e2e-destroy-${{ github.run_id }}
          expected-aws-account-id: ${{ secrets.E2E_EXPECTED_AWS_ACCOUNT_ID }}
          expected-cloudflare-account-id: ${{ secrets.E2E_EXPECTED_CLOUDFLARE_ACCOUNT_ID }}

      # `if: always()`, because a failed or cancelled matrix leaves exactly the
      # footprint this exists to remove — including the domain claim, which is
      # account-wide. It takes the whole project: the smoke canary's pointer,
      # every pointer a killed suite never cleaned up, the entrypoint worker,
      # the wildcard route and the deployments-store instance.
      - name: Destroy the project this run deployed into
        run: node adapter/scripts/e2e-next/project-teardown.mjs

  baseline:
    name: Merge the recorded baseline
    needs: test
    if: ${{ always() && inputs.recordBaseline }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: adapter

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/download-artifact@v4
        with:
          pattern: baseline-*
          path: fragments
          merge-multiple: true

      - name: Merge every group's fragment
        run: |
          set -euo pipefail
          node adapter/scripts/e2e-next/merge-baseline.mjs merge baseline-manifest.json fragments/*.json

      # Uploaded rather than committed: the baseline is a claim about what this
      # adapter cannot do yet, and a human decides when to adopt it.
      - name: Upload the merged baseline for review
        uses: actions/upload-artifact@v4
        with:
          name: baseline-manifest
          path: baseline-manifest.json
