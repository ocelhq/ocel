name: AWS Live

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: aws-live-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  live:
    name: aws live conformance
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide whether this change reaches the AWS provider
        id: reach
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags origin "${{ github.base_ref }}"
          changed=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          run=false
          while IFS= read -r file; do
            case "$file" in
              platform/aws/* | pkg/providerkit/* | platform/edge/contract/* | \
              cli/internal/provider/* | cli/internal/cli/bootstrap/* | \
              pnpm-lock.yaml | scripts/floci.sh | scripts/assert-ran.sh | .github/workflows/aws-live.yml)
                run=true
                break
                ;;
            esac
          done <<< "$changed"
          echo "run=$run" >> "$GITHUB_OUTPUT"

      - name: Setup Go
        if: steps.reach.outputs.run == 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: platform/aws/provider/go.mod
          cache-dependency-path: |
            platform/aws/provider/go.sum
            cli/go.sum

      - name: Setup gobuildcache
        if: steps.reach.outputs.run == 'true'
        uses: ./.github/actions/gobuildcache
        with:
          bucket: ${{ vars.GOBUILDCACHE_S3_BUCKET }}
          region: ${{ vars.GOBUILDCACHE_AWS_REGION }}
          role-to-assume: ${{ secrets.GOBUILDCACHE_AWS_ROLE_ARN }}

      - name: Setup pnpm
        if: steps.reach.outputs.run == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 11.10.0

      - name: Setup Node
        if: steps.reach.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: The function payloads the provider embeds
        if: steps.reach.outputs.run == 'true'
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          go generate -C platform/aws/provider ./...

      - name: Pull the emulator both suites run against
        if: steps.reach.outputs.run == 'true'
        run: docker pull floci/floci:latest

      - name: Run the live conformance suite
        if: steps.reach.outputs.run == 'true'
        run: |
          set -euo pipefail
          scripts/floci.sh run "ocel-aws-live-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" -- go test -C platform/aws/provider -race -count=1 -timeout 30m -run '^TestLive' -json ./... | tee live.json

      - name: Assert the live suite ran
        if: steps.reach.outputs.run == 'true'
        run: scripts/assert-ran.sh live.json TestLive

      - name: The node bundle the CLI binary is built around
        if: steps.reach.outputs.run == 'true'
        run: |
          set -euo pipefail
          pnpm --filter ocel build
          go generate -C cli ./...

      - name: Run the CLI e2e on an emulator of its own
        if: steps.reach.outputs.run == 'true'
        run: |
          set -euo pipefail
          scripts/floci.sh run "ocel-aws-e2e-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" -- go test -C platform/aws/provider -race -count=1 -timeout 30m -run '^TestE2E' -json ./... | tee e2e.json

      - name: Assert the e2e ran
        if: steps.reach.outputs.run == 'true'
        run: scripts/assert-ran.sh e2e.json TestE2E

      - name: No emulator left behind
        if: always() && steps.reach.outputs.run == 'true'
        run: |
          for name in "ocel-aws-live-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" "ocel-aws-e2e-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"; do
            scripts/floci.sh destroy "$name" || echo "could not destroy $name"
          done
