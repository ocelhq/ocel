name: Nightly

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: The branch, tag or commit the journey drives and a pass releases as a nightly
        required: true
        default: main
        type: string

concurrency:
  group: nightly
  cancel-in-progress: false

permissions: {}

jobs:
  vps:
    name: vps journey
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write
      packages: write
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    env:
      FORCE_COLOR: "1"
      OCEL_TARGET: vps
      OCEL_JOURNEY_CONCERN: deploy lifecycle sdk kv tasks realtime
      OCEL_JOURNEY_COVERAGE: every-cell
      OCEL_GCE_ZONE: ${{ vars.GCP_VPS_ZONE || 'europe-west1-b' }}
      BOX: nightly-${{ github.run_id }}-${{ github.run_attempt }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.E2E_CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.E2E_CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Name the project this run may spend
        env:
          PROJECT: ${{ vars.GCP_LIVE_PROJECT }}
          WIF: ${{ vars.GCP_WIF_PROVIDER }}
          ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
          ZONE: ${{ vars.E2E_PREVIEW_DOMAIN }}
        run: |
          set -euo pipefail
          for named in PROJECT WIF ACCOUNT ZONE; do
            if [ -z "${!named}" ]; then
              echo "the repository variable behind $named is unset, and this run brings up a real VM" >&2
              exit 1
            fi
          done

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Name the commit this run drives
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Take the identity this run acts as
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ vars.GCP_LIVE_PROJECT }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: The gcloud the box is brought up with
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - uses: ./.github/actions/node-workspace
        with:
          turbo-token: ${{ secrets.TURBO_TOKEN }}
          turbo-team: ${{ vars.TURBO_TEAM }}

      - name: The node bundles the fixtures import
        run: pnpm turbo run build --filter=ocel --filter=@ocel/transforms

      - name: Guard the Cloudflare account the cells it fronts deploy into
        env:
          EXPECTED_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.E2E_EXPECTED_CLOUDFLARE_ACCOUNT_ID }}
        run: tests/next-compat/guard-cloudflare.sh

      - name: Name the zone this run may touch
        env:
          ZONE: ${{ vars.E2E_PREVIEW_DOMAIN }}
        run: |
          set -euo pipefail
          ZONE=${ZONE#\*.}
          echo "OCEL_JOURNEY_ZONE=$ZONE" >> "$GITHUB_ENV"

      - name: The Docker the image build on this runner needs
        uses: ./.github/actions/containerd-docker

      - name: Setup Go
        uses: ./.github/actions/go
        with:
          caches: modules,build
          build-scope: binaries

      - uses: ./.github/actions/goreleaser

      - name: Build the binaries the journey drives
        run: |
          set -euo pipefail
          node scripts/snapshot.mjs | tee -a "$GITHUB_ENV"

      - name: Reclaim boxes a run that died left behind
        run: scripts/gce.sh sweep

      - name: Bring up the box this run deploys to
        run: |
          set -euo pipefail
          eval "$(scripts/gce.sh create "$BOX")"
          {
            echo "OCEL_VPS_HOST=$OCEL_GCE_ADDR"
            echo "OCEL_VPS_USER=$OCEL_GCE_USER"
            echo "OCEL_VPS_IDENTITY_FILE=$OCEL_GCE_KEY"
          } >> "$GITHUB_ENV"

      - name: Reclaim journey images a run that died left in the registry
        id: registry
        env:
          GH_TOKEN: ${{ github.token }}
        run: pnpm --filter @ocel-tests/journeys sweep:registry --target vps

      - name: Run the journey
        env:
          OCEL_JOURNEY_REGISTRY_USER: ${{ github.actor }}
          OCEL_JOURNEY_REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm --filter @ocel-tests/journeys journey

      - name: No journey image left in the registry
        if: ${{ always() && steps.registry.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: pnpm --filter @ocel-tests/journeys sweep:registry --target vps --own

      - name: No box left behind
        if: always()
        run: scripts/gce.sh destroy "$BOX" || echo "could not destroy $BOX"

      - name: Pack the evidence
        if: always()
        run: |
          set -euo pipefail
          mkdir -p tests/journeys/output
          tar -czf "$RUNNER_TEMP/journey-evidence.tgz" \
            --exclude='*/node_modules' \
            --exclude='*/node_modules/*' \
            --exclude='*/trees/*/packages' \
            -C tests/journeys output

      - name: Upload the evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vps-nightly-evidence
          path: ${{ runner.temp }}/journey-evidence.tgz
          if-no-files-found: warn

  release:
    name: release
    needs: vps
    runs-on: ubuntu-latest
    environment: release
    permissions: {}
    steps:
      - name: Mint the release app's token
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.vps.outputs.sha }}
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}

      - name: Take the versions the repository pins
        id: versions
        uses: ./.github/actions/versions

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.versions.outputs.node }}

      - name: Name the nightly this commit releases
        id: plan
        env:
          SHA: ${{ needs.vps.outputs.sha }}
        run: |
          set -euo pipefail
          node scripts/release/nightly.mjs plan "$SHA" > "$RUNNER_TEMP/plan"
          cat "$RUNNER_TEMP/plan" >> "$GITHUB_OUTPUT"
          if grep -q '^skip=' "$RUNNER_TEMP/plan"; then
            echo "no nightly: $(sed -n 's/^skip=//p' "$RUNNER_TEMP/plan")"
          else
            echo "releasing $(sed -n 's/^version=//p' "$RUNNER_TEMP/plan") from $SHA"
          fi

      - uses: ./.github/actions/node-workspace
        if: steps.plan.outputs.version != ''
        with:
          turbo-token: ${{ secrets.TURBO_TOKEN }}
          turbo-team: ${{ vars.TURBO_TEAM }}

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        if: steps.plan.outputs.version != ''

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
        if: steps.plan.outputs.version != ''

      - name: Stamp the version
        if: steps.plan.outputs.version != ''
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: node scripts/release/version.mjs "$VERSION"

      - name: Tag a commit off main that carries it, which fires the binaries workflow
        if: steps.plan.outputs.version != ''
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SLUG: ${{ steps.app.outputs.app-slug }}
          VERSION: ${{ steps.plan.outputs.version }}
          SHA: ${{ needs.vps.outputs.sha }}
        run: |
          set -euo pipefail
          id=$(gh api "users/${SLUG}[bot]" --jq .id)
          git config user.name "${SLUG}[bot]"
          git config user.email "${id}+${SLUG}[bot]@users.noreply.github.com"
          git switch --detach
          git add --all
          git commit -m "chore(release): v$VERSION"
          git tag -a "v$VERSION" -m "ocel $VERSION, nightly of $SHA"
          git push origin "refs/tags/v$VERSION"

  prune:
    name: prune
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    environment: release
    permissions: {}
    steps:
      - name: Mint the release app's token
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Take the versions the repository pins
        id: versions
        uses: ./.github/actions/versions

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.versions.outputs.node }}

      - name: Delete the nightlies older than thirty days, release then tag
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          set -euo pipefail
          git ls-remote --tags --refs origin 'v*' | sed 's#.*refs/tags/##' |
            node scripts/release/nightly.mjs stale 30 > "$RUNNER_TEMP/stale"
          if [ ! -s "$RUNNER_TEMP/stale" ]; then
            echo "no nightly is older than thirty days"
            exit 0
          fi
          while read -r tag; do
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json tagName > /dev/null 2>&1; then
              if ! gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes; then
                echo "::warning::kept $tag: GitHub refused to delete its release"
                continue
              fi
            fi
            if gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag" --silent; then
              echo "deleted $tag"
            else
              echo "::warning::kept the tag $tag: GitHub refused to delete it"
            fi
          done < "$RUNNER_TEMP/stale"
