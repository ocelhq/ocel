name: Nightly

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: The branch, tag or commit the journey drives and a pass releases as a nightly
        required: true
        default: main
        type: string

concurrency:
  group: nightly
  cancel-in-progress: false

permissions: {}

jobs:
  gcp:
    name: gcp journey
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    env:
      NODE_VERSION: "22"
      PNPM_VERSION: "11.10.0"
      BUN_VERSION: "1.4.0"
      FORCE_COLOR: "1"
      OCEL_NAMESPACE: ocel-nightly
      OCEL_GCP_PROJECT: ${{ vars.GCP_LIVE_PROJECT }}
      OCEL_GCP_LIVE_PROJECT: ${{ vars.GCP_LIVE_PROJECT }}
      OCEL_GCP_REGION: ${{ vars.GCP_LIVE_REGION || 'europe-west1' }}
      OCEL_GCP_LIVE_REGION: ${{ vars.GCP_LIVE_REGION || 'europe-west1' }}
      OCEL_TARGET: gcp
      OCEL_JOURNEY_CONCERN: deploy
      OCEL_JOURNEY_COVERAGE: every-cell
    steps:
      - name: Name the project this run may spend
        env:
          PROJECT: ${{ vars.GCP_LIVE_PROJECT }}
          WIF: ${{ vars.GCP_WIF_PROVIDER }}
          ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          for named in PROJECT WIF ACCOUNT; do
            if [ -z "${!named}" ]; then
              echo "the repository variable behind $named is unset, and this run bootstraps a real project" >&2
              exit 1
            fi
          done

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Name the commit this run drives
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Take the identity this run acts as
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ vars.GCP_LIVE_PROJECT }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: The gcloud the harness mints a token with
        uses: google-github-actions/setup-gcloud@v2

      - uses: ./.github/actions/node-workspace
        with:
          turbo-token: ${{ secrets.TURBO_TOKEN }}
          turbo-team: ${{ vars.TURBO_TEAM }}

      - name: The musl targets a rust fixture compiles for
        run: rustup target add x86_64-unknown-linux-musl aarch64-unknown-linux-musl

      - name: Setup Go
        uses: ./.github/actions/go

      - name: The payloads the provider embeds
        run: go generate -C platform/gcp/provider ./...

      - name: Run the suites a real project answers differently
        run: |
          set -euo pipefail
          go test -C platform/gcp/provider -count=1 -timeout 60m \
            -run '^Test(Live|Project)' -json ./... | tee live-gcp.json

      - name: Assert they ran
        run: |
          set -euo pipefail
          scripts/assert-ran.sh live-gcp.json TestLive
          scripts/assert-ran.sh live-gcp.json TestProject

      - name: The node bundle the fixtures import
        run: pnpm turbo run build --filter=ocel

      - name: The Docker the container images are built with
        uses: ./.github/actions/containerd-docker

      - uses: ./.github/actions/goreleaser

      - name: Build the binaries the journey drives
        run: |
          set -euo pipefail
          node scripts/snapshot.mjs | tee -a "$GITHUB_ENV"

      - name: Reclaim what a run that died left behind
        run: pnpm --filter @ocel-tests/journeys sweep --target gcp

      - name: Run the journey
        run: pnpm --filter @ocel-tests/journeys journey

      - name: Take down what this run provisioned
        if: always()
        run: |
          set -uo pipefail
          if [ -z "${OCEL_BIN:-}" ]; then
            echo "no binary was built, so this run provisioned nothing to take down"
            exit 0
          fi
          left=0
          pnpm --filter @ocel-tests/journeys sweep --target gcp --own || left=1
          (cd tests/fixtures/deploy/node && "$OCEL_BIN" --config ocel.gcp.config.ts bootstrap destroy production --yes) \
            || left=1
          exit "$left"

      - name: Pack the evidence
        if: always()
        run: |
          set -euo pipefail
          mkdir -p tests/journeys/output
          tar -czf "$RUNNER_TEMP/journey-evidence.tgz" \
            --exclude='*/node_modules' \
            --exclude='*/node_modules/*' \
            --exclude='*/trees/*/packages' \
            -C tests/journeys output

      - name: Upload the evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gcp-nightly-evidence
          path: ${{ runner.temp }}/journey-evidence.tgz
          if-no-files-found: warn

  release:
    name: release
    needs: gcp
    runs-on: ubuntu-latest
    environment: release
    permissions: {}
    steps:
      - name: Mint the release app's token
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.gcp.outputs.sha }}
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Name the nightly this commit releases
        id: plan
        env:
          SHA: ${{ needs.gcp.outputs.sha }}
        run: |
          set -euo pipefail
          node scripts/release/nightly.mjs plan "$SHA" > "$RUNNER_TEMP/plan"
          cat "$RUNNER_TEMP/plan" >> "$GITHUB_OUTPUT"
          if grep -q '^skip=' "$RUNNER_TEMP/plan"; then
            echo "no nightly: $(sed -n 's/^skip=//p' "$RUNNER_TEMP/plan")"
          else
            echo "releasing $(sed -n 's/^version=//p' "$RUNNER_TEMP/plan") from $SHA"
          fi

      - uses: ./.github/actions/node-workspace
        if: steps.plan.outputs.version != ''
        with:
          turbo-token: ${{ secrets.TURBO_TOKEN }}
          turbo-team: ${{ vars.TURBO_TEAM }}

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        if: steps.plan.outputs.version != ''

      - uses: dtolnay/rust-toolchain@stable
        if: steps.plan.outputs.version != ''

      - name: Stamp the version
        if: steps.plan.outputs.version != ''
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: node scripts/release/version.mjs "$VERSION"

      - name: Tag a commit off main that has the stamped version, which fires the binaries workflow
        if: steps.plan.outputs.version != ''
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SLUG: ${{ steps.app.outputs.app-slug }}
          VERSION: ${{ steps.plan.outputs.version }}
          SHA: ${{ needs.gcp.outputs.sha }}
        run: |
          set -euo pipefail
          id=$(gh api "users/${SLUG}[bot]" --jq .id)
          git config user.name "${SLUG}[bot]"
          git config user.email "${id}+${SLUG}[bot]@users.noreply.github.com"
          git switch --detach
          git add --all
          git commit -m "chore(release): v$VERSION"
          git tag -a "v$VERSION" -m "ocel $VERSION, nightly of $SHA"
          git push origin "refs/tags/v$VERSION"

  prune:
    name: prune
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    environment: release
    permissions: {}
    steps:
      - name: Mint the release app's token
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Delete the nightlies older than thirty days, release then tag
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          set -euo pipefail
          git ls-remote --tags --refs origin 'v*' | sed 's#.*refs/tags/##' |
            node scripts/release/nightly.mjs stale 30 > "$RUNNER_TEMP/stale"
          if [ ! -s "$RUNNER_TEMP/stale" ]; then
            echo "no nightly is older than thirty days"
            exit 0
          fi
          while read -r tag; do
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json tagName > /dev/null 2>&1; then
              if ! gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes; then
                echo "::warning::kept $tag: GitHub refused to delete its release"
                continue
              fi
            fi
            if gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag" --silent; then
              echo "deleted $tag"
            else
              echo "::warning::kept the tag $tag: GitHub refused to delete it"
            fi
          done < "$RUNNER_TEMP/stale"
