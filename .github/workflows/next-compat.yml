name: next-compat

on:
  workflow_dispatch:
    inputs:
      nextjsRef:
        description: "Next.js repo ref (branch/tag/SHA). Match the `next` version frameworks/next/adapter pins."
        default: "v16.2.10"
        type: string
      recordBaseline:
        description: "Record a new known-failure baseline instead of filtering against the committed one"
        default: false
        type: boolean
      target:
        description: "Where the harness deploys: aws-cloudflare, gcp-direct (production per test app), gcp-alb (previews behind the load balancer) or gcp-cloudflare (refused until Cloudflare runs code in front of gcp)"
        default: aws-cloudflare
        type: choice
        options: [aws-cloudflare, gcp-direct, gcp-alb, gcp-cloudflare]

concurrency:
  group: ${{ startsWith(inputs.target, 'gcp') && 'real-gcp' || 'real-aws' }}
  cancel-in-progress: false

env:
  OCEL_COMPAT_TARGET: ${{ inputs.target }}
  OCEL_NAMESPACE: ${{ inputs.target == 'gcp-direct' && 'e2e-nc-direct' || inputs.target == 'gcp-alb' && 'e2e-nc-alb' || inputs.target == 'gcp-cloudflare' && 'e2e-nc-cf' || 'e2e-next-compat' }}
  OCEL_GCP_PROJECT: ${{ vars.E2E_GCP_PROJECT }}
  OCEL_GCP_REGION: ${{ vars.E2E_GCP_REGION }}
  OCEL_PROVIDERS_DIR: ${{ github.workspace }}/adapter/dist/providers
  BASELINE_MANIFEST: test/ocel-deploy-tests-manifest.json
  ADAPTER_BASELINE: ${{ startsWith(inputs.target, 'gcp') && format('tests/next-compat/baseline-manifest.{0}.json', inputs.target) || 'tests/next-compat/baseline-manifest.json' }}
  # FIXME: must match PinnedVersion in pkg/provider/pulumi/runtime.go —
  # nothing checks that it does, and a mismatch silently warms the wrong directory.
  PULUMI_VERSION: "3.146.0"

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.E2E_AWS_REGION }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.E2E_CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.E2E_CLOUDFLARE_API_TOKEN }}
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: adapter

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: vercel/next.js
          ref: ${{ inputs.nextjsRef }}
          path: nextjs
          fetch-depth: 25

      - name: Take the versions the repository pins
        id: versions
        uses: ./adapter/.github/actions/versions
        with:
          working-directory: adapter

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.versions.outputs.node }}

      - name: Refuse a target the harness cannot run, or a filtered run with no baseline to filter against
        working-directory: adapter
        env:
          RECORD: ${{ inputs.recordBaseline }}
        run: |
          set -euo pipefail
          node --input-type=module -e 'import { readCompatTarget } from "./tests/next-compat/lib.mjs"; readCompatTarget();'
          if [ "$RECORD" != true ] && [ ! -f "$ADAPTER_BASELINE" ]; then
            echo "::error::no baseline for $OCEL_COMPAT_TARGET: dispatch with recordBaseline first and commit $ADAPTER_BASELINE"
            exit 1
          fi

      - uses: ./adapter/.github/actions/real-aws-session
        if: ${{ !startsWith(inputs.target, 'gcp') }}
        with:
          node-version: ${{ steps.versions.outputs.node }}
          pnpm-version: ${{ steps.versions.outputs.pnpm }}
          bun-version: ${{ steps.versions.outputs.bun }}
          aws-region: ${{ vars.E2E_AWS_REGION }}
          role-to-assume: ${{ secrets.E2E_AWS_ROLE_ARN }}
          role-session-name: ocel-e2e-build-${{ github.run_id }}
          guard-script: adapter/tests/next-compat/guard-accounts.sh
          expected-aws-account-id: ${{ secrets.E2E_EXPECTED_AWS_ACCOUNT_ID }}
          expected-cloudflare-account-id: ${{ secrets.E2E_EXPECTED_CLOUDFLARE_ACCOUNT_ID }}

      - uses: ./adapter/.github/actions/real-gcp-session
        if: ${{ startsWith(inputs.target, 'gcp') }}
        with:
          node-version: ${{ steps.versions.outputs.node }}
          pnpm-version: ${{ steps.versions.outputs.pnpm }}
          bun-version: ${{ steps.versions.outputs.bun }}
          project: ${{ vars.E2E_GCP_PROJECT }}
          workload-identity-provider: ${{ vars.E2E_GCP_WIF_PROVIDER }}
          service-account: ${{ vars.E2E_GCP_SERVICE_ACCOUNT }}
          guard-script: adapter/tests/next-compat/guard-cloudflare.sh
          expected-cloudflare-account-id: ${{ secrets.E2E_EXPECTED_CLOUDFLARE_ACCOUNT_ID }}

      - name: Setup Go
        uses: ./adapter/.github/actions/go
        with:
          go-version-file: adapter/go.work
          caches: modules,build
          build-scope: binaries

      - name: Install & build Next.js
        working-directory: nextjs
        run: pnpm install && pnpm build && pnpm install

      - name: Install Playwright
        working-directory: nextjs
        run: pnpm playwright install --with-deps chromium

      - name: Install & build the adapter workspace
        working-directory: adapter
        run: |
          pnpm install --frozen-lockfile
          pnpm turbo run build --filter=ocel --filter=@cli/node

      - uses: ./adapter/.github/actions/goreleaser

      - name: Build the Go binaries for this host
        working-directory: adapter
        run: |
          set -euo pipefail
          node scripts/snapshot.mjs > "$RUNNER_TEMP/snapshot.env"
          . "$RUNNER_TEMP/snapshot.env"
          install -D -m 0755 "$OCEL_BIN" packages/cli-linux-x64/bin/ocel

      - name: Build the ocel sidecar
        working-directory: adapter
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/sidecar" "$GITHUB_WORKSPACE/tarballs"
          pnpm --filter ocel exec pnpm pack --pack-destination "$GITHUB_WORKSPACE/tarballs"
          cd "$GITHUB_WORKSPACE/sidecar"
          npm init -y >/dev/null
          npm install --no-audit --no-fund "$GITHUB_WORKSPACE"/tarballs/*.tgz

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            nextjs
            adapter
            sidecar
            ~/.cache/ms-playwright
          key: build-${{ github.sha }}-${{ github.run_id }}

  sweep:
    name: sweep
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    env:
      ADAPTER_DIR: ${{ github.workspace }}/adapter
      OCEL_ACCESS_TOKEN: ${{ secrets.E2E_OCEL_ACCESS_TOKEN }}
      OCEL_CONSOLE_URL: ${{ vars.E2E_OCEL_API_URL }}
      OCEL_E2E_SIDECAR_DIR: ${{ github.workspace }}/sidecar
      AWS_REGION: ${{ vars.E2E_AWS_REGION }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.E2E_CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.E2E_CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            nextjs
            adapter
            sidecar
            ~/.cache/ms-playwright
          key: build-${{ github.sha }}-${{ github.run_id }}
          fail-on-cache-miss: true

      - name: Take the versions the repository pins
        id: versions
        uses: ./adapter/.github/actions/versions
        with:
          working-directory: adapter

      - uses: ./adapter/.github/actions/real-aws-session
        if: ${{ !startsWith(inputs.target, 'gcp') }}
        with:
          node-version: ${{ steps.versions.outputs.node }}
          pnpm-version: ${{ steps.versions.outputs.pnpm }}
          bun-version: ${{ steps.versions.outputs.bun }}
          aws-region: ${{ vars.E2E_AWS_REGION }}
          role-to-assume: ${{ secrets.E2E_AWS_ROLE_ARN }}
          role-session-name: ocel-e2e-sweep-${{ github.run_id }}
          guard-script: adapter/tests/next-compat/guard-accounts.sh
          expected-aws-account-id: ${{ secrets.E2E_EXPECTED_AWS_ACCOUNT_ID }}
          expected-cloudflare-account-id: ${{ secrets.E2E_EXPECTED_CLOUDFLARE_ACCOUNT_ID }}

      - uses: ./adapter/.github/actions/real-gcp-session
        if: ${{ startsWith(inputs.target, 'gcp') }}
        with:
          node-version: ${{ steps.versions.outputs.node }}
          pnpm-version: ${{ steps.versions.outputs.pnpm }}
          bun-version: ${{ steps.versions.outputs.bun }}
          project: ${{ vars.E2E_GCP_PROJECT }}
          workload-identity-provider: ${{ vars.E2E_GCP_WIF_PROVIDER }}
          service-account: ${{ vars.E2E_GCP_SERVICE_ACCOUNT }}
          guard-script: adapter/tests/next-compat/guard-cloudflare.sh
          expected-cloudflare-account-id: ${{ secrets.E2E_EXPECTED_CLOUDFLARE_ACCOUNT_ID }}

      - name: Reclaim every e2e project that is not this run's
        run: node adapter/tests/next-compat/sweep-projects.mjs

      - name: Reconcile the shared preview entry worker
        env:
          OCEL_E2E_PREVIEW_DOMAIN: ${{ vars.E2E_PREVIEW_DOMAIN }}
        run: node adapter/tests/next-compat/reconcile-entry.mjs

  smoke:
    name: smoke
    needs: sweep
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    env:
      ADAPTER_DIR: ${{ github.workspace }}/adapter
      OCEL_ACCESS_TOKEN: ${{ secrets.E2E_OCEL_ACCESS_TOKEN }}
      OCEL_CONSOLE_URL: ${{ vars.E2E_OCEL_API_URL }}
      OCEL_E2E_SIDECAR_DIR: ${{ github.workspace }}/sidecar
      AWS_REGION: ${{ vars.E2E_AWS_REGION }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.E2E_CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.E2E_CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            nextjs
            adapter
            sidecar
            ~/.cache/ms-playwright
          key: build-${{ github.sha }}-${{ github.run_id }}
          fail-on-cache-miss: true

      - name: Take the versions the repository pins
        id: versions
        uses: ./adapter/.github/actions/versions
        with:
          working-directory: adapter

      - uses: ./adapter/.github/actions/real-aws-session
        if: ${{ !startsWith(inputs.target, 'gcp') }}
        with:
          node-version: ${{ steps.versions.outputs.node }}
          pnpm-version: ${{ steps.versions.outputs.pnpm }}
          bun-version: ${{ steps.versions.outputs.bun }}
          aws-region: ${{ vars.E2E_AWS_REGION }}
          role-to-assume: ${{ secrets.E2E_AWS_ROLE_ARN }}
          role-session-name: ocel-e2e-smoke-${{ github.run_id }}
          guard-script: adapter/tests/next-compat/guard-accounts.sh
          expected-aws-account-id: ${{ secrets.E2E_EXPECTED_AWS_ACCOUNT_ID }}
          expected-cloudflare-account-id: ${{ secrets.E2E_EXPECTED_CLOUDFLARE_ACCOUNT_ID }}

      - uses: ./adapter/.github/actions/real-gcp-session
        if: ${{ startsWith(inputs.target, 'gcp') }}
        with:
          node-version: ${{ steps.versions.outputs.node }}
          pnpm-version: ${{ steps.versions.outputs.pnpm }}
          bun-version: ${{ steps.versions.outputs.bun }}
          project: ${{ vars.E2E_GCP_PROJECT }}
          workload-identity-provider: ${{ vars.E2E_GCP_WIF_PROVIDER }}
          service-account: ${{ vars.E2E_GCP_SERVICE_ACCOUNT }}
          guard-script: adapter/tests/next-compat/guard-cloudflare.sh
          expected-cloudflare-account-id: ${{ secrets.E2E_EXPECTED_CLOUDFLARE_ACCOUNT_ID }}

      - name: Warm the Pulumi runtime the provider installs on first deploy
        run: |
          set -euo pipefail
          root="$HOME/.ocel/pulumi/$PULUMI_VERSION"
          curl -fsSL https://get.pulumi.com/install.sh | sh -s -- \
            --no-edit-path --install-root "$root" --version "$PULUMI_VERSION"
          "$root/bin/pulumi" version

      - name: Stage the smoke app
        run: |
          set -euo pipefail
          node adapter/tests/next-compat/stage-smoke-app.mjs nextjs adapter/tests/next-compat/smoke-app "$RUNNER_TEMP/smoke-app-dir"
          app=$(cat "$RUNNER_TEMP/smoke-app-dir")
          echo "SMOKE_APP=$app" >> "$GITHUB_ENV"
          echo "staged in $app"

      - name: Deploy the smoke app
        working-directory: ${{ env.SMOKE_APP }}
        env:
          NEXT_TEST_DIR: ${{ env.SMOKE_APP }}
        run: |
          set -euo pipefail
          url=$(node "$ADAPTER_DIR/tests/next-compat/deploy.mjs")
          echo "SMOKE_URL=$url" >> "$GITHUB_ENV"
          echo "deployed to $url"

      - name: Assert the deployment serves a 200
        run: |
          set -euo pipefail
          for attempt in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$SMOKE_URL" || true)
            echo "attempt $attempt: $code"
            if [ "$code" = "200" ]; then
              exit 0
            fi
            sleep 15
          done
          echo "::error::$SMOKE_URL never returned 200"
          exit 1

      - name: Assert the ISR route's cache entry is rewritten
        env:
          NEXT_TEST_DEPLOY_URL: ${{ env.SMOKE_URL }}
        run: node "$ADAPTER_DIR/tests/next-compat/assert-isr.mjs"

      # A 200 from / cannot see whether node middleware ever ran at all — the
      # top-level-await bug this guards against 502'd every matched request,
      # forever, from a message pointing at the wrong thing.
      - name: Assert node middleware (proxy.ts) actually runs
        env:
          NEXT_TEST_DEPLOY_URL: ${{ env.SMOKE_URL }}
        run: node "$ADAPTER_DIR/tests/next-compat/assert-proxy.mjs"

      - name: Assert the logs script emits all three markers
        working-directory: ${{ env.SMOKE_APP }}
        env:
          NEXT_TEST_DIR: ${{ env.SMOKE_APP }}
          NEXT_TEST_DEPLOY_URL: ${{ env.SMOKE_URL }}
        run: |
          set -euo pipefail
          node "$ADAPTER_DIR/tests/next-compat/logs.mjs" > logs.txt
          for marker in BUILD_ID DEPLOYMENT_ID IMMUTABLE_ASSET_TOKEN; do
            line=$(grep -m1 "^$marker: " logs.txt || true)
            if [ -z "$line" ]; then
              echo "::error::logs script emitted no $marker marker"
              exit 1
            fi
            echo "$line"
            if [ "$marker" != IMMUTABLE_ASSET_TOKEN ] && [ "$line" = "$marker: undefined" ]; then
              echo "::error::$marker resolved to undefined"
              exit 1
            fi
          done

      - name: Upload the smoke logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smoke-logs
          path: |
            ${{ env.SMOKE_APP }}/.adapter-build.log
            ${{ env.SMOKE_APP }}/.ocel/logs/ocel.log
            ${{ env.SMOKE_APP }}/logs.txt
          if-no-files-found: ignore

  test:
    name: test (${{ matrix.group }})
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.E2E_AWS_REGION }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.E2E_CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.E2E_CLOUDFLARE_API_TOKEN }}
      TESTS_FILTERS: ${{ inputs.recordBaseline && 'test/deploy-tests-manifest.json' || 'test/deploy-tests-manifest.json,test/ocel-deploy-tests-manifest.json' }}
    strategy:
      fail-fast: false
      matrix:
        group:
          [
            1/20,
            2/20,
            3/20,
            4/20,
            5/20,
            6/20,
            7/20,
            8/20,
            9/20,
            10/20,
            11/20,
            12/20,
            13/20,
            14/20,
            15/20,
            16/20,
            17/20,
            18/20,
            19/20,
            20/20,
          ]
    steps:
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            nextjs
            adapter
            sidecar
            ~/.cache/ms-playwright
          key: build-${{ github.sha }}-${{ github.run_id }}
          fail-on-cache-miss: true

      - name: Take the versions the repository pins
        id: versions
        uses: ./adapter/.github/actions/versions
        with:
          working-directory: adapter

      - uses: ./adapter/.github/actions/real-aws-session
        if: ${{ !startsWith(inputs.target, 'gcp') }}
        with:
          node-version: ${{ steps.versions.outputs.node }}
          pnpm-version: ${{ steps.versions.outputs.pnpm }}
          bun-version: ${{ steps.versions.outputs.bun }}
          aws-region: ${{ vars.E2E_AWS_REGION }}
          role-to-assume: ${{ secrets.E2E_AWS_ROLE_ARN }}
          role-session-name: ocel-e2e-${{ github.run_id }}-${{ strategy.job-index }}
          role-duration-seconds: "21600"
          guard-script: adapter/tests/next-compat/guard-accounts.sh
          expected-aws-account-id: ${{ secrets.E2E_EXPECTED_AWS_ACCOUNT_ID }}
          expected-cloudflare-account-id: ${{ secrets.E2E_EXPECTED_CLOUDFLARE_ACCOUNT_ID }}

      - uses: ./adapter/.github/actions/real-gcp-session
        if: ${{ startsWith(inputs.target, 'gcp') }}
        with:
          node-version: ${{ steps.versions.outputs.node }}
          pnpm-version: ${{ steps.versions.outputs.pnpm }}
          bun-version: ${{ steps.versions.outputs.bun }}
          project: ${{ vars.E2E_GCP_PROJECT }}
          workload-identity-provider: ${{ vars.E2E_GCP_WIF_PROVIDER }}
          service-account: ${{ vars.E2E_GCP_SERVICE_ACCOUNT }}
          guard-script: adapter/tests/next-compat/guard-cloudflare.sh
          expected-cloudflare-account-id: ${{ secrets.E2E_EXPECTED_CLOUDFLARE_ACCOUNT_ID }}

      - name: Ensure Playwright browser
        working-directory: nextjs
        run: pnpm playwright install chromium

      - name: Warm the Pulumi runtime before the concurrent deploys install it
        run: |
          set -euo pipefail
          root="$HOME/.ocel/pulumi/$PULUMI_VERSION"
          curl -fsSL https://get.pulumi.com/install.sh | sh -s -- \
            --no-edit-path --install-root "$root" --version "$PULUMI_VERSION"
          "$root/bin/pulumi" version

      - name: Copy the baseline manifest into the Next.js checkout
        if: ${{ !inputs.recordBaseline }}
        run: cp "adapter/$ADAPTER_BASELINE" "nextjs/$BASELINE_MANIFEST"

      - name: Assert the manifest chain puts the same suites in scope the baseline assumes
        run: node adapter/tests/next-compat/assert-filter-scope.mjs nextjs "$TESTS_FILTERS"

      - name: Run deploy tests
        working-directory: nextjs
        env:
          NEXT_TEST_MODE: deploy
          NEXT_E2E_TEST_TIMEOUT: 240000
          IS_TURBOPACK_TEST: 1
          NEXT_ENABLE_ADAPTER: 1
          NEXT_TEST_JOB: 1
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_TEST_CI: 1
          NEXT_EXTERNAL_TESTS_FILTERS: ${{ env.TESTS_FILTERS }}
          NEXT_TEST_EMIT_ALL_OUTPUT: ${{ inputs.recordBaseline && '1' || '' }}

          ADAPTER_DIR: ${{ github.workspace }}/adapter
          NEXT_TEST_DEPLOY_SCRIPT_PATH: ${{ github.workspace }}/adapter/tests/next-compat/deploy.mjs
          NEXT_TEST_DEPLOY_LOGS_SCRIPT_PATH: ${{ github.workspace }}/adapter/tests/next-compat/logs.mjs
          NEXT_TEST_CLEANUP_SCRIPT_PATH: ${{ github.workspace }}/adapter/tests/next-compat/cleanup.mjs

          OCEL_ACCESS_TOKEN: ${{ secrets.E2E_OCEL_ACCESS_TOKEN }}
          OCEL_CONSOLE_URL: ${{ vars.E2E_OCEL_API_URL }}
          OCEL_E2E_SIDECAR_DIR: ${{ github.workspace }}/sidecar
        shell: bash
        run: |
          node run-tests.js --timings -g ${{ matrix.group }} -c 3 --type e2e \
            2>&1 | tee "$RUNNER_TEMP/deploy-tests.log"

      - name: Collect this group's results into a baseline fragment
        if: ${{ always() && inputs.recordBaseline }}
        run: |
          set -euo pipefail
          group="$(echo '${{ matrix.group }}' | tr '/' '-')"
          node adapter/tests/next-compat/merge-baseline.mjs collect \
            nextjs "$RUNNER_TEMP/deploy-tests.log" "baseline-$group.json"
          echo "BASELINE_FRAGMENT=baseline-$group.json" >> "$GITHUB_ENV"

      - name: Upload this group's baseline fragment
        if: ${{ always() && inputs.recordBaseline }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: baseline-${{ strategy.job-index }}
          path: ${{ env.BASELINE_FRAGMENT }}
          if-no-files-found: warn

  tiers:
    name: tier (${{ matrix.tier }})
    needs: [smoke, test]
    if: ${{ !cancelled() && needs.smoke.result == 'success' && !startsWith(inputs.target, 'gcp') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        tier: [bootstrap, deploy]
    env:
      ADAPTER_DIR: ${{ github.workspace }}/adapter
      NEXTJS_DIR: ${{ github.workspace }}/nextjs
      OCEL_ACCESS_TOKEN: ${{ secrets.E2E_OCEL_ACCESS_TOKEN }}
      OCEL_CONSOLE_URL: ${{ vars.E2E_OCEL_API_URL }}
      OCEL_E2E_SIDECAR_DIR: ${{ github.workspace }}/sidecar
      AWS_REGION: ${{ vars.E2E_AWS_REGION }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.E2E_CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.E2E_CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            nextjs
            adapter
            sidecar
            ~/.cache/ms-playwright
          key: build-${{ github.sha }}-${{ github.run_id }}
          fail-on-cache-miss: true

      - name: Take the versions the repository pins
        id: versions
        uses: ./adapter/.github/actions/versions
        with:
          working-directory: adapter

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.versions.outputs.node }}

      - name: Ask the provider what this tier may do
        run: |
          set -euo pipefail
          node adapter/tests/next-compat/credential-tier.mjs \
            policy-parts ${{ matrix.tier }} "$RUNNER_TEMP/tier-policy" \
            > "$RUNNER_TEMP/tier-policy-parts"

      - name: Assume the session that installs this tier's policy
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.E2E_AWS_ROLE_ARN }}
          aws-region: ${{ vars.E2E_AWS_REGION }}
          role-session-name: ocel-e2e-tier-policy-${{ matrix.tier }}-${{ github.run_id }}

      - name: Install the document as the policies this tier's session is bounded by
        id: tier-policy
        env:
          TIER_POLICY_PREFIX: ocel-e2e-tier-${{ matrix.tier }}-${{ github.run_id }}-
        run: |
          set -uo pipefail
          created="$RUNNER_TEMP/tier-policy-arns"
          : > "$created"
          publish() {
            {
              echo "arns<<TIER_POLICY_ARNS"
              cat "$created"
              echo "TIER_POLICY_ARNS"
            } >> "$GITHUB_OUTPUT"
          }
          trap publish EXIT
          set -e
          index=0
          while IFS= read -r part; do
            aws iam create-policy \
              --policy-name "$TIER_POLICY_PREFIX$index" \
              --policy-document "file://$part" \
              --query Policy.Arn --output text >> "$created"
            index=$((index + 1))
          done < "$RUNNER_TEMP/tier-policy-parts"
          if [ "$index" -eq 0 ]; then
            echo "the ${{ matrix.tier }} tier rendered no policy, so its session would be granted everything the role has" >&2
            exit 1
          fi

      - uses: ./adapter/.github/actions/real-aws-session
        with:
          node-version: ${{ steps.versions.outputs.node }}
          pnpm-version: ${{ steps.versions.outputs.pnpm }}
          bun-version: ${{ steps.versions.outputs.bun }}
          aws-region: ${{ vars.E2E_AWS_REGION }}
          role-to-assume: ${{ secrets.E2E_AWS_ROLE_ARN }}
          role-session-name: ocel-e2e-tier-${{ matrix.tier }}-${{ github.run_id }}
          guard-script: adapter/tests/next-compat/guard-accounts.sh
          expected-aws-account-id: ${{ secrets.E2E_EXPECTED_AWS_ACCOUNT_ID }}
          expected-cloudflare-account-id: ${{ secrets.E2E_EXPECTED_CLOUDFLARE_ACCOUNT_ID }}
          managed-session-policies: ${{ steps.tier-policy.outputs.arns }}

      - name: Warm the Pulumi runtime the provider installs on first deploy
        if: ${{ matrix.tier == 'deploy' }}
        run: |
          set -euo pipefail
          root="$HOME/.ocel/pulumi/$PULUMI_VERSION"
          curl -fsSL https://get.pulumi.com/install.sh | sh -s -- \
            --no-edit-path --install-root "$root" --version "$PULUMI_VERSION"
          "$root/bin/pulumi" version

      - name: Run what this tier's credentials must cover
        run: node adapter/tests/next-compat/credential-tier.mjs run ${{ matrix.tier }}

      - name: Assume a session that can take the policies back down
        if: ${{ always() }}
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.E2E_AWS_ROLE_ARN }}
          aws-region: ${{ vars.E2E_AWS_REGION }}
          role-session-name: ocel-e2e-tier-sweep-${{ matrix.tier }}-${{ github.run_id }}

      - name: Remove the policies this tier's session was bounded by
        if: ${{ always() }}
        env:
          TIER_POLICY_ARNS: ${{ steps.tier-policy.outputs.arns }}
          TIER_POLICY_PREFIX: ocel-e2e-tier-${{ matrix.tier }}-${{ github.run_id }}-
        run: |
          set -uo pipefail
          drop() {
            [ -n "$1" ] || return 0
            aws iam delete-policy --policy-arn "$1" || echo "could not remove $1" >&2
          }
          while IFS= read -r arn; do
            drop "$arn"
          done <<< "$TIER_POLICY_ARNS"
          for arn in $(aws iam list-policies --scope Local \
            --query "Policies[?starts_with(PolicyName, '$TIER_POLICY_PREFIX')].Arn" --output text); do
            drop "$arn"
          done

  destroy:
    name: destroy
    needs: [build, smoke, test, tiers]
    if: ${{ always() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    env:
      ADAPTER_DIR: ${{ github.workspace }}/adapter
      OCEL_ACCESS_TOKEN: ${{ secrets.E2E_OCEL_ACCESS_TOKEN }}
      OCEL_CONSOLE_URL: ${{ vars.E2E_OCEL_API_URL }}
      OCEL_E2E_SIDECAR_DIR: ${{ github.workspace }}/sidecar
      AWS_REGION: ${{ vars.E2E_AWS_REGION }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.E2E_CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.E2E_CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            nextjs
            adapter
            sidecar
            ~/.cache/ms-playwright
          key: build-${{ github.sha }}-${{ github.run_id }}
          fail-on-cache-miss: true

      - name: Take the versions the repository pins
        id: versions
        uses: ./adapter/.github/actions/versions
        with:
          working-directory: adapter

      - uses: ./adapter/.github/actions/real-aws-session
        if: ${{ !startsWith(inputs.target, 'gcp') }}
        with:
          node-version: ${{ steps.versions.outputs.node }}
          pnpm-version: ${{ steps.versions.outputs.pnpm }}
          bun-version: ${{ steps.versions.outputs.bun }}
          aws-region: ${{ vars.E2E_AWS_REGION }}
          role-to-assume: ${{ secrets.E2E_AWS_ROLE_ARN }}
          role-session-name: ocel-e2e-destroy-${{ github.run_id }}
          guard-script: adapter/tests/next-compat/guard-accounts.sh
          expected-aws-account-id: ${{ secrets.E2E_EXPECTED_AWS_ACCOUNT_ID }}
          expected-cloudflare-account-id: ${{ secrets.E2E_EXPECTED_CLOUDFLARE_ACCOUNT_ID }}

      - uses: ./adapter/.github/actions/real-gcp-session
        if: ${{ startsWith(inputs.target, 'gcp') }}
        with:
          node-version: ${{ steps.versions.outputs.node }}
          pnpm-version: ${{ steps.versions.outputs.pnpm }}
          bun-version: ${{ steps.versions.outputs.bun }}
          project: ${{ vars.E2E_GCP_PROJECT }}
          workload-identity-provider: ${{ vars.E2E_GCP_WIF_PROVIDER }}
          service-account: ${{ vars.E2E_GCP_SERVICE_ACCOUNT }}
          guard-script: adapter/tests/next-compat/guard-cloudflare.sh
          expected-cloudflare-account-id: ${{ secrets.E2E_EXPECTED_CLOUDFLARE_ACCOUNT_ID }}

      - name: Destroy the project this run deployed into
        run: node adapter/tests/next-compat/project-teardown.mjs

  evict:
    name: evict
    needs: [build, destroy, baseline]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Delete the cache entry, which no later run can restore
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          KEY: build-${{ github.sha }}-${{ github.run_id }}
        run: gh cache delete "$KEY" || echo "no $KEY to delete"

  baseline:
    name: baseline
    needs: test
    if: ${{ always() && inputs.recordBaseline }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: adapter

      - name: Take the versions the repository pins
        id: versions
        uses: ./adapter/.github/actions/versions
        with:
          working-directory: adapter

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.versions.outputs.node }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: baseline-*
          path: fragments
          merge-multiple: true

      - name: Merge every group's fragment
        run: |
          set -euo pipefail
          file=$(basename "$ADAPTER_BASELINE")
          node adapter/tests/next-compat/merge-baseline.mjs merge "$file" fragments/*.json
          echo "BASELINE_FILE=$file" >> "$GITHUB_ENV"

      - name: Upload the merged baseline for review
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: baseline-manifest-${{ inputs.target }}
          path: ${{ env.BASELINE_FILE }}
