name: Build

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - "packages/**"
      - "cli/node/**"
      - "frameworks/**"
      - "platform/**"
      - "scripts/**"
      - "pnpm-lock.yaml"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".github/workflows/build.yml"
      - ".github/actions/node-workspace/**"
      - "!**/*.go"
      - "!**/go.mod"
      - "!**/go.sum"
  workflow_dispatch:

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: ./.github/actions/node-workspace

      - name: Build, typecheck and test the workspace
        run: pnpm turbo run build typecheck test --filter='!./console/*' --filter='!./examples/*' --filter='!./tests/*'
