name: Build

on:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.10.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: pnpm --filter @ocel/cli-platform typecheck
        # go generate esbuilds the node builder, which strips types without
        # checking them. This is the only gate on cli/platform/src/**.
        run: pnpm --filter @ocel/cli-platform typecheck

      - name: go generate (cli platform dist)
        working-directory: cli
        # The platform dist is embedded but not committed, so nothing compiles
        # without it.
        run: go generate ./...

      - name: go build (workspace)
        run: >-
          go build
          github.com/ocelhq/ocel/cli/...
          github.com/ocelhq/ocel/pkg/proto/...
          github.com/ocelhq/ocel/sdk/...
          github.com/ocelhq/ocel/cloud/aws/...

      - name: pnpm --filter ocel build (tsc)
        run: pnpm --filter ocel build

      - name: Go env-wire e2e (defineEnv -> DeclareEnv)
        working-directory: cli
        # The only test that runs the real ocel/env SDK against the real gate,
        # so it needs the SDK build above. Named explicitly rather than `go
        # test ./...` to keep this step narrow: it must not drag in unrelated
        # red from the rest of the cli module.
        run: go test ./internal/envwire/...

      - name: JS unit tests
        run: |
          pnpm --filter ocel test
          pnpm --filter @ocel/cli-platform test
