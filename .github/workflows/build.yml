name: Build

on:
  workflow_call:

permissions:
  contents: read

jobs:
  binaries:
    name: Binaries
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/node-workspace
        with:
          turbo-token: ${{ secrets.TURBO_TOKEN }}
          turbo-team: ${{ vars.TURBO_TEAM }}

      - name: Setup Go
        uses: ./.github/actions/go
        with:
          caches: modules,build
          build-scope: binaries

      - name: The node bundles the CLI embeds and the fixtures and external stacks import
        run: pnpm turbo run build --filter=ocel --filter=@ocel/transforms --filter=@ocel/sst --filter=@ocel/pulumi

      - uses: ./.github/actions/goreleaser

      - name: The snapshot CLI and providers, for this runner's platform only
        run: |
          set -euo pipefail
          node scripts/snapshot.mjs > "$RUNNER_TEMP/snapshot.env"
          . "$RUNNER_TEMP/snapshot.env"
          install -D -m 0755 "$OCEL_BIN" dist/e2e/ocel

      - name: Upload them for every smoke, e2e and preview job of this run
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binaries
          if-no-files-found: error
          retention-days: 3
          path: |
            dist/e2e/ocel
            dist/providers/**
            packages/ocel/dist/**
            packages/ocel-transforms/dist/**
            packages/ocel-sst/dist/**
            packages/ocel-pulumi/dist/**
