name: Build

on:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.10.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: pnpm --filter @cli/node typecheck
        run: pnpm --filter @cli/node typecheck

      - name: pnpm --filter ocel build (tsc)
        run: pnpm --filter ocel build

      - name: JS unit tests
        run: |
          pnpm --filter ocel test
          pnpm --filter @cli/node test
