name: Build

on:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.10.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: pnpm --filter @cli/node typecheck
        run: pnpm --filter @cli/node typecheck

      - name: pnpm --filter ocel build (tsc)
        run: pnpm --filter ocel build

      - name: pnpm --filter @ocel/provider-aws typecheck
        run: pnpm --filter @ocel/provider-aws typecheck

      - name: pnpm --filter @ocel/provider-vps typecheck
        run: pnpm --filter @ocel/provider-vps typecheck

      - name: pnpm --filter @ocel/sst build (tsc)
        run: pnpm --filter @ocel/sst build

      - name: pnpm --filter @ocel/pulumi build (tsc)
        run: pnpm --filter @ocel/pulumi build

      - name: pnpm --filter @framework/next-router typecheck
        run: pnpm --filter @framework/next-router typecheck

      - name: JS unit tests
        run: |
          pnpm --filter ocel test
          pnpm --filter @cli/node test
          pnpm --filter @ocel/sst test
          pnpm --filter @ocel/pulumi test
          pnpm --filter @ocel/provider-aws test
          pnpm --filter @ocel/provider-vps test
          pnpm --filter @framework/next-router test
          pnpm --filter @platform/cf-entry test
          pnpm --filter @platform/cloudfront-resolver test
          pnpm --filter @platform/aws-tag-invalidator test
