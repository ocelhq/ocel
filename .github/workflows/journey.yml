name: Journey

on:
  pull_request:
    types: [opened, synchronize, reopened, closed, labeled, unlabeled]
    paths:
      - "www/**"
      - "console/github/**"
      - "ocel.aws.json"
      - "cli/**"
      - "packages/**"
      - "frameworks/**"
      - "pkg/**"
      - "sdk/**"
      - "proto/**"
      - "platform/**"
      - "tests/fixtures/**"
      - "tests/fronts/**"
      - "tests/journeys/**"
      - "tests/shared/**"
      - "scripts/**"
      - ".goreleaser.yaml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".github/workflows/journey.yml"
      - ".github/actions/**"
  workflow_dispatch:
    inputs:
      targets:
        description: "Targets to drive against their real accounts, space separated. dev is never dispatched."
        default: "aws vps"
        type: string
      variants:
        description: "Variants each lane enumerates, space separated, default among them. Empty runs every variant a fixture lists."
        default: ""
        type: string
      skips:
        description: "skip leaves out every cell the gap list marks dead; run drives them too, to see what has since turned green."
        default: "skip"
        type: choice
        options: [skip, run]
      coverage:
        description: "sampled runs each variant on one member of a group; every-cell runs every cell."
        default: "every-cell"
        type: choice
        options: [every-cell, sampled]
      concern:
        description: "Concerns each lane covers, space separated: deploy asks whether the app runs there, lifecycle whether a release can be replaced and rolled back there, sdk whether its resources do, iac whether it binds to what an SST or Pulumi stack stands up. Empty covers every one but iac, which runs only when named here, and then only with skips set to run: the gap list skips every iac cell on aws (#856, #857)."
        default: ""
        type: string
      fixtures:
        description: "Fixtures each lane runs, space separated, each named <concern>/<name>. Empty runs every one of the concerns picked."
        default: ""
        type: string

permissions:
  contents: read
  id-token: write
  packages: read
  pull-requests: write

concurrency:
  group: ${{ (github.event.action == 'labeled' || github.event.action == 'unlabeled') && format('journey-{0}-{1}', github.event.label.name, github.event.pull_request.number) || format('journey-{0}', github.event.pull_request.number || github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action != 'closed' && !(github.event.action == 'labeled' && github.event.label.name == 'journey:real') }}

env:
  OCEL_FLOCI_IMAGE: ghcr.io/ocelhq/floci:2.0.1-ocel.2
  OCEL_FLOCI_GCP_IMAGE: floci/floci-gcp:0.8.0
  NODE_VERSION: "22"
  PNPM_VERSION: "11.10.0"
  BUN_VERSION: "1.4.0"
  FORCE_COLOR: "1"

jobs:
  binary:
    name: binaries
    if: ${{ github.event.action != 'closed' && ((github.event.action != 'labeled' && github.event.action != 'unlabeled') || (github.event.action == 'labeled' && github.event.label.name == 'journey:real') || github.event.label.name == 'dogfood:release') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      dev: ${{ steps.gate.outputs.dev }}
      aws: ${{ steps.gate.outputs.aws }}
      gcp: ${{ steps.gate.outputs.gcp }}
      vps: ${{ steps.gate.outputs.vps }}
      front: ${{ steps.gate.outputs.front }}
      next: ${{ steps.gate.outputs.next }}
      preview: ${{ steps.lanes.outputs.preview }}
      variants: ${{ steps.lanes.outputs.variants }}
      skips: ${{ steps.lanes.outputs.skips }}
      coverage: ${{ steps.lanes.outputs.coverage }}
      concern: ${{ steps.lanes.outputs.concern }}
      fixtures: ${{ steps.lanes.outputs.fixtures }}
      seed: ${{ steps.lanes.outputs.seed }}
      touched: ${{ steps.lanes.outputs.touched }}
      real: ${{ steps.lanes.outputs.real }}
      aws_key: ${{ steps.gate-aws.outputs.key }}
      gcp_key: ${{ steps.gate-gcp.outputs.key }}
      vps_key: ${{ steps.gate-vps.outputs.key }}
      front_key: ${{ steps.gate-front.outputs.key }}
      dev_key: ${{ steps.gate-dev.outputs.key }}
      next_key: ${{ steps.gate-next.outputs.key }}
    steps:
      - name: Spend the label that asked for this run
        if: ${{ github.event.action == 'labeled' && github.event.label.name == 'journey:real' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr edit "$PR" --remove-label journey:real

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pick the lanes
        id: lanes
        env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          LABEL: ${{ github.event.label.name }}
          TARGETS: ${{ inputs.targets }}
          VARIANTS: ${{ inputs.variants }}
          SKIPS: ${{ inputs.skips }}
          COVERAGE: ${{ inputs.coverage }}
          CONCERN: ${{ inputs.concern }}
          FIXTURES: ${{ inputs.fixtures }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          PR: ${{ github.event.pull_request.number }}
          OURS: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          RELEASED: ${{ contains(github.event.pull_request.labels.*.name, 'dogfood:release') }}
        run: |
          set -euo pipefail

          named() {
            for want in $2; do
              [ "$want" = "$1" ] && { echo true; return; }
            done
            echo false
          }

          forced=${OCEL_JOURNEY_LANES:-}
          real=false
          next=false
          preview=false
          seed=
          touched=
          if [ "$EVENT" = workflow_dispatch ]; then
            real=true
          elif [ "$ACTION" = labeled ] && [ "$LABEL" = journey:real ]; then
            real=true
            TARGETS="aws vps"
            CONCERN=
            FIXTURES=
          fi

          if [ -n "$forced" ]; then
            lanes=${forced/all/dev aws gcp vps}
            dev=$(named dev "$lanes")
            aws=$(named aws "$lanes")
            gcp=$(named gcp "$lanes")
            vps=$(named vps "$lanes")
            front=$vps
          elif [ "$real" = true ]; then
            dev=false
            aws=$(named aws "$TARGETS")
            gcp=false
            vps=$(named vps "$TARGETS")
            front=$vps
          elif [ "$LABEL" = dogfood:release ]; then
            dev=false
            aws=false
            gcp=false
            vps=false
            front=false
            preview=true
          else
            files=$(git diff --name-only "$BASE" "$HEAD")
            echo "$files"
            hit() { printf '%s\n' "$files" | grep -Eq "$1" && echo true || echo false; }
            shared='^(cli|packages|frameworks|pkg|sdk|proto|tests/fixtures|tests/journeys|tests/shared)/'
            shared="$shared"'|^\.github/(actions/|workflows/journey\.yml$)'
            shared="$shared"'|^(package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml)$'
            seed=$PR
            touched=$(printf '%s\n' "$files" | sed -n 's|^tests/fixtures/\([^/]*\)/\([^/]*\)/.*|\1/\2|p' | sort -u | paste -sd, -)
            dev=$(hit "$shared"'|^platform/aws/runtime/bucket/')
            aws=$(hit "$shared"'|^platform/(aws|edge)/|^scripts/floci\.sh$')
            gcp=$(hit "$shared"'|^platform/gcp/|^scripts/floci\.sh$')
            vps=$(hit "$shared"'|^platform/vps/|^scripts/(incus|ec2)\.sh$')
            front=$(hit "$shared"'|^platform/vps/|^scripts/(incus|ec2)\.sh$|^tests/fronts/')
            next=$(hit "$shared"'|^platform/(aws|edge)/')
            preview=$(hit '^(www|console/github|cli|packages|frameworks|pkg|sdk|proto|platform|scripts)/|^(ocel\.aws\.json|package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|turbo\.json)$|^\.github/(actions/|workflows/journey\.yml$)')
          fi

          if [ "$EVENT" != pull_request ] || [ "$OURS" != true ] || [ "$real" = true ]; then
            preview=false
          elif [ "$preview" = true ] && [ "$RELEASED" = true ]; then
            preview=release
          elif [ "$preview" = true ]; then
            preview=head
          fi

          if [ "$real" = true ]; then
            coverage=${COVERAGE:-every-cell}
            concern=$CONCERN
          else
            coverage=sampled
            concern=
            VARIANTS=
            SKIPS=
          fi

          {
            echo "dev=$dev"
            echo "aws=$aws"
            echo "gcp=$gcp"
            echo "vps=$vps"
            echo "front=$front"
            echo "next=$next"
            echo "preview=$preview"
            echo "variants=${VARIANTS:-}"
            echo "skips=${SKIPS:-skip}"
            echo "coverage=$coverage"
            echo "concern=$concern"
            echo "fixtures=$(echo "${FIXTURES:-}" | tr ' ' ',')"
            echo "seed=$seed"
            echo "touched=$touched"
            echo "real=$real"
          } >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"
          {
            echo "OCEL_JOURNEY_CONCERN=$concern"
            echo "OCEL_JOURNEY_FIXTURES=$(echo "${FIXTURES:-}" | tr ' ' ',')"
            echo "OCEL_JOURNEY_SEED=$seed"
            echo "OCEL_JOURNEY_TOUCHED=$touched"
            echo "OCEL_JOURNEY_COVERAGE=$coverage"
            echo "OCEL_JOURNEY_VARIANTS=${VARIANTS:-}"
            echo "OCEL_JOURNEY_SKIPS=${SKIPS:-skip}"
          } >> "$GITHUB_ENV"

      - uses: ./.github/actions/node-workspace
        with:
          turbo-token: ${{ secrets.TURBO_TOKEN }}
          turbo-team: ${{ vars.TURBO_TEAM }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Has aws already passed what it reads
        id: gate-aws
        if: ${{ steps.lanes.outputs.aws == 'true' && steps.lanes.outputs.real != 'true' }}
        uses: ./.github/actions/suite-gate
        with:
          suite: journey-aws
          task: "@ocel-tests/journeys#journey:aws"

      - name: Has gcp already passed what it reads
        id: gate-gcp
        if: ${{ steps.lanes.outputs.gcp == 'true' && steps.lanes.outputs.real != 'true' }}
        uses: ./.github/actions/suite-gate
        with:
          suite: journey-gcp
          task: "@ocel-tests/journeys#journey:gcp"

      - name: Has vps already passed what it reads
        id: gate-vps
        if: ${{ steps.lanes.outputs.vps == 'true' && steps.lanes.outputs.real != 'true' }}
        uses: ./.github/actions/suite-gate
        with:
          suite: journey-vps
          task: "@ocel-tests/journeys#journey:vps"

      - name: Has vps behind each front already passed what it reads
        id: gate-front
        if: ${{ steps.lanes.outputs.front == 'true' && steps.lanes.outputs.real != 'true' }}
        uses: ./.github/actions/suite-gate
        with:
          suite: journey-vps-front
          task: "@ocel-tests/journeys#journey:vps-front"
        env:
          OCEL_JOURNEY_CONCERN: deploy lifecycle
          OCEL_JOURNEY_FIXTURES: deploy/node,lifecycle/next
          OCEL_JOURNEY_VARIANTS: default
          OCEL_JOURNEY_COVERAGE: every-cell
          OCEL_JOURNEY_SKIPS: skip
          OCEL_JOURNEY_SEED: ""
          OCEL_JOURNEY_TOUCHED: ""

      - name: Has dev already passed what it reads
        id: gate-dev
        if: ${{ steps.lanes.outputs.dev == 'true' && steps.lanes.outputs.real != 'true' }}
        uses: ./.github/actions/suite-gate
        with:
          suite: journey-dev
          task: "@ocel-tests/journeys#journey:dev"

      - name: Has next already passed what it reads
        id: gate-next
        if: ${{ steps.lanes.outputs.next == 'true' }}
        uses: ./.github/actions/suite-gate
        with:
          suite: journey-next
          task: "@ocel-tests/journeys#journey:next"
        env:
          OCEL_JOURNEY_CONCERN: deploy
          OCEL_JOURNEY_FIXTURES: deploy/next
          OCEL_JOURNEY_VARIANTS: cloudflare
          OCEL_JOURNEY_COVERAGE: every-cell
          OCEL_JOURNEY_SKIPS: skip
          OCEL_JOURNEY_KEEP: "1"
          OCEL_JOURNEY_SEED: ""
          OCEL_JOURNEY_TOUCHED: ""

      - name: Keep the lanes with something left to prove
        id: gate
        env:
          AWS: ${{ steps.lanes.outputs.aws }}
          GCP: ${{ steps.lanes.outputs.gcp }}
          VPS: ${{ steps.lanes.outputs.vps }}
          FRONT: ${{ steps.lanes.outputs.front }}
          DEV: ${{ steps.lanes.outputs.dev }}
          NEXT: ${{ steps.lanes.outputs.next }}
          AWS_GREEN: ${{ steps.gate-aws.outputs.green }}
          GCP_GREEN: ${{ steps.gate-gcp.outputs.green }}
          VPS_GREEN: ${{ steps.gate-vps.outputs.green }}
          FRONT_GREEN: ${{ steps.gate-front.outputs.green }}
          DEV_GREEN: ${{ steps.gate-dev.outputs.green }}
          NEXT_GREEN: ${{ steps.gate-next.outputs.green }}
          PREVIEW: ${{ steps.lanes.outputs.preview }}
        run: |
          set -euo pipefail
          runs() { if [ "$1" = true ] && [ "$2" != true ]; then echo true; else echo false; fi; }
          aws=$(runs "$AWS" "$AWS_GREEN")
          gcp=$(runs "$GCP" "$GCP_GREEN")
          vps=$(runs "$VPS" "$VPS_GREEN")
          front=$(runs "$FRONT" "$FRONT_GREEN")
          dev=$(runs "$DEV" "$DEV_GREEN")
          next=$(runs "$NEXT" "$NEXT_GREEN")
          any=false
          [ "$aws$gcp$vps$front$dev$next" = falsefalsefalsefalsefalsefalse ] || any=true
          [ "$PREVIEW" != head ] || any=true
          {
            echo "aws=$aws"
            echo "gcp=$gcp"
            echo "vps=$vps"
            echo "front=$front"
            echo "dev=$dev"
            echo "next=$next"
            echo "any=$any"
          } | tee -a "$GITHUB_OUTPUT"

      - name: Setup Go
        uses: ./.github/actions/go

      - name: Build, typecheck and test the workspace
        run: pnpm turbo run build typecheck test --filter='!./console/*' --filter='!./tests/fixtures/**' --filter='!./tests/next-compat'

      - uses: ./.github/actions/goreleaser
        if: ${{ steps.gate.outputs.any == 'true' }}

      - name: Build the binaries a journey drives
        if: ${{ steps.gate.outputs.any == 'true' }}
        run: |
          set -euo pipefail
          node scripts/snapshot.mjs > "$RUNNER_TEMP/snapshot.env"
          . "$RUNNER_TEMP/snapshot.env"
          install -D -m 0755 "$OCEL_BIN" dist/journey/ocel

      - name: Upload them for the lanes
        if: ${{ steps.gate.outputs.any == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: journey-binaries
          if-no-files-found: error
          path: |
            dist/journey/ocel
            dist/providers/**

  aws:
    name: aws
    needs: binary
    if: ${{ needs.binary.outputs.aws == 'true' && needs.binary.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ needs.binary.outputs.real == 'true' && 120 || 75 }}
    concurrency:
      group: ${{ needs.binary.outputs.real == 'true' && 'real-aws' || format('journey-aws-{0}', github.event.pull_request.number) }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action != 'labeled' }}
    env:
      OCEL_TARGET: aws
      OCEL_JOURNEY_CONCERN: ${{ needs.binary.outputs.concern }}
      OCEL_JOURNEY_FIXTURES: ${{ needs.binary.outputs.fixtures }}
      OCEL_JOURNEY_SEED: ${{ needs.binary.outputs.seed }}
      OCEL_JOURNEY_TOUCHED: ${{ needs.binary.outputs.touched }}
      CLOUDFLARE_ACCOUNT_ID: ${{ needs.binary.outputs.real == 'true' && secrets.E2E_CLOUDFLARE_ACCOUNT_ID || '' }}
      CLOUDFLARE_API_TOKEN: ${{ needs.binary.outputs.real == 'true' && secrets.E2E_CLOUDFLARE_API_TOKEN || '' }}
      OCEL_AWS_VARS_KEY: ${{ needs.binary.outputs.real == 'true' && vars.DOGFOOD_AWS_VARS_KEY || '' }}
      REAL: ${{ needs.binary.outputs.real }}
      OCEL_JOURNEY_COVERAGE: ${{ needs.binary.outputs.coverage }}
      OCEL_JOURNEY_VARIANTS: ${{ needs.binary.outputs.variants }}
      OCEL_JOURNEY_SKIPS: ${{ needs.binary.outputs.skips }}
      EMULATOR: ocel-journey-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: ./.github/actions/node-workspace
        with:
          turbo-token: ${{ secrets.TURBO_TOKEN }}
          turbo-team: ${{ vars.TURBO_TEAM }}

      - name: The node bundles the fixtures and the external stacks import
        run: pnpm turbo run build --filter=ocel --filter=@ocel/transforms --filter=@ocel/sst --filter=@ocel/pulumi

      - name: The musl targets a rust fixture compiles for
        run: rustup target add x86_64-unknown-linux-musl aarch64-unknown-linux-musl

      - name: Take the binaries this lane drives
        uses: ./.github/actions/journey-binaries

      - name: Log in to the registry the emulator image lives in
        if: ${{ needs.binary.outputs.aws == 'true' && needs.binary.outputs.real != 'true' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull the emulator this lane deploys into
        if: ${{ needs.binary.outputs.aws == 'true' && needs.binary.outputs.real != 'true' }}
        run: docker pull "$OCEL_FLOCI_IMAGE"

      - name: Assume the session that may spend the real account
        if: ${{ needs.binary.outputs.real == 'true' }}
        uses: ./.github/actions/real-aws-session
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
          bun-version: ${{ env.BUN_VERSION }}
          aws-region: ${{ vars.E2E_AWS_REGION }}
          role-to-assume: ${{ secrets.E2E_AWS_ROLE_ARN }}
          role-session-name: ocel-journey-aws-${{ github.run_id }}
          role-duration-seconds: "14400"
          guard-script: tests/next-compat/guard-accounts.sh
          expected-aws-account-id: ${{ secrets.E2E_EXPECTED_AWS_ACCOUNT_ID }}
          expected-cloudflare-account-id: ${{ secrets.E2E_EXPECTED_CLOUDFLARE_ACCOUNT_ID }}

      - name: Name the account and the zone this run may touch
        if: ${{ needs.binary.outputs.real == 'true' }}
        env:
          EXPECTED: ${{ secrets.E2E_EXPECTED_AWS_ACCOUNT_ID }}
          ZONE: ${{ vars.E2E_PREVIEW_DOMAIN }}
          REGION: ${{ vars.E2E_AWS_REGION }}
        run: |
          set -euo pipefail
          ZONE=${ZONE#\*.}
          {
            echo "EXPECTED_AWS_ACCOUNT_ID=$EXPECTED"
            echo "OCEL_JOURNEY_ZONE=$ZONE"
            echo "AWS_REGION=$REGION"
          } >> "$GITHUB_ENV"

      - name: Reclaim what an earlier attempt of this run left behind
        if: ${{ needs.binary.outputs.real == 'true' }}
        run: pnpm --filter @ocel-tests/journeys sweep --target aws --own

      - name: Run the journey
        if: ${{ needs.binary.outputs.aws == 'true' }}
        run: |
          set -uo pipefail
          if [ "$REAL" = true ]; then
            exec pnpm --filter @ocel-tests/journeys journey
          fi
          scripts/floci.sh run "$EMULATOR" -- \
            bash -c 'AWS_ENDPOINT_URL=${OCEL_FLOCI_ENDPOINT/127.0.0.1/localhost.localstack.cloud} pnpm --filter @ocel-tests/journeys journey'

      - name: Record that what aws reads has passed
        if: ${{ needs.binary.outputs.aws == 'true' && needs.binary.outputs.real != 'true' }}
        uses: ./.github/actions/suite-passed
        with:
          suite: journey-aws
          key: ${{ needs.binary.outputs.aws_key }}

      - name: No emulator left behind
        if: ${{ always() && needs.binary.outputs.aws == 'true' }}
        run: scripts/floci.sh destroy "$EMULATOR" || echo "could not destroy $EMULATOR"

      - name: Pack the evidence
        if: always()
        run: |
          set -euo pipefail
          mkdir -p tests/journeys/output
          tar -czf "$RUNNER_TEMP/journey-evidence.tgz" \
            --exclude='*/node_modules' \
            --exclude='*/node_modules/*' \
            --exclude='*/trees/*/packages' \
            -C tests/journeys output

      - name: Upload the evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journey-evidence-aws
          path: ${{ runner.temp }}/journey-evidence.tgz
          if-no-files-found: warn

  dev:
    name: dev
    needs: binary
    if: ${{ needs.binary.outputs.dev == 'true' && needs.binary.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: journey-dev-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action != 'labeled' }}
    env:
      OCEL_TARGET: dev
      OCEL_JOURNEY_CONCERN: ${{ needs.binary.outputs.concern }}
      OCEL_JOURNEY_FIXTURES: ${{ needs.binary.outputs.fixtures }}
      OCEL_JOURNEY_SEED: ${{ needs.binary.outputs.seed }}
      OCEL_JOURNEY_TOUCHED: ${{ needs.binary.outputs.touched }}
      OCEL_JOURNEY_COVERAGE: ${{ needs.binary.outputs.coverage }}
      OCEL_JOURNEY_VARIANTS: ${{ needs.binary.outputs.variants }}
      OCEL_JOURNEY_SKIPS: ${{ needs.binary.outputs.skips }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: ./.github/actions/node-workspace
        with:
          turbo-token: ${{ secrets.TURBO_TOKEN }}
          turbo-team: ${{ vars.TURBO_TEAM }}

      - name: The node bundle the fixtures import
        run: pnpm turbo run build --filter=ocel

      - name: Take the binaries this lane drives
        uses: ./.github/actions/journey-binaries

      - name: Run the dev journey
        run: pnpm --filter @ocel-tests/journeys journey

      - name: Record that what dev reads has passed
        if: ${{ needs.binary.outputs.real != 'true' }}
        uses: ./.github/actions/suite-passed
        with:
          suite: journey-dev
          key: ${{ needs.binary.outputs.dev_key }}

      - name: No dev container left behind
        if: always()
        run: |
          left=$(docker ps --all --quiet --filter label=dev.ocel.project)
          [ -z "$left" ] || docker rm --force --volumes $left

      - name: Pack the evidence
        if: always()
        run: |
          set -euo pipefail
          mkdir -p tests/journeys/output
          tar -czf "$RUNNER_TEMP/journey-evidence.tgz" \
            --exclude='*/node_modules' \
            --exclude='*/node_modules/*' \
            --exclude='*/trees/*/packages' \
            -C tests/journeys output

      - name: Upload the evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journey-evidence-dev
          path: ${{ runner.temp }}/journey-evidence.tgz
          if-no-files-found: warn

  gcp:
    name: gcp
    needs: binary
    if: ${{ needs.binary.outputs.gcp == 'true' && needs.binary.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: journey-gcp-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action != 'labeled' }}
    env:
      OCEL_TARGET: gcp
      OCEL_JOURNEY_CONCERN: ${{ needs.binary.outputs.concern }}
      OCEL_JOURNEY_FIXTURES: ${{ needs.binary.outputs.fixtures }}
      OCEL_JOURNEY_SEED: ${{ needs.binary.outputs.seed }}
      OCEL_JOURNEY_TOUCHED: ${{ needs.binary.outputs.touched }}
      OCEL_JOURNEY_COVERAGE: ${{ needs.binary.outputs.coverage }}
      OCEL_JOURNEY_VARIANTS: ${{ needs.binary.outputs.variants }}
      OCEL_JOURNEY_SKIPS: ${{ needs.binary.outputs.skips }}
      EMULATOR: ocel-journey-gcp-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: ./.github/actions/node-workspace
        with:
          turbo-token: ${{ secrets.TURBO_TOKEN }}
          turbo-team: ${{ vars.TURBO_TEAM }}

      - name: The node bundle the fixtures import
        run: pnpm turbo run build --filter=ocel

      - name: The musl targets a rust fixture compiles for
        run: rustup target add x86_64-unknown-linux-musl aarch64-unknown-linux-musl

      - name: The Docker the image build and the emulator share
        uses: ./.github/actions/containerd-docker

      - name: Take the binaries this lane drives
        uses: ./.github/actions/journey-binaries

      - name: Pull the emulator this lane deploys into
        run: docker pull "$OCEL_FLOCI_GCP_IMAGE"

      - name: Run the journey
        run: scripts/floci.sh --cloud gcp run "$EMULATOR" -- pnpm --filter @ocel-tests/journeys journey

      - name: Record that what gcp reads has passed
        uses: ./.github/actions/suite-passed
        with:
          suite: journey-gcp
          key: ${{ needs.binary.outputs.gcp_key }}

      - name: No emulator left behind
        if: always()
        run: scripts/floci.sh --cloud gcp destroy "$EMULATOR" || echo "could not destroy $EMULATOR"

      - name: Pack the evidence
        if: always()
        run: |
          set -euo pipefail
          mkdir -p tests/journeys/output
          tar -czf "$RUNNER_TEMP/journey-evidence.tgz" \
            --exclude='*/node_modules' \
            --exclude='*/node_modules/*' \
            --exclude='*/trees/*/packages' \
            -C tests/journeys output

      - name: Upload the evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journey-evidence-gcp
          path: ${{ runner.temp }}/journey-evidence.tgz
          if-no-files-found: warn

  next:
    name: next
    needs: binary
    if: ${{ needs.binary.outputs.next == 'true' && needs.binary.result == 'success' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: journey-next-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    env:
      OCEL_TARGET: aws
      OCEL_JOURNEY_CONCERN: deploy
      OCEL_JOURNEY_FIXTURES: deploy/next
      OCEL_JOURNEY_VARIANTS: cloudflare
      OCEL_JOURNEY_COVERAGE: every-cell
      OCEL_JOURNEY_SKIPS: skip
      OCEL_JOURNEY_KEEP: "1"
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.E2E_CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.E2E_CLOUDFLARE_API_TOKEN }}
      OCEL_AWS_VARS_KEY: ${{ vars.DOGFOOD_AWS_VARS_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: ./.github/actions/node-workspace
        with:
          turbo-token: ${{ secrets.TURBO_TOKEN }}
          turbo-team: ${{ vars.TURBO_TEAM }}

      - name: The node bundle the fixture imports
        run: pnpm turbo run build --filter=ocel

      - name: Take the binaries this lane drives
        uses: ./.github/actions/journey-binaries

      - name: Assume the session that may spend the real account
        uses: ./.github/actions/real-aws-session
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
          bun-version: ${{ env.BUN_VERSION }}
          aws-region: ${{ vars.E2E_AWS_REGION }}
          role-to-assume: ${{ secrets.E2E_AWS_ROLE_ARN }}
          role-session-name: ocel-journey-next-${{ github.run_id }}
          role-duration-seconds: "3600"
          guard-script: tests/next-compat/guard-accounts.sh
          expected-aws-account-id: ${{ secrets.E2E_EXPECTED_AWS_ACCOUNT_ID }}
          expected-cloudflare-account-id: ${{ secrets.E2E_EXPECTED_CLOUDFLARE_ACCOUNT_ID }}

      - name: Name the account and the zone this run may touch
        env:
          EXPECTED: ${{ secrets.E2E_EXPECTED_AWS_ACCOUNT_ID }}
          ZONE: ${{ vars.E2E_PREVIEW_DOMAIN }}
          REGION: ${{ vars.E2E_AWS_REGION }}
        run: |
          set -euo pipefail
          ZONE=${ZONE#\*.}
          {
            echo "EXPECTED_AWS_ACCOUNT_ID=$EXPECTED"
            echo "OCEL_JOURNEY_ZONE=$ZONE"
            echo "AWS_REGION=$REGION"
          } >> "$GITHUB_ENV"

      - name: Reclaim what an earlier attempt of this run left behind
        run: pnpm --filter @ocel-tests/journeys sweep --target aws --own

      - name: Run the journey
        run: pnpm --filter @ocel-tests/journeys journey

      - name: Record that what next reads has passed
        uses: ./.github/actions/suite-passed
        with:
          suite: journey-next
          key: ${{ needs.binary.outputs.next_key }}

      - name: Pack the evidence
        if: always()
        run: |
          set -euo pipefail
          mkdir -p tests/journeys/output
          tar -czf "$RUNNER_TEMP/journey-evidence.tgz" \
            --exclude='*/node_modules' \
            --exclude='*/node_modules/*' \
            --exclude='*/trees/*/packages' \
            -C tests/journeys output

      - name: Upload the evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journey-evidence-next
          path: ${{ runner.temp }}/journey-evidence.tgz
          if-no-files-found: warn

  vps:
    name: vps
    needs: binary
    if: ${{ needs.binary.outputs.vps == 'true' && needs.binary.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ needs.binary.outputs.real == 'true' && 90 || 45 }}
    concurrency:
      group: ${{ needs.binary.outputs.real == 'true' && 'real-vps' || format('journey-vps-{0}', github.event.pull_request.number) }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action != 'labeled' }}
    permissions:
      contents: read
      id-token: write
      packages: write
    env:
      REGISTRY_PUSHES: ${{ needs.binary.outputs.real == 'true' && (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository) }}
      OCEL_TARGET: vps
      OCEL_JOURNEY_CONCERN: ${{ needs.binary.outputs.concern }}
      OCEL_JOURNEY_FIXTURES: ${{ needs.binary.outputs.fixtures }}
      OCEL_JOURNEY_SEED: ${{ needs.binary.outputs.seed }}
      OCEL_JOURNEY_TOUCHED: ${{ needs.binary.outputs.touched }}
      OCEL_JOURNEY_COVERAGE: ${{ needs.binary.outputs.coverage }}
      OCEL_JOURNEY_VARIANTS: ${{ needs.binary.outputs.variants }}
      OCEL_JOURNEY_SKIPS: ${{ needs.binary.outputs.skips }}
      CLOUDFLARE_ACCOUNT_ID: ${{ needs.binary.outputs.real == 'true' && secrets.E2E_CLOUDFLARE_ACCOUNT_ID || '' }}
      CLOUDFLARE_API_TOKEN: ${{ needs.binary.outputs.real == 'true' && secrets.E2E_CLOUDFLARE_API_TOKEN || '' }}
      VM: ocel-journey-${{ github.run_id }}-${{ github.run_attempt }}
      BOX: journey-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Bring up the box this lane deploys to
        uses: ./.github/actions/vps-box
        with:
          real: ${{ needs.binary.outputs.real }}
          vm: ${{ env.VM }}
          box: ${{ env.BOX }}
          session: ocel-journey-vps-${{ github.run_id }}
          sweep: "true"
          turbo-token: ${{ secrets.TURBO_TOKEN }}
          turbo-team: ${{ vars.TURBO_TEAM }}
          aws-region: ${{ vars.E2E_AWS_REGION }}
          role-to-assume: ${{ secrets.E2E_AWS_ROLE_ARN }}
          expected-aws-account-id: ${{ secrets.E2E_EXPECTED_AWS_ACCOUNT_ID }}
          expected-cloudflare-account-id: ${{ secrets.E2E_EXPECTED_CLOUDFLARE_ACCOUNT_ID }}

      - name: Reclaim journey images a run that died left in the registry
        id: registry
        if: ${{ env.REGISTRY_PUSHES == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: pnpm --filter @ocel-tests/journeys sweep:registry --target vps

      - name: Run the journey
        env:
          OCEL_JOURNEY_REGISTRY_USER: ${{ env.REGISTRY_PUSHES == 'true' && github.actor || '' }}
          OCEL_JOURNEY_REGISTRY_TOKEN: ${{ env.REGISTRY_PUSHES == 'true' && secrets.GITHUB_TOKEN || '' }}
        run: pnpm --filter @ocel-tests/journeys journey

      - name: No journey image left in the registry
        if: ${{ always() && steps.registry.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: pnpm --filter @ocel-tests/journeys sweep:registry --target vps --own

      - name: Record that what vps reads has passed
        if: ${{ needs.binary.outputs.real != 'true' }}
        uses: ./.github/actions/suite-passed
        with:
          suite: journey-vps
          key: ${{ needs.binary.outputs.vps_key }}

      - name: What the runner's daemon holds after the lane
        if: always()
        run: |
          df -h / || true
          docker system df || true
          docker buildx du 2>/dev/null | tail -n 3 || true

      - name: Nothing left behind, and the evidence kept
        if: always()
        uses: ./.github/actions/vps-box-gone
        with:
          real: ${{ needs.binary.outputs.real }}
          vm: ${{ env.VM }}
          box: ${{ env.BOX }}
          evidence: journey-evidence-vps

  vps-front:
    name: vps behind ${{ matrix.front }}
    needs: binary
    if: ${{ needs.binary.outputs.front == 'true' && needs.binary.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ needs.binary.outputs.real == 'true' && 90 || 45 }}
    strategy:
      fail-fast: false
      matrix:
        front: [nginx]
    concurrency:
      group: ${{ needs.binary.outputs.real == 'true' && format('real-vps-{0}', matrix.front) || format('journey-vps-{0}-{1}', matrix.front, github.event.pull_request.number) }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action != 'labeled' }}
    permissions:
      contents: read
      id-token: write
    env:
      OCEL_TARGET: vps
      OCEL_VPS_FRONT: ${{ matrix.front }}
      OCEL_JOURNEY_CONCERN: deploy lifecycle
      OCEL_JOURNEY_FIXTURES: deploy/node,lifecycle/next
      OCEL_JOURNEY_VARIANTS: default
      OCEL_JOURNEY_COVERAGE: every-cell
      OCEL_JOURNEY_SKIPS: skip
      OCEL_JOURNEY_SEED: ${{ needs.binary.outputs.seed }}
      CLOUDFLARE_ACCOUNT_ID: ${{ needs.binary.outputs.real == 'true' && secrets.E2E_CLOUDFLARE_ACCOUNT_ID || '' }}
      CLOUDFLARE_API_TOKEN: ${{ needs.binary.outputs.real == 'true' && secrets.E2E_CLOUDFLARE_API_TOKEN || '' }}
      VM: ocel-journey-${{ matrix.front }}-${{ github.run_id }}-${{ github.run_attempt }}
      BOX: journey-${{ matrix.front }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Bring up the box this lane deploys to
        uses: ./.github/actions/vps-box
        with:
          real: ${{ needs.binary.outputs.real }}
          vm: ${{ env.VM }}
          box: ${{ env.BOX }}
          session: ocel-journey-vps-${{ matrix.front }}-${{ github.run_id }}
          turbo-token: ${{ secrets.TURBO_TOKEN }}
          turbo-team: ${{ vars.TURBO_TEAM }}
          aws-region: ${{ vars.E2E_AWS_REGION }}
          role-to-assume: ${{ secrets.E2E_AWS_ROLE_ARN }}
          expected-aws-account-id: ${{ secrets.E2E_EXPECTED_AWS_ACCOUNT_ID }}
          expected-cloudflare-account-id: ${{ secrets.E2E_EXPECTED_CLOUDFLARE_ACCOUNT_ID }}

      - name: Run the journey behind ${{ matrix.front }}
        run: pnpm --filter @ocel-tests/journeys journey

      - name: Nothing left behind, and the evidence kept
        if: always()
        uses: ./.github/actions/vps-box-gone
        with:
          real: ${{ needs.binary.outputs.real }}
          vm: ${{ env.VM }}
          box: ${{ env.BOX }}
          evidence: journey-evidence-vps-${{ matrix.front }}

  vps-front-passed:
    name: vps behind every front
    needs: [binary, vps-front]
    if: ${{ needs.binary.outputs.real != 'true' && needs.vps-front.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Record that what vps behind every front reads has passed
        uses: ./.github/actions/suite-passed
        with:
          suite: journey-vps-front
          key: ${{ needs.binary.outputs.front_key }}

  preview:
    name: preview
    needs: binary
    if: ${{ needs.binary.result == 'success' && needs.binary.outputs.preview != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    env:
      OCEL_CONFIG: ocel.aws.json
      OCEL_GITHUB_APP_URL: ${{ vars.OCEL_GITHUB_APP_URL }}
      OCEL_REPORT_SECRET: ${{ secrets.OCEL_REPORT_SECRET }}
      PR: ${{ github.event.pull_request.number }}
      SHA: ${{ github.event.pull_request.head.sha }}
      REF: ${{ github.event.pull_request.head.ref }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Checkout the branch the preview is named after
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Take the CLI this preview is deployed with
        uses: ./.github/actions/ocel-binary
        with:
          source: ${{ needs.binary.outputs.preview == 'release' && 'release' || 'prebuilt' }}
          turbo-token: ${{ secrets.TURBO_TOKEN }}
          turbo-team: ${{ vars.TURBO_TEAM }}

      - name: Enter the account Ocel deploys itself into
        uses: ./.github/actions/dogfood-session
        with:
          role-to-assume: ${{ secrets.DOGFOOD_AWS_ROLE_ARN }}
          aws-region: ${{ vars.DOGFOOD_AWS_REGION }}
          role-session-name: ocel-preview-${{ github.run_id }}
          expected-aws-account-id: ${{ secrets.DOGFOOD_EXPECTED_AWS_ACCOUNT_ID }}
          cloudflare-api-token: ${{ secrets.DOGFOOD_CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ secrets.DOGFOOD_CLOUDFLARE_ACCOUNT_ID }}
          vars-key: ${{ vars.DOGFOOD_AWS_VARS_KEY }}

      - name: Tell the app the preview has started
        id: report-started
        continue-on-error: true
        run: scripts/preview-report.sh started

      - name: Stand the preview up
        id: up
        env:
          OCEL_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          ocel preview up --yes --log-format json 2>&1 | tee "$RUNNER_TEMP/preview.log"

      - name: Drop the deployments this preview has outgrown
        run: ocel preview prune --yes

      - name: Tell the app the preview is deployed
        id: report-deployed
        if: ${{ success() }}
        continue-on-error: true
        run: scripts/preview-report.sh deployed .ocel/deploy-result.json

      - name: Tell the app the preview failed
        id: report-failed
        if: ${{ failure() }}
        continue-on-error: true
        run: |
          set -euo pipefail
          ERROR=$(scripts/preview-error.sh)
          export ERROR
          scripts/preview-report.sh failed

      - name: Mint the token the fallback comment is written with
        id: app-token
        if: ${{ always() && (steps.report-deployed.outcome == 'failure' || steps.report-failed.outcome == 'failure') && github.event.pull_request.number }}
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.OCEL_GITHUB_APP_ID }}
          private-key: ${{ secrets.OCEL_GITHUB_APP_PRIVATE_KEY }}

      - name: Say on the pull request what the app could not
        if: ${{ always() && steps.app-token.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          OUTCOME: ${{ steps.up.outcome }}
        run: |
          set -euo pipefail
          if [ "$OUTCOME" = success ] && [ -f .ocel/deploy-result.json ]; then
            body=$(scripts/preview-comment.sh deployed .ocel/deploy-result.json)
          else
            ERROR=$(scripts/preview-error.sh)
            body=$(ERROR="$ERROR" scripts/preview-comment.sh failed)
          fi
          existing=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq 'map(select(.body | contains("<!-- ocel-preview -->"))) | first | .id // empty')
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$existing" -f body="$body"
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -f body="$body"
          fi

      - name: Keep what the preview reported
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-result
          path: |
            .ocel/deploy-result.json
            ${{ runner.temp }}/preview.log
          if-no-files-found: warn

  preview-down:
    name: preview-down
    if: ${{ github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: preview-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    env:
      OCEL_CONFIG: ocel.aws.json
      OCEL_GITHUB_APP_URL: ${{ vars.OCEL_GITHUB_APP_URL }}
      OCEL_REPORT_SECRET: ${{ secrets.OCEL_REPORT_SECRET }}
      PR: ${{ github.event.pull_request.number }}
      SHA: ${{ github.event.pull_request.head.sha }}
      REF: ${{ github.event.pull_request.head.ref }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Checkout the base branch, the head one may already be gone
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}

      - name: Take the CLI this preview is torn down with
        uses: ./.github/actions/ocel-binary
        with:
          source: ${{ contains(github.event.pull_request.labels.*.name, 'dogfood:release') && 'release' || 'head' }}
          turbo-token: ${{ secrets.TURBO_TOKEN }}
          turbo-team: ${{ vars.TURBO_TEAM }}

      - name: Enter the account Ocel deploys itself into
        uses: ./.github/actions/dogfood-session
        with:
          role-to-assume: ${{ secrets.DOGFOOD_AWS_ROLE_ARN }}
          aws-region: ${{ vars.DOGFOOD_AWS_REGION }}
          role-session-name: ocel-preview-${{ github.run_id }}
          expected-aws-account-id: ${{ secrets.DOGFOOD_EXPECTED_AWS_ACCOUNT_ID }}
          cloudflare-api-token: ${{ secrets.DOGFOOD_CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ secrets.DOGFOOD_CLOUDFLARE_ACCOUNT_ID }}
          vars-key: ${{ vars.DOGFOOD_AWS_VARS_KEY }}

      - name: Tear the preview down
        env:
          REF: ${{ github.event.pull_request.head.ref }}
        run: ocel preview rm --ref "$REF" --yes

      - name: Tell the app the preview is gone
        continue-on-error: true
        run: scripts/preview-report.sh removed

  reapable:
    name: reapable
    if: ${{ github.event.action == 'closed' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      ids: ${{ steps.runs.outputs.ids }}
    steps:
      - name: Name the runs this pull request stood cells up under
        id: runs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          ids=$(gh run list --workflow journey.yml --branch "$HEAD_REF" \
            --limit 100 --json databaseId --jq '.[].databaseId' | sort -u | paste -sd' ' -)
          echo "ids=$ids" >> "$GITHUB_OUTPUT"
          echo "${ids:-no journey run} stood cells up for this pull request"

  reap:
    name: reap
    needs: reapable
    if: ${{ needs.reapable.outputs.ids != '' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
      actions: read
    env:
      OCEL_CONFIG: ocel.aws.json
      OCEL_TARGET: aws
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.E2E_CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.E2E_CLOUDFLARE_API_TOKEN }}
      OCEL_AWS_VARS_KEY: ${{ vars.DOGFOOD_AWS_VARS_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: ./.github/actions/node-workspace
        with:
          turbo-token: ${{ secrets.TURBO_TOKEN }}
          turbo-team: ${{ vars.TURBO_TEAM }}

      - name: The node bundles the fixtures and the external stacks import
        run: pnpm turbo run build --filter=ocel --filter=@ocel/sst --filter=@ocel/pulumi

      - name: Setup Go
        uses: ./.github/actions/go

      - uses: ./.github/actions/goreleaser

      - name: Build the binaries this reaping drives
        run: |
          set -euo pipefail
          node scripts/snapshot.mjs | tee -a "$GITHUB_ENV"

      - name: Assume the session that may spend the real account
        uses: ./.github/actions/real-aws-session
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
          bun-version: ${{ env.BUN_VERSION }}
          aws-region: ${{ vars.E2E_AWS_REGION }}
          role-to-assume: ${{ secrets.E2E_AWS_ROLE_ARN }}
          role-session-name: ocel-journey-reap-${{ github.run_id }}
          role-duration-seconds: "3600"
          guard-script: tests/next-compat/guard-accounts.sh
          expected-aws-account-id: ${{ secrets.E2E_EXPECTED_AWS_ACCOUNT_ID }}
          expected-cloudflare-account-id: ${{ secrets.E2E_EXPECTED_CLOUDFLARE_ACCOUNT_ID }}

      - name: Name the account and the zone this reaping may touch
        env:
          EXPECTED: ${{ secrets.E2E_EXPECTED_AWS_ACCOUNT_ID }}
          ZONE: ${{ vars.E2E_PREVIEW_DOMAIN }}
          REGION: ${{ vars.E2E_AWS_REGION }}
        run: |
          set -euo pipefail
          ZONE=${ZONE#\*.}
          {
            echo "EXPECTED_AWS_ACCOUNT_ID=$EXPECTED"
            echo "OCEL_JOURNEY_ZONE=$ZONE"
            echo "AWS_REGION=$REGION"
          } >> "$GITHUB_ENV"

      - name: Reclaim the cells and namespaces those runs left standing
        env:
          IDS: ${{ needs.reapable.outputs.ids }}
        run: |
          set -uo pipefail
          status=0
          for id in $IDS; do
            pnpm --filter @ocel-tests/journeys sweep --target aws --run "$id" || status=1
          done
          exit "$status"
