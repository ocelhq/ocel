name: Journey

on:
  pull_request:
    types: [opened, synchronize, reopened, closed, labeled]
    paths:
      - "cli/**"
      - "packages/**"
      - "frameworks/**"
      - "pkg/**"
      - "sdk/**"
      - "proto/**"
      - "platform/**"
      - "console/resources/**"
      - "console/api/**"
      - "console/auth/**"
      - "console/db/**"
      - "console/web/**"
      - "examples/**"
      - "tests/journeys/**"
      - "tests/shared/**"
      - "scripts/floci.sh"
      - "scripts/incus.sh"
      - "scripts/ec2.sh"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".github/workflows/journey.yml"
      - ".github/actions/**"
  workflow_dispatch:
    inputs:
      targets:
        description: "Targets to drive against their real accounts, space separated. dev is never dispatched."
        default: "aws vps"
        type: string
      edges:
        description: "Edges the aws lane runs, space separated."
        default: "api-gateway cloudfront cloudflare"
        type: string
      examples:
        description: "Examples each lane runs, space separated."
        default: "express hono fastify next"
        type: string

permissions:
  contents: read
  id-token: write
  pull-requests: write

concurrency:
  group: ${{ github.event.action == 'labeled' && format('journey-real-{0}', github.event.pull_request.number) || format('journey-{0}', github.event.pull_request.number || github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action != 'labeled' }}

env:
  OCEL_FLOCI_IMAGE: floci/floci:2.0.1
  NODE_VERSION: "22"
  PNPM_VERSION: "11.10.0"
  BUN_VERSION: "1.4.0"
  PR_EDGES: "api-gateway cloudfront cloudflare"
  BINARIES: packages/native-lib

jobs:
  changes:
    name: lanes this run drives
    if: ${{ github.event.action != 'closed' && (github.event.action != 'labeled' || github.event.label.name == 'journey:real') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      dev: ${{ steps.lanes.outputs.dev }}
      aws: ${{ steps.lanes.outputs.aws }}
      vps: ${{ steps.lanes.outputs.vps }}
      edges: ${{ steps.lanes.outputs.edges }}
      examples: ${{ steps.lanes.outputs.examples }}
      real: ${{ steps.lanes.outputs.real }}
    steps:
      - name: Spend the label that asked for this run
        if: ${{ github.event.action == 'labeled' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr edit "$PR" --remove-label journey:real

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pick the lanes
        id: lanes
        env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          LABEL: ${{ github.event.label.name }}
          TARGETS: ${{ inputs.targets }}
          EDGES: ${{ inputs.edges }}
          EXAMPLES: ${{ inputs.examples }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          named() {
            for want in $2; do
              [ "$want" = "$1" ] && { echo true; return; }
            done
            echo false
          }

          forced=${OCEL_JOURNEY_LANES:-}
          real=false
          if [ "$EVENT" = workflow_dispatch ]; then
            real=true
          elif [ "$ACTION" = labeled ] && [ "$LABEL" = journey:real ]; then
            real=true
            TARGETS="aws vps"
            EXAMPLES="express hono fastify next"
          fi

          if [ -n "$forced" ]; then
            lanes=${forced/all/dev aws vps}
            dev=$(named dev "$lanes")
            aws=$(named aws "$lanes")
            vps=$(named vps "$lanes")
          elif [ "$real" = true ]; then
            dev=false
            aws=$(named aws "$TARGETS")
            vps=$(named vps "$TARGETS")
          else
            files=$(git diff --name-only "$BASE" "$HEAD")
            echo "$files"
            hit() { printf '%s\n' "$files" | grep -Eq "$1" && echo true || echo false; }
            shared='^(cli|packages|frameworks|pkg|sdk|proto|examples|tests/journeys|tests/shared)/'
            shared="$shared"'|^\.github/(actions/|workflows/journey\.yml$)'
            shared="$shared"'|^(package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml)$'
            dev=$(hit "$shared"'|^console/(resources|api|auth|db|web)/')
            aws=$(hit "$shared"'|^platform/(aws|edge)/|^scripts/floci\.sh$')
            vps=$(hit "$shared"'|^platform/vps/|^scripts/(incus|ec2)\.sh$')
          fi

          if [ "$real" = true ]; then
            edges=$(jq -nc --arg edges "${EDGES:-$PR_EDGES}" '[{name: "real", edges: $edges}]')
          else
            edges=$(printf '%s\n' $PR_EDGES | jq -Rc '{name: ., edges: .}' | jq -sc .)
          fi

          {
            echo "dev=$dev"
            echo "aws=$aws"
            echo "vps=$vps"
            echo "edges=$edges"
            echo "examples=$(echo "$EXAMPLES" | tr ' ' ',')"
            echo "real=$real"
          } >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  binary:
    name: the binaries every lane drives
    needs: changes
    if: ${{ needs.changes.outputs.dev == 'true' || needs.changes.outputs.aws == 'true' || needs.changes.outputs.vps == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: ./.github/actions/node-workspace
        with:
          turbo-token: ${{ secrets.TURBO_TOKEN }}
          turbo-team: ${{ vars.TURBO_TEAM }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: |
            cli/go.sum
            platform/aws/provider/go.sum
            platform/vps/provider/go.sum
            pkg/proto/go.sum
            sdk/go.sum

      - name: Setup gobuildcache
        uses: ./.github/actions/gobuildcache
        with:
          bucket: ${{ vars.GOBUILDCACHE_S3_BUCKET }}
          region: ${{ vars.GOBUILDCACHE_AWS_REGION }}
          role-to-assume: ${{ secrets.GOBUILDCACHE_AWS_ROLE_ARN }}

      - name: The node bundle the CLI binary is built around
        run: pnpm turbo run build --filter=ocel

      - name: Build the binaries a journey drives
        run: |
          set -euo pipefail
          node scripts/build-native.mjs --host --target cli
          node scripts/build-native.mjs --host --target provider-aws
          node scripts/build-native.mjs --host --target provider-vps

      - name: Upload them for the lanes
        uses: actions/upload-artifact@v4
        with:
          name: journey-binaries
          if-no-files-found: error
          path: |
            ${{ env.BINARIES }}/cli-linux-x64/bin/ocel
            ${{ env.BINARIES }}/provider-aws-linux-x64/bin/deploy
            ${{ env.BINARIES }}/provider-vps-linux-x64/bin/deploy

  dev:
    name: dev
    needs: [changes, binary]
    if: ${{ needs.changes.outputs.dev == 'true' && needs.binary.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OCEL_TARGET: dev
      OCEL_EXAMPLES: ${{ needs.changes.outputs.examples }}
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      OCEL_RESOURCE_POSTGRES_main: '{"name":"main","postgres":{"host":"localhost","port":5432,"database":"postgres","username":"postgres","password":"postgres"}}'
      OCEL_CLOUD_ADMIN_URL: postgres://postgres:postgres@localhost:5433/postgres
      BETTER_AUTH_SECRET: journey-secret-not-for-production
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_BETTER_AUTH_URL: http://localhost:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: ./.github/actions/node-workspace
        with:
          turbo-token: ${{ secrets.TURBO_TOKEN }}
          turbo-team: ${{ vars.TURBO_TEAM }}

      - name: The node bundle the examples import
        run: pnpm turbo run build --filter=ocel

      - name: Take the binaries this lane drives
        uses: ./.github/actions/journey-binaries

      - name: Start the services the console stands on
        run: docker compose up -d

      - name: Wait for Postgres to be ready
        run: |
          for svc in postgres ocel-cloud; do
            echo "Waiting for $svc ..."
            for i in $(seq 1 60); do
              if docker compose exec -T "$svc" pg_isready -U postgres >/dev/null 2>&1; then
                echo "$svc is ready"
                break
              fi
              sleep 1
              if [ "$i" -eq 60 ]; then
                echo "$svc did not become ready" >&2
                exit 1
              fi
            done
          done

      - name: Push control-plane schema
        run: pnpm --filter @console/db db:push

      - name: Start console/web (Next dev)
        run: |
          pnpm --filter @console/web dev > /tmp/web.log 2>&1 &
          echo "Waiting for console/web on :3000 ..."
          for i in $(seq 1 90); do
            if curl -s -o /dev/null http://localhost:3000; then
              echo "console/web is up"
              break
            fi
            sleep 1
            if [ "$i" -eq 90 ]; then
              echo "console/web did not start; last log:" >&2
              cat /tmp/web.log >&2
              exit 1
            fi
          done

      - name: Run the journey
        run: pnpm --filter @ocel-tests/journeys journey

      - name: Dump console/web log on failure
        if: failure()
        run: cat /tmp/web.log || true

      - name: Upload the evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journey-evidence-dev
          path: |
            tests/journeys/output
            !tests/journeys/output/**/trees/**/node_modules/**
          if-no-files-found: warn

  aws:
    name: aws (${{ matrix.edge.name }})
    needs: [changes, binary]
    if: ${{ needs.changes.outputs.aws == 'true' && needs.binary.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ needs.changes.outputs.real == 'true' && 120 || 45 }}
    strategy:
      fail-fast: false
      matrix:
        edge: ${{ fromJSON(needs.changes.outputs.edges) }}
    concurrency:
      group: ${{ needs.changes.outputs.real == 'true' && 'real-aws' || format('journey-aws-{0}-{1}', github.event.pull_request.number, matrix.edge.name) }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action != 'labeled' }}
    env:
      OCEL_TARGET: aws
      OCEL_EXAMPLES: ${{ needs.changes.outputs.examples }}
      CLOUDFLARE_ACCOUNT_ID: ${{ needs.changes.outputs.real == 'true' && secrets.E2E_CLOUDFLARE_ACCOUNT_ID || '' }}
      CLOUDFLARE_API_TOKEN: ${{ needs.changes.outputs.real == 'true' && secrets.E2E_CLOUDFLARE_API_TOKEN || '' }}
      REAL: ${{ needs.changes.outputs.real }}
      EDGES: ${{ matrix.edge.edges }}
      EMULATOR: ocel-journey-${{ matrix.edge.name }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: ./.github/actions/node-workspace
        with:
          turbo-token: ${{ secrets.TURBO_TOKEN }}
          turbo-team: ${{ vars.TURBO_TEAM }}

      - name: The node bundles the examples and the ladders import
        run: pnpm turbo run build --filter=ocel --filter=@ocel/sst --filter=@ocel/pulumi

      - name: Take the binaries this lane drives
        uses: ./.github/actions/journey-binaries

      - name: Pull the emulator this lane deploys into
        if: ${{ needs.changes.outputs.real != 'true' }}
        run: docker pull "$OCEL_FLOCI_IMAGE"

      - name: Assume the session that may spend the real account
        if: ${{ needs.changes.outputs.real == 'true' }}
        uses: ./.github/actions/real-aws-session
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
          bun-version: ${{ env.BUN_VERSION }}
          aws-region: ${{ vars.E2E_AWS_REGION }}
          role-to-assume: ${{ secrets.E2E_AWS_ROLE_ARN }}
          role-session-name: ocel-journey-aws-${{ github.run_id }}
          role-duration-seconds: "14400"
          guard-script: tests/next-compat/guard-accounts.sh
          expected-aws-account-id: ${{ secrets.E2E_EXPECTED_AWS_ACCOUNT_ID }}
          expected-cloudflare-account-id: ${{ secrets.E2E_EXPECTED_CLOUDFLARE_ACCOUNT_ID }}

      - name: Name the account and the zone this run may touch
        if: ${{ needs.changes.outputs.real == 'true' }}
        env:
          EXPECTED: ${{ secrets.E2E_EXPECTED_AWS_ACCOUNT_ID }}
          ZONE: ${{ vars.E2E_PREVIEW_DOMAIN }}
          REGION: ${{ vars.E2E_AWS_REGION }}
        run: |
          set -euo pipefail
          ZONE=${ZONE#\*.}
          {
            echo "EXPECTED_AWS_ACCOUNT_ID=$EXPECTED"
            echo "OCEL_JOURNEY_ZONE=$ZONE"
            echo "AWS_REGION=$REGION"
          } >> "$GITHUB_ENV"

      - name: Reclaim what a run that died left in the account
        if: ${{ needs.changes.outputs.real == 'true' }}
        run: pnpm --filter @ocel-tests/journeys sweep --target aws

      - name: Run the journey on every edge this cell holds
        run: |
          set -uo pipefail
          status=0
          for edge in $EDGES; do
            echo "::group::aws journey on $edge"
            if [ "$REAL" != true ]; then
              OCEL_AWS_EDGE=$edge scripts/floci.sh run "$EMULATOR-$edge" -- \
                bash -c 'AWS_ENDPOINT_URL=${OCEL_FLOCI_ENDPOINT/127.0.0.1/localhost.localstack.cloud} pnpm --filter @ocel-tests/journeys journey' ||
                status=1
            else
              OCEL_AWS_EDGE=$edge pnpm --filter @ocel-tests/journeys journey || status=1
            fi
            echo "::endgroup::"
          done
          exit $status

      - name: No emulator left behind
        if: always()
        run: |
          for edge in $EDGES; do
            scripts/floci.sh destroy "$EMULATOR-$edge" || echo "could not destroy $EMULATOR-$edge"
          done

      - name: Upload the evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journey-evidence-aws-${{ matrix.edge.name }}
          path: |
            tests/journeys/output
            !tests/journeys/output/**/trees/**/node_modules/**
          if-no-files-found: warn

  vps:
    name: vps
    needs: [changes, binary]
    if: ${{ needs.changes.outputs.vps == 'true' && needs.binary.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ needs.changes.outputs.real == 'true' && 90 || 45 }}
    concurrency:
      group: ${{ needs.changes.outputs.real == 'true' && 'real-vps' || format('journey-vps-{0}', github.event.pull_request.number) }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action != 'labeled' }}
    env:
      OCEL_TARGET: vps
      OCEL_EXAMPLES: ${{ needs.changes.outputs.examples }}
      CLOUDFLARE_ACCOUNT_ID: ${{ needs.changes.outputs.real == 'true' && secrets.E2E_CLOUDFLARE_ACCOUNT_ID || '' }}
      CLOUDFLARE_API_TOKEN: ${{ needs.changes.outputs.real == 'true' && secrets.E2E_CLOUDFLARE_API_TOKEN || '' }}
      VM: ocel-journey-${{ github.run_id }}-${{ github.run_attempt }}
      BOX: journey-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup the incus host
        if: ${{ needs.changes.outputs.real != 'true' }}
        uses: ./.github/actions/incus-vm
        with:
          gobuildcache-bucket: ${{ vars.GOBUILDCACHE_S3_BUCKET }}
          gobuildcache-region: ${{ vars.GOBUILDCACHE_AWS_REGION }}
          gobuildcache-role-to-assume: ${{ secrets.GOBUILDCACHE_AWS_ROLE_ARN }}

      - uses: ./.github/actions/node-workspace
        if: ${{ needs.changes.outputs.real == 'true' }}
        with:
          turbo-token: ${{ secrets.TURBO_TOKEN }}
          turbo-team: ${{ vars.TURBO_TEAM }}

      - name: The node bundle the examples import
        if: ${{ needs.changes.outputs.real == 'true' }}
        run: pnpm turbo run build --filter=ocel

      - name: Take the binaries this lane drives
        uses: ./.github/actions/journey-binaries

      - name: Bring up the box this lane deploys to
        if: ${{ needs.changes.outputs.real != 'true' }}
        run: |
          set -euo pipefail
          sg incus-admin -c "scripts/incus.sh create $VM"
          eval "$(sg incus-admin -c "scripts/incus.sh info $VM")"
          {
            echo "OCEL_VPS_HOST=$OCEL_INCUS_ADDR"
            echo "OCEL_VPS_USER=$OCEL_INCUS_USER"
            echo "OCEL_VPS_IDENTITY_FILE=$OCEL_INCUS_KEY"
          } >> "$GITHUB_ENV"

      - name: Assume the session that may spend the real account
        if: ${{ needs.changes.outputs.real == 'true' }}
        uses: ./.github/actions/real-aws-session
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
          aws-region: ${{ vars.E2E_AWS_REGION }}
          role-to-assume: ${{ secrets.E2E_AWS_ROLE_ARN }}
          role-session-name: ocel-journey-vps-${{ github.run_id }}
          role-duration-seconds: "7200"
          guard-script: tests/next-compat/guard-accounts.sh
          expected-aws-account-id: ${{ secrets.E2E_EXPECTED_AWS_ACCOUNT_ID }}
          expected-cloudflare-account-id: ${{ secrets.E2E_EXPECTED_CLOUDFLARE_ACCOUNT_ID }}

      - name: Name the account this run may touch
        if: ${{ needs.changes.outputs.real == 'true' }}
        env:
          EXPECTED: ${{ secrets.E2E_EXPECTED_AWS_ACCOUNT_ID }}
          REGION: ${{ vars.E2E_AWS_REGION }}
        run: |
          set -euo pipefail
          {
            echo "EXPECTED_AWS_ACCOUNT_ID=$EXPECTED"
            echo "AWS_REGION=$REGION"
          } >> "$GITHUB_ENV"

      - name: Reclaim boxes a run that died left behind
        if: ${{ needs.changes.outputs.real == 'true' }}
        run: scripts/ec2.sh sweep

      - name: Bring up the box this lane deploys to
        if: ${{ needs.changes.outputs.real == 'true' }}
        run: |
          set -euo pipefail
          eval "$(scripts/ec2.sh create "$BOX")"
          {
            echo "OCEL_VPS_HOST=$OCEL_EC2_ADDR"
            echo "OCEL_VPS_USER=$OCEL_EC2_USER"
            echo "OCEL_VPS_IDENTITY_FILE=$OCEL_EC2_KEY"
          } >> "$GITHUB_ENV"

      - name: Run the journey
        run: pnpm --filter @ocel-tests/journeys journey

      - name: No VM left behind
        if: ${{ always() && needs.changes.outputs.real != 'true' }}
        run: sg incus-admin -c "scripts/incus.sh destroy $VM" || echo "could not destroy $VM"

      - name: No box left behind
        if: ${{ always() && needs.changes.outputs.real == 'true' }}
        run: scripts/ec2.sh destroy "$BOX" || echo "could not destroy $BOX"

      - name: Upload the evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journey-evidence-vps
          path: |
            tests/journeys/output
            !tests/journeys/output/**/trees/**/node_modules/**
          if-no-files-found: warn
