name: Deploy

on:
  push:
    branches:
      - main
    paths:
      - "www/**"
      - "ocel.aws.json"
      - "packages/ocel/**"
      - ".github/workflows/deploy.yml"
      - ".github/actions/ocel-binary/**"
  workflow_dispatch:
    inputs:
      ref:
        description: "Ref to deploy instead of main. Empty deploys the commit this run was dispatched from."
        default: ""
        type: string
      cli:
        description: "head builds the CLI from the deployed ref; release installs the published one."
        default: head
        type: choice
        options: [head, release]

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  OCEL_CONFIG: ocel.aws.json
  OCEL_CONSOLE_PROJECT_ID: ${{ vars.OCEL_CONSOLE_PROJECT_ID }}
  OCEL_CONSOLE_URL: ${{ vars.OCEL_CONSOLE_URL }}

jobs:
  deploy:
    name: production
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Take the CLI this deploy is driven with
        uses: ./.github/actions/ocel-binary
        with:
          source: ${{ inputs.cli || 'head' }}
          turbo-token: ${{ secrets.TURBO_TOKEN }}
          turbo-team: ${{ vars.TURBO_TEAM }}

      - name: Enter the account Ocel deploys itself into
        uses: ./.github/actions/dogfood-session
        with:
          aws-region: ${{ vars.DOGFOOD_AWS_REGION }}
          cloudflare-api-token: ${{ secrets.DOGFOOD_CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ secrets.DOGFOOD_CLOUDFLARE_ACCOUNT_ID }}
          variables-key: ${{ vars.DOGFOOD_AWS_VARS_KEY }}

      - name: Build, and stop unless the console's credential reaches the dogfood account
        env:
          EXPECTED: ${{ secrets.DOGFOOD_EXPECTED_AWS_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          ocel deploy --dry --json --tag "sha-$(git rev-parse --short=7 HEAD)" > "$RUNNER_TEMP/dry.ndjson"
          scripts/dogfood-account-guard.sh "$RUNNER_TEMP/dry.ndjson" "$EXPECTED"

      - name: Deploy
        run: ocel deploy --prebuilt --yes --json --tag "sha-$(git rev-parse --short=7 HEAD)"

      - name: Keep what the deploy reported
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deploy-report
          path: .ocel/deploy-report.json
          if-no-files-found: warn
