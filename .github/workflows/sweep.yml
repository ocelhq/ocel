name: Sweep

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  OCEL_CONFIG: ocel.aws.config.ts

jobs:
  ec2:
    name: boxes a run that died left behind
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assume the E2E deploy role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.E2E_AWS_ROLE_ARN }}
          aws-region: ${{ vars.E2E_AWS_REGION }}
          role-session-name: ocel-sweep-${{ github.run_id }}

      - name: Guard the account this sweep may touch
        env:
          EXPECTED: ${{ secrets.E2E_EXPECTED_AWS_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          account=$(aws sts get-caller-identity --query Account --output text)
          [ -n "$EXPECTED" ] || { echo "no expected account is named" >&2; exit 1; }
          [ "$account" = "$EXPECTED" ] || { echo "session is account $account, not $EXPECTED" >&2; exit 1; }

      - name: Reclaim the boxes nothing is using
        run: scripts/ec2.sh sweep

  journeys:
    name: journey cells and namespaces no run is using
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      actions: read
    env:
      OCEL_TARGET: aws
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.E2E_CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.E2E_CLOUDFLARE_API_TOKEN }}
      OCEL_AWS_VARS_KEY: ${{ vars.DOGFOOD_AWS_VARS_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: ./.github/actions/node-workspace
        with:
          turbo-token: ${{ secrets.TURBO_TOKEN }}
          turbo-team: ${{ vars.TURBO_TEAM }}

      - name: The node bundles the fixtures and the ladders import
        run: pnpm turbo run build --filter=ocel --filter=@ocel/sst --filter=@ocel/pulumi

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: |
            cli/go.sum
            platform/aws/provider/go.sum
            platform/vps/provider/go.sum
            pkg/proto/go.sum
            sdk/go.sum

      - name: Setup gobuildcache
        uses: ./.github/actions/gobuildcache
        with:
          bucket: ${{ vars.GOBUILDCACHE_S3_BUCKET }}
          region: ${{ vars.GOBUILDCACHE_AWS_REGION }}
          role-to-assume: ${{ secrets.GOBUILDCACHE_AWS_ROLE_ARN }}

      - name: Build the binaries this sweep drives
        run: |
          set -euo pipefail
          node scripts/build-native.mjs --host --target cli
          node scripts/build-native.mjs --host --target provider-aws
          echo "OCEL_BIN=$GITHUB_WORKSPACE/packages/native-lib/cli-linux-x64/bin/ocel" >> "$GITHUB_ENV"

      - name: Assume the session that may spend the real account
        uses: ./.github/actions/real-aws-session
        with:
          node-version: "22"
          pnpm-version: "11.10.0"
          bun-version: "1.4.0"
          aws-region: ${{ vars.E2E_AWS_REGION }}
          role-to-assume: ${{ secrets.E2E_AWS_ROLE_ARN }}
          role-session-name: ocel-sweep-journeys-${{ github.run_id }}
          role-duration-seconds: "3600"
          guard-script: tests/next-compat/guard-accounts.sh
          expected-aws-account-id: ${{ secrets.E2E_EXPECTED_AWS_ACCOUNT_ID }}
          expected-cloudflare-account-id: ${{ secrets.E2E_EXPECTED_CLOUDFLARE_ACCOUNT_ID }}

      - name: Name the account and the zone this run may touch
        env:
          EXPECTED: ${{ secrets.E2E_EXPECTED_AWS_ACCOUNT_ID }}
          ZONE: ${{ vars.E2E_PREVIEW_DOMAIN }}
          REGION: ${{ vars.E2E_AWS_REGION }}
        run: |
          set -euo pipefail
          ZONE=${ZONE#\*.}
          {
            echo "EXPECTED_AWS_ACCOUNT_ID=$EXPECTED"
            echo "OCEL_JOURNEY_ZONE=$ZONE"
            echo "AWS_REGION=$REGION"
          } >> "$GITHUB_ENV"

      - name: Reclaim the cells and namespaces no run is using
        run: pnpm --filter @ocel-tests/journeys sweep --target aws

  previews:
    name: previews whose pull request has closed
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Take the CLI this sweep is driven with
        uses: ./.github/actions/ocel-binary
        with:
          source: head
          turbo-token: ${{ secrets.TURBO_TOKEN }}
          turbo-team: ${{ vars.TURBO_TEAM }}
          gobuildcache-bucket: ${{ vars.GOBUILDCACHE_S3_BUCKET }}
          gobuildcache-region: ${{ vars.GOBUILDCACHE_AWS_REGION }}
          gobuildcache-role-to-assume: ${{ secrets.GOBUILDCACHE_AWS_ROLE_ARN }}

      - name: Enter the account Ocel deploys itself into
        uses: ./.github/actions/dogfood-session
        with:
          role-to-assume: ${{ secrets.DOGFOOD_AWS_ROLE_ARN }}
          aws-region: ${{ vars.DOGFOOD_AWS_REGION }}
          role-session-name: ocel-sweep-previews-${{ github.run_id }}
          expected-aws-account-id: ${{ secrets.DOGFOOD_EXPECTED_AWS_ACCOUNT_ID }}
          cloudflare-api-token: ${{ secrets.DOGFOOD_CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ secrets.DOGFOOD_CLOUDFLARE_ACCOUNT_ID }}
          vars-key: ${{ vars.DOGFOOD_AWS_VARS_KEY }}

      - name: Reclaim the previews whose pull request has closed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          ocel preview ls | tee "$RUNNER_TEMP/previews.tsv"
          status=0
          while IFS=$'\t' read -r identity lifecycle label _; do
            [ "$lifecycle" = ephemeral ] || continue
            case "$label" in pr-[0-9]*) ;; *) continue ;; esac
            pr=${label#pr-}
            state=$(gh pr view "$pr" --json state -q .state) || {
              echo "::warning::no pull request $pr behind preview $identity"
              continue
            }
            [ "$state" != OPEN ] || continue
            ref=$(gh pr view "$pr" --json headRefName -q .headRefName)
            echo "preview $identity belongs to pull request $pr, $state on branch $ref"
            ocel preview rm --ref "$ref" --yes || status=1
          done < "$RUNNER_TEMP/previews.tsv"
          exit "$status"
