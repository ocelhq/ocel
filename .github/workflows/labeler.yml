name: Labeler

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

concurrency:
  group: labeler-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    name: label
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: A pull request gets the area label of every path it changes
        uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13
