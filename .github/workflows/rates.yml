name: Rates

on:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    name: refresh the rate cards from the vendors' price lists
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GCP_BILLING_API_KEY: ${{ secrets.GCP_BILLING_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Go
        uses: ./.github/actions/go

      - name: Refresh the AWS card
        run: go run -C platform/aws/provider ./cost/refresh -card cost/rates.json

      - name: Refresh the GCP card
        if: ${{ env.GCP_BILLING_API_KEY != '' }}
        run: go run -C platform/gcp/provider ./cost/refresh -card cost/rates.json

      - name: Open a pull request with what moved
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676
        with:
          branch: chore/rates-refresh
          commit-message: "chore(cost): refresh the rate cards"
          title: "chore(cost): refresh the rate cards"
          body: The rate cards, rewritten from the vendors' current price lists by the weekly refresh.
          delete-branch: true
