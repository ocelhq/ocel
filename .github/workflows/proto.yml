name: Proto

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generated:
    name: generated
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: ./.github/actions/node-workspace

      - name: Setup Go
        uses: ./.github/actions/go

      - run: pnpm gen

      - name: Report what regeneration changed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::The committed bindings do not match the protos. Run \`pnpm gen\` and commit the result."
            git status --porcelain
            git diff
            exit 1
          fi
