name: Integration Tests

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  OCEL_FLOCI_IMAGE: ghcr.io/ocelhq/floci:2.1.0-ocel.1
  OCEL_FLOCI_GCP_IMAGE: floci/floci-gcp:0.8.0
  OCEL_FLOCI_FIRESTORE_IMAGE: gcr.io/google.com/cloudsdktool/google-cloud-cli:587.0.0-emulators
  OCEL_VPS_OFFICIAL_IMAGES_MIRROR: mirror.gcr.io/library
  VPS_SHARDS: 8
  VPS_RUNNERS: 2
  ENGINE_TEST: TestLiveTheEngineIsInstalledOnConsentAndAnIdleDaemonIsOnlyStarted

jobs:
  aws:
    name: AWS
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      LIVE: ocel-aws-live-${{ github.run_id }}-${{ github.run_attempt }}
      LIFECYCLE: ocel-aws-lifecycle-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Go
        uses: ./.github/actions/go
        with:
          caches: modules,build
          build-scope: aws

      - uses: ./.github/actions/node-workspace
        with:
          turbo-token: ${{ secrets.TURBO_TOKEN }}
          turbo-team: ${{ vars.TURBO_TEAM }}

      - name: Has the live suite already passed what it reads
        id: gate-live
        uses: ./.github/actions/suite-gate
        with:
          suite: aws-live
          task: "@platform/aws-payloads#live"

      - name: Has the lifecycle suite already passed what it reads
        id: gate-lifecycle
        uses: ./.github/actions/suite-gate
        with:
          suite: aws-lifecycle
          task: "@platform/aws-payloads#lifecycle"

      - name: The node bundle the CLI binary is built around, and what the provider embeds
        if: steps.gate-live.outputs.green != 'true' || steps.gate-lifecycle.outputs.green != 'true'
        run: |
          set -euo pipefail
          pnpm turbo run build --filter=ocel
          go generate -C cli ./...
          go generate -C platform/aws/provider ./...

      - name: The provider binary the suites drive
        if: steps.gate-live.outputs.green != 'true' || steps.gate-lifecycle.outputs.green != 'true'
        run: |
          set -euo pipefail
          go build -o "$RUNNER_TEMP/provider-aws" ./platform/aws/provider/cmd/deploy
          echo "OCEL_AWS_PROVIDER_BINARY=$RUNNER_TEMP/provider-aws" >> "$GITHUB_ENV"

      - name: Log in to the registry the emulator image lives in
        if: steps.gate-live.outputs.green != 'true' || steps.gate-lifecycle.outputs.green != 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull the emulator both suites run against
        if: steps.gate-live.outputs.green != 'true' || steps.gate-lifecycle.outputs.green != 'true'
        run: docker pull "$OCEL_FLOCI_IMAGE"

      - name: Run every integration test but the lifecycle suite on an emulator
        if: steps.gate-live.outputs.green != 'true'
        run: scripts/floci.sh run "$LIVE" -- go test -race -count=1 -timeout 30m -tags integration -skip '^TestLifecycle' ./platform/aws/provider/... ./platform/aws/runtime/...

      - name: Record that what the live suite reads has passed
        if: steps.gate-live.outputs.green != 'true'
        uses: ./.github/actions/suite-passed
        with:
          suite: aws-live
          key: ${{ steps.gate-live.outputs.key }}

      - name: Run the lifecycle suite on an emulator of its own
        if: steps.gate-lifecycle.outputs.green != 'true'
        run: scripts/floci.sh run "$LIFECYCLE" -- go test -race -count=1 -timeout 30m -tags integration -run '^TestLifecycle' ./platform/aws/provider/... ./platform/aws/runtime/...

      - name: Record that what the lifecycle suite reads has passed
        if: steps.gate-lifecycle.outputs.green != 'true'
        uses: ./.github/actions/suite-passed
        with:
          suite: aws-lifecycle
          key: ${{ steps.gate-lifecycle.outputs.key }}

      - name: No emulator left behind
        if: always()
        run: |
          for name in "$LIVE" "$LIFECYCLE"; do
            scripts/floci.sh destroy "$name" || echo "could not destroy $name"
          done

  gcp:
    name: GCP
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EMULATOR: ocel-gcp-live-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Go
        uses: ./.github/actions/go
        with:
          caches: modules,build
          build-scope: gcp

      - uses: ./.github/actions/node-workspace
        with:
          turbo-token: ${{ secrets.TURBO_TOKEN }}
          turbo-team: ${{ vars.TURBO_TEAM }}

      - name: Has the gcp live suite already passed what it reads
        id: gate
        uses: ./.github/actions/suite-gate
        with:
          suite: gcp-live
          task: "@platform/gcp-suite#live"

      - name: What the provider embeds, and the provider binary the suite drives
        if: steps.gate.outputs.green != 'true'
        run: |
          set -euo pipefail
          go generate -C platform/gcp/provider ./...
          go build -o "$RUNNER_TEMP/provider-gcp" ./platform/gcp/provider/cmd/deploy
          echo "OCEL_GCP_PROVIDER_BINARY=$RUNNER_TEMP/provider-gcp" >> "$GITHUB_ENV"

      - name: Pull the emulators
        if: steps.gate.outputs.green != 'true'
        run: docker pull "$OCEL_FLOCI_GCP_IMAGE" && docker pull "$OCEL_FLOCI_FIRESTORE_IMAGE"

      - name: Run every integration test on the emulator
        if: steps.gate.outputs.green != 'true'
        run: scripts/floci.sh --cloud gcp run "$EMULATOR" -- go test -race -count=1 -timeout 30m -tags integration ./platform/gcp/provider/... ./platform/gcp/runtime/... ./scripts/flocidispatch/...

      - name: Record that what the gcp live suite reads has passed
        if: steps.gate.outputs.green != 'true'
        uses: ./.github/actions/suite-passed
        with:
          suite: gcp-live
          key: ${{ steps.gate.outputs.key }}

      - name: No emulator left behind
        if: always()
        run: scripts/floci.sh --cloud gcp destroy "$EMULATOR" || echo "could not destroy $EMULATOR"

  dev:
    name: Dev
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Go
        uses: ./.github/actions/go
        with:
          caches: modules,build
          build-scope: cli

      - uses: ./.github/actions/node-workspace
        with:
          turbo-token: ${{ secrets.TURBO_TOKEN }}
          turbo-team: ${{ vars.TURBO_TEAM }}

      - name: The node bundle the CLI embeds and the dev suites run apps against
        run: |
          set -euo pipefail
          pnpm turbo run build --filter=ocel
          go generate -C cli ./...

      - name: Run the docker suites on the runner's docker
        env:
          OCEL_LIVE_DOCKER: "1"
        run: go test -race -count=1 -timeout 30m -tags integration -run '^TestDocker' ./cli/...

      - name: No dev container left behind
        if: always()
        run: |
          left=$(docker ps --all --quiet --filter label=dev.ocel.project)
          [ -z "$left" ] || docker rm --force --volumes $left

  vps:
    name: VPS (live ${{ matrix.runner }} of 2)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        runner: [1, 2]
    env:
      VM: ocel-live-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.runner }}
      RUNNER: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup the incus host
        uses: ./.github/actions/incus-vm
        with:
          turbo-token: ${{ secrets.TURBO_TOKEN }}
          turbo-team: ${{ vars.TURBO_TEAM }}

      - name: Has this runner's share of the live suite already passed what it reads
        id: gate
        uses: ./.github/actions/suite-gate
        with:
          suite: vps-live-${{ matrix.runner }}-of-2
          task: "@platform/vps-host#live"

      - name: Compile the race-instrumented test binary while the image loads
        if: steps.gate.outputs.green != 'true'
        run: |
          (go test -C platform/vps/provider -race -tags integration -list '^TestLive' ./... > live.list 2> live.list.log; echo $? > live.list.rc) &

      - name: The image every lane boots from
        if: steps.gate.outputs.green != 'true'
        uses: ./.github/actions/vps-images
        with:
          images: docker

      - name: Wait for the test binary
        if: steps.gate.outputs.green != 'true'
        run: |
          set -euo pipefail
          until [ -s live.list.rc ]; do sleep 2; done
          [ "$(cat live.list.rc)" = 0 ] || { cat live.list.log >&2; exit 1; }

      - name: Deal this runner's share of the tests across its lanes
        if: steps.gate.outputs.green != 'true'
        run: |
          set -euo pipefail
          mkdir reports
          grep '^TestLive' live.list | grep -vx "$ENGINE_TEST" | sort > live.tests
          per=$((VPS_SHARDS / VPS_RUNNERS))
          : > reports/lanes.tsv
          for s in $(seq $(((RUNNER - 1) * per)) $((RUNNER * per - 1))); do
            awk -v n="$VPS_SHARDS" -v s="$s" 'NR % n == s' live.tests > "shard-$s.tests"
            if [ ! -s "shard-$s.tests" ]; then
              echo "::error::shard $s has no test"
              exit 1
            fi
            echo "lane $s runs:"
            cat "shard-$s.tests"
            run="^($(paste -sd'|' "shard-$s.tests"))\$"
            printf '%s\t%s\t%s\t%s\n' "$VM-$s" "reports/live-$s.json" \
              "go test -C platform/vps/provider -race -count=1 -timeout 30m -tags integration -run '$run' -json ./..." ocel-vps-docker >> reports/lanes.tsv
          done

      - name: Run the live conformance suite, one VM per lane
        if: steps.gate.outputs.green != 'true'
        run: scripts/incus-fanout.sh reports/lanes.tsv

      - name: Keep every lane's report and the host profile
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vps-live-${{ matrix.runner }}-${{ github.run_attempt }}
          path: reports
          if-no-files-found: ignore

      - name: Record that this runner's share of the live suite has passed
        if: steps.gate.outputs.green != 'true'
        uses: ./.github/actions/suite-passed
        with:
          suite: vps-live-${{ matrix.runner }}-of-2
          key: ${{ steps.gate.outputs.key }}

      - name: No VM left behind
        if: always()
        run: |
          for name in $(cut -f1 reports/lanes.tsv 2>/dev/null); do
            sg incus-admin -c "scripts/incus.sh destroy $name" || echo "could not destroy $name"
          done

  vps-pipeline:
    name: VPS (pipeline)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VM: ocel-pipeline-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup the incus host
        uses: ./.github/actions/incus-vm
        with:
          turbo-token: ${{ secrets.TURBO_TOKEN }}
          turbo-team: ${{ vars.TURBO_TEAM }}

      - name: Has the build pipeline already passed what it reads
        id: gate-build
        uses: ./.github/actions/suite-gate
        with:
          suite: vps-build
          task: "@cli/node#live"

      - name: Has the engine install already passed what it reads
        id: gate-engine
        uses: ./.github/actions/suite-gate
        with:
          suite: vps-engine
          task: "@platform/vps-host#live"

      - name: Compile the race-instrumented test binary while the images load
        if: steps.gate-build.outputs.green != 'true' || steps.gate-engine.outputs.green != 'true'
        run: |
          (go test -C cli -race -tags integration -list '^TestLive' ./... > /dev/null 2> compile.log; echo $? > compile.rc) &

      - name: The images the lanes boot from
        if: steps.gate-build.outputs.green != 'true' || steps.gate-engine.outputs.green != 'true'
        uses: ./.github/actions/vps-images
        with:
          images: base docker

      - name: Wait for the test binary
        if: steps.gate-build.outputs.green != 'true' || steps.gate-engine.outputs.green != 'true'
        run: |
          set -euo pipefail
          until [ -s compile.rc ]; do sleep 2; done
          [ "$(cat compile.rc)" = 0 ] || { cat compile.log >&2; exit 1; }

      - name: Run the build pipeline and the engine install, a VM each
        if: steps.gate-build.outputs.green != 'true' || steps.gate-engine.outputs.green != 'true'
        run: |
          set -euo pipefail
          mkdir reports
          printf '%s\t%s\t%s\t%s\n' \
            "$VM-build" reports/build.json "go test -C cli -race -count=1 -timeout 30m -tags integration -run '^TestLive' -json ./..." ocel-vps-docker \
            "$VM-engine" reports/engine.json "go test -C platform/vps/provider -race -count=1 -timeout 30m -tags integration -run '^$ENGINE_TEST\$' -json ./..." ocel-vps-base \
            > reports/lanes.tsv
          scripts/incus-fanout.sh reports/lanes.tsv

      - name: Keep every lane's report and the host profile
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vps-pipeline-${{ github.run_attempt }}
          path: reports
          if-no-files-found: ignore

      - name: Record that what the build pipeline reads has passed
        if: steps.gate-build.outputs.green != 'true' || steps.gate-engine.outputs.green != 'true'
        uses: ./.github/actions/suite-passed
        with:
          suite: vps-build
          key: ${{ steps.gate-build.outputs.key }}

      - name: Record that what the engine install reads has passed
        if: steps.gate-build.outputs.green != 'true' || steps.gate-engine.outputs.green != 'true'
        uses: ./.github/actions/suite-passed
        with:
          suite: vps-engine
          key: ${{ steps.gate-engine.outputs.key }}

      - name: No VM left behind
        if: always()
        run: |
          for name in $(cut -f1 reports/lanes.tsv 2>/dev/null); do
            sg incus-admin -c "scripts/incus.sh destroy $name" || echo "could not destroy $name"
          done
