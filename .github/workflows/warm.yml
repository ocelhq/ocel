name: Warm

on:
  push:
    branches: [main]
    paths:
      - "cli/**"
      - "sdk/**"
      - "pkg/**"
      - "platform/**"
      - "packages/**"
      - "frameworks/**"
      - "tests/fixtures/**"
      - "go.work"
      - ".goreleaser.yaml"
      - ".golangci.yml"
      - "pnpm-lock.yaml"
      - ".github/actions/go/**"
      - ".github/workflows/warm.yml"
      - "scripts/incus.sh"
      - ".github/actions/vps-images/**"
  schedule:
    - cron: "30 0 * * 1"
  workflow_dispatch:

concurrency:
  group: warm-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  vps-images:
    name: vps images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/vps-images
        with:
          host: absent
          turbo-token: ${{ secrets.TURBO_TOKEN }}
          turbo-team: ${{ vars.TURBO_TEAM }}

  go:
    if: github.event_name != 'schedule'
    name: go
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        id: go
        uses: ./.github/actions/go

      - uses: ./.github/actions/node-workspace
        with:
          turbo-token: ${{ secrets.TURBO_TOKEN }}
          turbo-team: ${{ vars.TURBO_TEAM }}

      - name: The node halves the binaries embed
        run: pnpm turbo run build --filter=ocel

      - uses: ./.github/actions/goreleaser

      - name: The snapshot binaries a journey, a preview and a deploy build
        run: node scripts/snapshot.mjs

      - name: Every module's packages, and their race-instrumented tests
        run: |
          set -euo pipefail
          mapfile -t packages < <(go list -m -f '{{.Dir}}' | sed "s|^$PWD/|./|; s|\$|/...|")
          go build "${packages[@]}"
          go test -race -count=1 -run '^$' "${packages[@]}"

      - name: Take the versions the repository pins
        id: versions
        uses: ./.github/actions/versions

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v${{ steps.versions.outputs.golangci-lint }}
          install-only: true
          skip-cache: true

      - name: Every module's lint
        run: |
          for dir in $(go list -m -f '{{.Dir}}'); do
            (cd "$dir" && golangci-lint run ./... > /dev/null) \
              || echo "::notice::golangci-lint reported $dir; what it analysed is cached all the same"
          done

      - name: Save them
        if: ${{ !cancelled() && steps.go.outcome == 'success' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.go.outputs.paths }}
          key: ${{ steps.go.outputs.key }}

      - name: Drop the entries this one supersedes
        if: ${{ !cancelled() && steps.go.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PREFIX: ${{ steps.go.outputs.prefix }}
          KEY: ${{ steps.go.outputs.key }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          gh cache list --ref "$REF" --key "$PREFIX" --limit 100 --json key --jq '.[].key' \
            | { grep -vxF "$KEY" || true; } \
            | xargs -r -n1 gh cache delete
