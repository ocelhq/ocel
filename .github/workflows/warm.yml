name: Warm

on:
  push:
    branches: [main]
    paths:
      - "cli/**"
      - "sdk/**"
      - "pkg/**"
      - "platform/**"
      - "packages/**"
      - "frameworks/**"
      - "tests/fixtures/**"
      - "go.work"
      - ".goreleaser.yaml"
      - ".golangci.yml"
      - "scripts/redactvet/**"
      - "pnpm-lock.yaml"
      - ".github/actions/go/**"
      - ".github/actions/go-cache-save/**"
      - ".github/go-groups.json"
      - ".github/workflows/warm.yml"
      - "scripts/incus.sh"
      - ".github/actions/vps-images/**"
  schedule:
    - cron: "30 0 * * 1"
  workflow_dispatch:

concurrency:
  group: warm-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  vps-images:
    name: vps images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: ./.github/actions/vps-images
        with:
          host: absent
          turbo-token: ${{ secrets.TURBO_TOKEN }}
          turbo-team: ${{ vars.TURBO_TEAM }}

  groups:
    if: github.event_name != 'schedule'
    name: groups
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      groups: ${{ steps.read.outputs.groups }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Read the groups the modules are split into
        id: read
        run: echo "groups=$(jq -c . .github/go-groups.json)" >> "$GITHUB_OUTPUT"

  modules:
    if: github.event_name != 'schedule'
    name: modules
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Go
        id: go
        uses: ./.github/actions/go
        with:
          caches: modules

      - name: Every module's dependencies, in the workspace and out of it
        run: |
          set -euo pipefail
          for dir in $(go list -m -f '{{.Dir}}'); do
            (cd "$dir" && go mod download && GOWORK=off go mod download)
          done

      - name: Save the modules
        uses: ./.github/actions/go-cache-save
        with:
          path: ${{ steps.go.outputs.modules-path }}
          key: ${{ steps.go.outputs.modules-key }}
          prefix: ${{ steps.go.outputs.modules-prefix }}

  build:
    if: github.event_name != 'schedule'
    name: build ${{ matrix.group.scope }}
    needs: groups
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.groups.outputs.groups) }}
    env:
      DIRS: ${{ matrix.group.dirs }}
      GENERATE: ${{ matrix.group.generate }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Go
        id: go
        uses: ./.github/actions/go
        with:
          caches: modules,build
          build-scope: ${{ matrix.group.scope }}

      - uses: ./.github/actions/node-workspace
        with:
          turbo-token: ${{ secrets.TURBO_TOKEN }}
          turbo-team: ${{ vars.TURBO_TEAM }}

      - name: The node halves the modules embed
        run: pnpm turbo run build --filter=ocel

      - name: go generate, what the group's modules embed
        run: |
          set -euo pipefail
          for dir in $GENERATE; do
            go generate -C "$dir" ./...
          done

      - name: The group's packages, and their race-instrumented tests
        run: |
          set -euo pipefail
          packages=()
          for dir in $DIRS; do
            packages+=("./$dir/...")
          done
          go build "${packages[@]}"
          go test -race -count=1 -run '^$' "${packages[@]}"

      - name: Save the build cache
        uses: ./.github/actions/go-cache-save
        with:
          path: ${{ steps.go.outputs.build-path }}
          key: ${{ steps.go.outputs.build-key }}
          prefix: ${{ steps.go.outputs.build-prefix }}

  binaries:
    if: github.event_name != 'schedule'
    name: build binaries
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Go
        id: go
        uses: ./.github/actions/go
        with:
          caches: modules,build
          build-scope: binaries

      - uses: ./.github/actions/node-workspace
        with:
          turbo-token: ${{ secrets.TURBO_TOKEN }}
          turbo-team: ${{ vars.TURBO_TEAM }}

      - name: The node halves the binaries embed
        run: pnpm turbo run build --filter=ocel

      - uses: ./.github/actions/goreleaser

      - name: The snapshot binaries the Build workflow, a preview and a deploy build
        run: node scripts/snapshot.mjs

      - name: Save the build cache
        uses: ./.github/actions/go-cache-save
        with:
          path: ${{ steps.go.outputs.build-path }}
          key: ${{ steps.go.outputs.build-key }}
          prefix: ${{ steps.go.outputs.build-prefix }}

  lint:
    if: github.event_name != 'schedule'
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Go
        id: go
        uses: ./.github/actions/go
        with:
          caches: modules,lint,build
          build-scope: lint

      - uses: ./.github/actions/node-workspace
        with:
          turbo-token: ${{ secrets.TURBO_TOKEN }}
          turbo-team: ${{ vars.TURBO_TEAM }}

      - name: Everything the modules embed
        run: |
          set -euo pipefail
          for dir in cli platform/aws/provider platform/gcp/provider platform/vps/provider pkg/provider/transform; do
            go generate -C "$dir" ./...
          done

      - name: Take the versions the repository pins
        id: versions
        uses: ./.github/actions/versions

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v${{ steps.versions.outputs.golangci-lint }}
          install-only: true
          skip-cache: true

      - name: Every module's lint, redactvet and go vet of the integration build, as Lint / Go runs them
        run: |
          go build -o "$RUNNER_TEMP/redactvet" ./scripts/redactvet
          for dir in $(go list -m -f '{{.Dir}}'); do
            (cd "$dir" && golangci-lint run ./... > /dev/null) \
              || echo "::notice::golangci-lint reported $dir; what it analysed is cached all the same"
            (cd "$dir" && go vet -vettool="$RUNNER_TEMP/redactvet" ./...) \
              || echo "::notice::redactvet reported $dir; what it compiled is cached all the same"
            (cd "$dir" && go vet -tags integration ./...) \
              || echo "::notice::go vet -tags integration reported $dir; what it compiled is cached all the same"
          done

      - name: Save the lint cache
        uses: ./.github/actions/go-cache-save
        with:
          path: ${{ steps.go.outputs.lint-path }}
          key: ${{ steps.go.outputs.lint-key }}
          prefix: ${{ steps.go.outputs.lint-prefix }}

      - name: Save the packages the lint compiled
        uses: ./.github/actions/go-cache-save
        with:
          path: ${{ steps.go.outputs.build-path }}
          key: ${{ steps.go.outputs.build-key }}
          prefix: ${{ steps.go.outputs.build-prefix }}
