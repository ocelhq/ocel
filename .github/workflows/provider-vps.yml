name: Provider VPS

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - "platform/vps/**"
      - "pkg/providerkit/**"
      - "platform/edge/contract/**"
      - "cli/internal/provider/**"
      - "cli/internal/prompt/**"
      - "cli/internal/cli/bootstrap/**"
      - "cli/internal/cli/preflight/**"
      - "cli/internal/cli/doctor/**"
      - "cli/internal/imagebuild/**"
      - "cli/internal/appbuilder/**"
      - "cli/internal/appimages/**"
      - "cli/internal/appregistry/**"
      - "cli/internal/livemachine/**"
      - "cli/internal/cli/deploy/**"
      - "cli/internal/cli/permissions/**"
      - "cli/internal/cli/domain.go"
      - "cli/internal/cli/rollback.go"
      - "cli/internal/cli/destroy.go"
      - "cli/internal/cli/env/**"
      - "cli/internal/envgate/**"
      - "cli/internal/discovery/**"
      - "cli/internal/manifestbuilder/**"
      - "cli/internal/projectconfig/**"
      - "packages/ocel/**"
      - "pkg/naming/**"
      - "proto/**"
      - "pnpm-lock.yaml"
      - "scripts/incus.sh"
      - "scripts/assert-ran.sh"
      - ".github/workflows/provider-vps.yml"
      - ".github/actions/incus-vm/**"
  workflow_dispatch:

concurrency:
  group: provider-vps-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  live:
    if: github.event.action != 'closed'
    name: vps live conformance ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      VM: ocel-live-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup the incus host
        uses: ./.github/actions/incus-vm
        with:
          gobuildcache-bucket: ${{ vars.GOBUILDCACHE_S3_BUCKET }}
          gobuildcache-region: ${{ vars.GOBUILDCACHE_AWS_REGION }}
          gobuildcache-role-to-assume: ${{ secrets.GOBUILDCACHE_AWS_ROLE_ARN }}
          turbo-token: ${{ secrets.TURBO_TOKEN }}
          turbo-team: ${{ vars.TURBO_TEAM }}

      - name: Pick this shard's tests
        run: |
          set -euo pipefail
          go test -C platform/vps/provider -list '^TestLive' ./... \
            | grep '^TestLive' | sort \
            | awk -v n=4 -v s='${{ matrix.shard }}' 'NR % n == s' > shard.tests
          if [ ! -s shard.tests ]; then
            echo "::error::shard ${{ matrix.shard }} holds no test"
            exit 1
          fi
          echo "shard ${{ matrix.shard }} runs:"
          cat shard.tests
          echo "SHARD_RUN=^($(paste -sd'|' shard.tests))\$" >> "$GITHUB_ENV"

      - name: Run the live conformance suite
        run: |
          set -euo pipefail
          sg incus-admin -c "scripts/incus.sh run $VM -- go test -C platform/vps/provider -race -count=1 -timeout 30m -run '$SHARD_RUN' -json ./..." | tee live.json

      - name: Assert the live suite ran
        run: scripts/assert-ran.sh live.json TestLive

      - name: No VM left behind
        if: always()
        run: sg incus-admin -c "scripts/incus.sh destroy $VM" || echo "could not destroy $VM"

  build:
    if: github.event.action != 'closed'
    name: vps build pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VM: ocel-build-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup the incus host
        uses: ./.github/actions/incus-vm
        with:
          gobuildcache-bucket: ${{ vars.GOBUILDCACHE_S3_BUCKET }}
          gobuildcache-region: ${{ vars.GOBUILDCACHE_AWS_REGION }}
          gobuildcache-role-to-assume: ${{ secrets.GOBUILDCACHE_AWS_ROLE_ARN }}
          turbo-token: ${{ secrets.TURBO_TOKEN }}
          turbo-team: ${{ vars.TURBO_TEAM }}

      - name: Run the build pipeline against a machine's own daemon
        run: |
          set -euo pipefail
          sg incus-admin -c "scripts/incus.sh run $VM -- go test -C cli -race -count=1 -timeout 30m -run '^TestLive' -json ./..." | tee build.json

      - name: Assert the build live suite ran
        run: scripts/assert-ran.sh build.json TestLive

      - name: No VM left behind
        if: always()
        run: sg incus-admin -c "scripts/incus.sh destroy $VM" || echo "could not destroy $VM"

  lifecycle:
    if: github.event.action != 'closed'
    name: vps lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VM: ocel-lifecycle-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup the incus host
        uses: ./.github/actions/incus-vm
        with:
          gobuildcache-bucket: ${{ vars.GOBUILDCACHE_S3_BUCKET }}
          gobuildcache-region: ${{ vars.GOBUILDCACHE_AWS_REGION }}
          gobuildcache-role-to-assume: ${{ secrets.GOBUILDCACHE_AWS_ROLE_ARN }}
          turbo-token: ${{ secrets.TURBO_TOKEN }}
          turbo-team: ${{ vars.TURBO_TEAM }}

      - name: Run the lifecycle suite on a machine of its own
        run: |
          set -euo pipefail
          sg incus-admin -c "scripts/incus.sh run $VM -- go test -C platform/vps/provider -race -count=1 -timeout 45m -run '^TestLifecycle' -json ./..." | tee lifecycle.json

      - name: Assert the lifecycle suite ran
        run: scripts/assert-ran.sh lifecycle.json TestLifecycle

      - name: No VM left behind
        if: always()
        run: sg incus-admin -c "scripts/incus.sh destroy $VM" || echo "could not destroy $VM"
