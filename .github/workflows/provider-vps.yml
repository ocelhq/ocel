name: Provider VPS

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - "platform/vps/**"
      - "pkg/appbuild/**"
      - "pkg/arch/**"
      - "pkg/channel/**"
      - "pkg/configdoc/**"
      - "pkg/connectorserver/**"
      - "pkg/constants/**"
      - "pkg/dotenv/**"
      - "pkg/edge/**"
      - "pkg/environment/**"
      - "pkg/envsource/**"
      - "pkg/envsourcewire/**"
      - "pkg/envvars/**"
      - "pkg/envvarsserver/**"
      - "pkg/images/**"
      - "pkg/keyvalue/**"
      - "pkg/naming/**"
      - "pkg/pricing/**"
      - "pkg/progress/**"
      - "pkg/proto/**"
      - "pkg/provider/**"
      - "pkg/refusal/**"
      - "pkg/router/**"
      - "pkg/runtime/**"
      - "pkg/seal/**"
      - "pkg/stackrecords/**"
      - "pkg/target/**"
      - "pkg/go.mod"
      - "pkg/go.sum"
      - "platform/edge/cloudflare/deploy/**"
      - "platform/edge/contract/**"
      - "platform/s3/**"
      - "cli/internal/providerclient/**"
      - "cli/internal/prompt/**"
      - "cli/internal/cli/bootstrap/**"
      - "cli/internal/cli/preflight/**"
      - "cli/internal/cli/doctor/**"
      - "cli/internal/build/**"
      - "cli/internal/appbuilder/**"
      - "cli/internal/appimages/**"
      - "cli/internal/appregistry/**"
      - "cli/internal/incustest/**"
      - "cli/internal/cli/deploy/**"
      - "cli/internal/cli/permissions/**"
      - "cli/internal/cli/domain.go"
      - "cli/internal/cli/rollback.go"
      - "cli/internal/cli/destroy.go"
      - "cli/internal/cli/env/**"
      - "cli/internal/envgate/**"
      - "cli/internal/discovery/**"
      - "cli/internal/manifestbuilder/**"
      - "cli/internal/projectconfig/**"
      - "packages/ocel/**"
      - "proto/**"
      - "pnpm-lock.yaml"
      - "scripts/incus.sh"
      - "scripts/incus-fanout.sh"
      - "scripts/assert-ran.sh"
      - "tests/fronts/**"
      - ".github/workflows/provider-vps.yml"
      - ".github/actions/incus-vm/**"
      - ".github/actions/vps-images/**"
      - ".github/actions/suite-gate/**"
      - ".github/actions/suite-passed/**"
  workflow_dispatch:

concurrency:
  group: provider-vps-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

env:
  SHARDS: 4
  OCEL_VPS_OFFICIAL_IMAGES_MIRROR: mirror.gcr.io/library
  ENGINE_TEST: TestLiveTheEngineIsInstalledOnConsentAndAnIdleDaemonIsOnlyStarted

jobs:
  gate:
    if: github.event.action != 'closed'
    name: gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      live: ${{ steps.gate-live.outputs.green != 'true' }}
      live_key: ${{ steps.gate-live.outputs.key }}
      pipeline: ${{ steps.gate-build.outputs.green != 'true' || steps.gate-engine.outputs.green != 'true' }}
      build_key: ${{ steps.gate-build.outputs.key }}
      engine_key: ${{ steps.gate-engine.outputs.key }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: ./.github/actions/node-workspace

      - name: Has the live suite already passed what it reads
        id: gate-live
        uses: ./.github/actions/suite-gate
        with:
          suite: vps-live
          task: "@platform/vps-host#live"

      - name: Has the build pipeline already passed what it reads
        id: gate-build
        uses: ./.github/actions/suite-gate
        with:
          suite: vps-build
          task: "@cli/node#live"

      - name: Has the engine install already passed what it reads
        id: gate-engine
        uses: ./.github/actions/suite-gate
        with:
          suite: vps-engine
          task: "@platform/vps-host#live"

  live:
    needs: gate
    if: needs.gate.outputs.live == 'true'
    name: live
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VM: ocel-live-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup the incus host
        uses: ./.github/actions/incus-vm
        with:
          turbo-token: ${{ secrets.TURBO_TOKEN }}
          turbo-team: ${{ vars.TURBO_TEAM }}

      - name: Compile the race-instrumented test binary while the image loads
        run: |
          (go test -C platform/vps/provider -race -list '^TestLive' ./... > live.list 2> live.list.log; echo $? > live.list.rc) &

      - name: The image every lane boots from
        uses: ./.github/actions/vps-images
        with:
          images: docker

      - name: Wait for the test binary
        run: |
          set -euo pipefail
          until [ -s live.list.rc ]; do sleep 2; done
          [ "$(cat live.list.rc)" = 0 ] || { cat live.list.log >&2; exit 1; }

      - name: Deal its tests across the lanes
        run: |
          set -euo pipefail
          mkdir reports
          grep '^TestLive' live.list | grep -vx "$ENGINE_TEST" | sort > live.tests
          : > reports/lanes.tsv
          for s in $(seq 0 $((SHARDS - 1))); do
            awk -v n="$SHARDS" -v s="$s" 'NR % n == s' live.tests > "shard-$s.tests"
            if [ ! -s "shard-$s.tests" ]; then
              echo "::error::shard $s has no test"
              exit 1
            fi
            echo "lane $s runs:"
            cat "shard-$s.tests"
            run="^($(paste -sd'|' "shard-$s.tests"))\$"
            printf '%s\t%s\t%s\t%s\n' "$VM-$s" "reports/live-$s.json" \
              "go test -C platform/vps/provider -race -count=1 -timeout 30m -run '$run' -json ./..." ocel-vps-docker >> reports/lanes.tsv
          done

      - name: Run the live conformance suite, one VM per lane
        run: scripts/incus-fanout.sh reports/lanes.tsv

      - name: Keep every lane's report and the host profile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vps-live-${{ github.run_attempt }}
          path: reports
          if-no-files-found: ignore

      - name: Assert every lane ran
        if: always()
        run: |
          set -euo pipefail
          status=0
          for s in $(seq 0 $((SHARDS - 1))); do
            scripts/assert-ran.sh "reports/live-$s.json" TestLive || status=1
          done
          exit "$status"

      - name: Record that what the live suite reads has passed
        uses: ./.github/actions/suite-passed
        with:
          suite: vps-live
          key: ${{ needs.gate.outputs.live_key }}

      - name: No VM left behind
        if: always()
        run: |
          for name in $(cut -f1 reports/lanes.tsv 2>/dev/null); do
            sg incus-admin -c "scripts/incus.sh destroy $name" || echo "could not destroy $name"
          done

  pipeline:
    needs: gate
    if: needs.gate.outputs.pipeline == 'true'
    name: pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VM: ocel-pipeline-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup the incus host
        uses: ./.github/actions/incus-vm
        with:
          turbo-token: ${{ secrets.TURBO_TOKEN }}
          turbo-team: ${{ vars.TURBO_TEAM }}

      - name: Compile the race-instrumented test binary while the images load
        run: |
          (go test -C cli -race -list '^TestLive' ./... > /dev/null 2> compile.log; echo $? > compile.rc) &

      - name: The images the lanes boot from
        uses: ./.github/actions/vps-images
        with:
          images: base docker

      - name: Wait for the test binary
        run: |
          set -euo pipefail
          until [ -s compile.rc ]; do sleep 2; done
          [ "$(cat compile.rc)" = 0 ] || { cat compile.log >&2; exit 1; }

      - name: Run the build pipeline and the engine install, a VM each
        run: |
          set -euo pipefail
          mkdir reports
          printf '%s\t%s\t%s\t%s\n' \
            "$VM-build" reports/build.json "go test -C cli -race -count=1 -timeout 30m -run '^TestLive' -json ./..." ocel-vps-docker \
            "$VM-engine" reports/engine.json "go test -C platform/vps/provider -race -count=1 -timeout 30m -run '^$ENGINE_TEST\$' -json ./..." ocel-vps-base \
            > reports/lanes.tsv
          scripts/incus-fanout.sh reports/lanes.tsv

      - name: Keep every lane's report and the host profile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vps-pipeline-${{ github.run_attempt }}
          path: reports
          if-no-files-found: ignore

      - name: Assert every lane ran
        if: always()
        run: |
          set -euo pipefail
          status=0
          scripts/assert-ran.sh reports/build.json TestLive || status=1
          scripts/assert-ran.sh reports/engine.json TestLive || status=1
          exit "$status"

      - name: Record that what the build pipeline reads has passed
        uses: ./.github/actions/suite-passed
        with:
          suite: vps-build
          key: ${{ needs.gate.outputs.build_key }}

      - name: Record that what the engine install reads has passed
        uses: ./.github/actions/suite-passed
        with:
          suite: vps-engine
          key: ${{ needs.gate.outputs.engine_key }}

      - name: No VM left behind
        if: always()
        run: |
          for name in $(cut -f1 reports/lanes.tsv 2>/dev/null); do
            sg incus-admin -c "scripts/incus.sh destroy $name" || echo "could not destroy $name"
          done
