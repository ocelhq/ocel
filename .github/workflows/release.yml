name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.plan.outputs.version }}
      missing: ${{ steps.plan.outputs.missing }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Name the tags this commit's VERSION lacks
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(tr -d '[:space:]' < VERSION)
          if [ "$version" = 0.0.0 ]; then
            echo "VERSION is 0.0.0, which no release carries"
            exit 0
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-rc\.[1-9][0-9]*)?$ ]]; then
            echo "::error::VERSION $version is neither X.Y.Z nor X.Y.Z-rc.N" >&2
            exit 1
          fi
          missing=""
          for tag in "v$version" "sdk/v$version"; do
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --silent 2>/dev/null; then
              echo "$tag already exists"
            else
              missing="$missing $tag"
            fi
          done
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "missing=${missing# }" >> "$GITHUB_OUTPUT"

  tag:
    name: tag
    needs: plan
    if: needs.plan.outputs.missing != ''
    runs-on: ubuntu-latest
    environment: release
    permissions: {}
    steps:
      - name: Mint the release app's token
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app.outputs.token }}

      - name: Tag this commit, which fires the binaries workflow
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SLUG: ${{ steps.app.outputs.app-slug }}
          VERSION: ${{ needs.plan.outputs.version }}
          MISSING: ${{ needs.plan.outputs.missing }}
        run: |
          set -euo pipefail
          id=$(gh api "users/${SLUG}[bot]" --jq .id)
          git config user.name "${SLUG}[bot]"
          git config user.email "${id}+${SLUG}[bot]@users.noreply.github.com"
          read -r -a tags <<< "$MISSING"
          refs=()
          for tag in "${tags[@]}"; do
            git tag -a "$tag" -m "ocel $VERSION" "$GITHUB_SHA"
            refs+=("refs/tags/$tag")
          done
          git push --atomic origin "${refs[@]}"
