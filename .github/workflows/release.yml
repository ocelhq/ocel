name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check-release:
    runs-on: ubuntu-latest
    outputs:
      has-changesets: ${{ steps.check.outputs.has-changesets }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for pending changesets
        id: check
        run: |
          count=$(find .changeset -maxdepth 1 -name '*.md' ! -name 'README.md' | wc -l)
          echo "Pending changesets: $count"
          if [ "$count" -gt 0 ]; then
            echo "has-changesets=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-changesets=false" >> "$GITHUB_OUTPUT"
          fi

  version-pr:
    needs: check-release
    if: needs.check-release.outputs.has-changesets == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: ./.github/actions/node-workspace
        with:
          turbo-token: ${{ secrets.TURBO_TOKEN }}
          turbo-team: ${{ vars.TURBO_TEAM }}

      - name: Create/update Version PR
        uses: changesets/action@v1
        with:
          version: pnpm ci:version
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-binaries:
    needs: check-release
    if: needs.check-release.outputs.has-changesets == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: |
            cli/go.sum
            platform/aws/provider/go.sum
            cloud/edge/cloudflare/go.sum
            pkg/proto/go.sum
            sdk/go.sum

      - name: Setup gobuildcache
        uses: ./.github/actions/gobuildcache
        with:
          bucket: ${{ vars.GOBUILDCACHE_S3_BUCKET }}
          region: ${{ vars.GOBUILDCACHE_AWS_REGION }}
          role-to-assume: ${{ secrets.GOBUILDCACHE_AWS_ROLE_ARN }}

      - uses: ./.github/actions/node-workspace
        with:
          turbo-token: ${{ secrets.TURBO_TOKEN }}
          turbo-team: ${{ vars.TURBO_TEAM }}

      - name: Typecheck the node side of the cli
        run: pnpm turbo run typecheck --filter=@cli/node

      - name: Read release version
        id: version
        run: |
          set -euo pipefail
          version=$(node -p "require('./packages/ocel/package.json').version")
          if [ -z "$version" ] || [ "$version" = "undefined" ]; then
            echo "::error::Could not resolve version from packages/ocel/package.json" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/goreleaser

      - name: Compile every binary of this version
        env:
          GORELEASER_CURRENT_TAG: v${{ steps.version.outputs.version }}
        run: goreleaser build --clean --skip=validate

      - name: Upload the CLI binaries the npm packages carry
        uses: actions/upload-artifact@v4
        with:
          name: cli-binaries
          if-no-files-found: error
          path: |
            dist/ocel_darwin_amd64_v1/ocel
            dist/ocel_darwin_arm64/ocel
            dist/ocel_linux_amd64_v1/ocel
            dist/ocel_windows_amd64_v1/ocel.exe

  publish:
    needs: build-binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: ./.github/actions/node-workspace
        with:
          registry-url: https://registry.npmjs.org
          turbo-token: ${{ secrets.TURBO_TOKEN }}
          turbo-team: ${{ vars.TURBO_TEAM }}

      - name: Download the CLI binaries
        uses: actions/download-artifact@v4
        with:
          name: cli-binaries
          path: dist

      - name: Assemble binaries into native packages
        run: |
          set -euo pipefail
          install -D -m 0755 dist/ocel_darwin_arm64/ocel packages/native-lib/cli-darwin-arm64/bin/ocel
          install -D -m 0755 dist/ocel_darwin_amd64_v1/ocel packages/native-lib/cli-darwin-x64/bin/ocel
          install -D -m 0755 dist/ocel_linux_amd64_v1/ocel packages/native-lib/cli-linux-x64/bin/ocel
          install -D -m 0644 dist/ocel_windows_amd64_v1/ocel.exe packages/native-lib/cli-win32-x64/bin/ocel.exe

      - name: Build the published packages
        run: pnpm turbo run build --filter=ocel --filter=@ocel/sst --filter=@ocel/pulumi

      - name: Publish packages
        run: |
          set -euo pipefail
          for pkg in ocel sst pulumi native-lib/cli-darwin-arm64 native-lib/cli-darwin-x64 native-lib/cli-linux-x64 native-lib/cli-win32-x64; do
            (cd "packages/$pkg" && pnpm publish --access public --provenance --no-git-checks)
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Tag the release the binaries are published under
        run: |
          set -euo pipefail
          pnpm changeset tag
          version=$(node -p "require('./packages/ocel/package.json').version")
          git tag "v$version"

      - name: Push tags
        run: git push --follow-tags
