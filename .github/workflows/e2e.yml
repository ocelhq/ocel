name: E2E

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - "cli/**"
      - "pkg/proto/**"
      - "packages/ocel/**"
      - "console/resources/**"
      - "console/api/**"
      - "console/auth/**"
      - "console/db/**"
      - "console/web/**"
      - "examples/**"
      - "tests/dev/**"
      - "tests/shared/**"
      - ".github/workflows/e2e.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      OCEL_RESOURCE_POSTGRES_main: '{"name":"main","postgres":{"host":"localhost","port":5432,"database":"postgres","username":"postgres","password":"postgres"}}'
      OCEL_CLOUD_ADMIN_URL: postgres://postgres:postgres@localhost:5433/postgres
      BETTER_AUTH_SECRET: e2e-test-secret-not-for-production
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_BETTER_AUTH_URL: http://localhost:3000
      OCEL_API_URL: http://localhost:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.10.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: |
            cli/go.sum
            platform/aws/provider/go.sum
            cloud/edge/cloudflare/go.sum
            pkg/proto/go.sum
            sdk/go.sum

      - name: Setup gobuildcache
        uses: ./.github/actions/gobuildcache
        with:
          bucket: ${{ vars.GOBUILDCACHE_S3_BUCKET }}
          region: ${{ vars.GOBUILDCACHE_AWS_REGION }}
          role-to-assume: ${{ secrets.GOBUILDCACHE_AWS_ROLE_ARN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build ocel (dist/)
        run: pnpm --filter ocel build

      - name: go generate (cli platform dist)
        working-directory: cli
        run: go generate ./...

      - name: Build ocel CLI binary
        working-directory: cli
        run: go build -o bin/ocel ./ocel

      - name: Start Postgres services
        run: docker compose up -d

      - name: Wait for Postgres to be ready
        run: |
          for svc in postgres ocel-cloud; do
            echo "Waiting for $svc ..."
            for i in $(seq 1 60); do
              if docker compose exec -T "$svc" pg_isready -U postgres >/dev/null 2>&1; then
                echo "$svc is ready"
                break
              fi
              sleep 1
              if [ "$i" -eq 60 ]; then
                echo "$svc did not become ready" >&2
                exit 1
              fi
            done
          done

      - name: Push control-plane schema
        run: pnpm --filter @console/db db:push

      - name: Start console/web (Next dev)
        run: |
          pnpm --filter @console/web dev > /tmp/web.log 2>&1 &
          echo "Waiting for console/web on :3000 ..."
          for i in $(seq 1 90); do
            if curl -s -o /dev/null http://localhost:3000; then
              echo "console/web is up"
              break
            fi
            sleep 1
            if [ "$i" -eq 90 ]; then
              echo "console/web did not start; last log:" >&2
              cat /tmp/web.log >&2
              exit 1
            fi
          done

      - name: Seed identity and export token
        run: |
          TOKEN=$(pnpm --silent --filter @ocel-tests/dev seed | tail -n1)
          if [ -z "$TOKEN" ]; then
            echo "seed did not print a token" >&2
            exit 1
          fi
          echo "OCEL_ACCESS_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Run e2e specs
        run: pnpm --filter @ocel-tests/dev test

      - name: Dump console/web log on failure
        if: failure()
        run: cat /tmp/web.log || true
