name: Go

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: go-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    name: ${{ matrix.module }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - cli
          - sdk
          - pkg/channel
          - pkg/proto
          - pkg/providerkit
          - pkg/providerkit/pulumi
          - platform/edge/contract
          - platform/aws/provider
          - platform/vps/provider
          - platform/edge/cloudflare/deploy
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: Setup pnpm
        if: matrix.module == 'cli' || matrix.module == 'platform/aws/provider'
        uses: pnpm/action-setup@v4
        with:
          version: 11.10.0

      - name: Setup Node
        if: matrix.module == 'cli' || matrix.module == 'platform/aws/provider'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        if: matrix.module == 'cli' || matrix.module == 'platform/aws/provider'
        working-directory: .
        run: pnpm install --frozen-lockfile

      - name: pnpm --filter ocel build
        if: matrix.module == 'cli'
        working-directory: .
        run: pnpm --filter ocel build

      - name: go generate (embedded dist)
        if: matrix.module == 'cli' || matrix.module == 'platform/aws/provider'
        run: go generate ./...

      - name: go generate (provider payloads the cli tests build)
        if: matrix.module == 'cli'
        working-directory: platform/aws/provider
        run: go generate ./...

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test -race
        run: go test -race -count=1 ./...

      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.7.0-0.dev.0.20260824195211-6cb65e58a558 ./...
