name: Go

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  packages: read

env:
  OCEL_FLOCI_IMAGE: ghcr.io/ocelhq/floci:2.1.0-ocel.1
  OCEL_FLOCI_GCP_IMAGE: floci/floci-gcp:0.8.0
  OCEL_VPS_OFFICIAL_IMAGES_MIRROR: mirror.gcr.io/library

jobs:
  groups:
    name: groups
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      groups: ${{ steps.read.outputs.groups }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read the groups the modules are split into
        id: read
        run: echo "groups=$(jq -c . .github/go-groups.json)" >> "$GITHUB_OUTPUT"

  go:
    name: ${{ matrix.group.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: groups
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.groups.outputs.groups) }}
    env:
      DIRS: ${{ matrix.group.dirs }}
      GENERATE: ${{ matrix.group.generate }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: ./.github/actions/go
        with:
          caches: modules,build
          build-scope: ${{ matrix.group.scope }}

      - name: The groups name every go.work module, and nothing else
        if: matrix.group.name == 'cli'
        run: |
          set -euo pipefail
          diff -u \
            <(jq -r '.[].dirs' .github/go-groups.json | tr ' ' '\n' | sort) \
            <(go list -m -f '{{.Dir}}' | sed "s|^$PWD/||" | sort)

      - uses: ./.github/actions/node-workspace
        with:
          turbo-token: ${{ secrets.TURBO_TOKEN }}
          turbo-team: ${{ vars.TURBO_TEAM }}

      - name: Has the live suite already passed what it reads
        id: gate-live
        if: matrix.group.name == 'aws'
        uses: ./.github/actions/suite-gate
        with:
          suite: aws-live
          task: "@platform/aws-payloads#live"

      - name: Has the lifecycle suite already passed what it reads
        id: gate-lifecycle
        if: matrix.group.name == 'aws'
        uses: ./.github/actions/suite-gate
        with:
          suite: aws-lifecycle
          task: "@platform/aws-payloads#lifecycle"

      - name: Has the gcp live suite already passed what it reads
        id: gate-gcp-live
        if: matrix.group.name == 'gcp'
        uses: ./.github/actions/suite-gate
        with:
          suite: gcp-live
          task: "@platform/gcp-suite#live"

      - name: Setup uv
        if: matrix.group.name == 'cli'
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: python/uv.lock

      - name: The python sdk the discovery suite runs
        if: matrix.group.name == 'cli'
        run: uv sync --all-extras --frozen --directory python

      - name: The musl targets the rust compile suite builds for
        if: matrix.group.name == 'cli'
        run: rustup target add x86_64-unknown-linux-musl aarch64-unknown-linux-musl

      - name: The musl C cross compiler the rust compile suite links a C dependency with
        if: matrix.group.name == 'cli'
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.2

      - name: The ocel package the cli e2e deploys against
        if: matrix.group.name == 'cli'
        run: pnpm turbo run build --filter=ocel

      - name: go generate, what the group's modules embed
        run: |
          set -euo pipefail
          for dir in $GENERATE; do
            go generate -C "$dir" ./...
          done

      - name: go build
        run: |
          set -euo pipefail
          packages=()
          for dir in $DIRS; do
            packages+=("./$dir/...")
          done
          go build "${packages[@]}"

      - name: The provider binary the conformance and lifecycle suites drive
        if: matrix.group.name == 'aws' || matrix.group.name == 'gcp' || matrix.group.name == 'vps'
        env:
          VENDOR: ${{ matrix.group.name }}
        run: |
          set -euo pipefail
          go build -o "$RUNNER_TEMP/provider-$VENDOR" "./platform/$VENDOR/provider/cmd/deploy"
          echo "OCEL_${VENDOR^^}_PROVIDER_BINARY=$RUNNER_TEMP/provider-$VENDOR" >> "$GITHUB_ENV"

      - name: go test -race
        run: |
          set -euo pipefail
          packages=()
          for dir in $DIRS; do
            packages+=("./$dir/...")
          done
          go test -race "${packages[@]}"

      - name: Run the dev resources' live suite on the runner's docker
        if: matrix.group.name == 'cli'
        env:
          OCEL_LIVE_DOCKER: "1"
        run: |
          set -euo pipefail
          go test -race -count=1 -timeout 20m -run '^TestDocker' -json ./cli/internal/devresources/... | tee live-devresources.json

      - name: Assert the dev resources' live suite ran
        if: matrix.group.name == 'cli'
        run: scripts/assert-ran.sh live-devresources.json TestDocker

      - name: Pull the gcp emulator
        if: matrix.group.name == 'gcp' && steps.gate-gcp-live.outputs.green != 'true'
        run: docker pull "$OCEL_FLOCI_GCP_IMAGE"

      - name: Run the gcp live suite
        if: matrix.group.name == 'gcp' && steps.gate-gcp-live.outputs.green != 'true'
        run: |
          set -euo pipefail
          scripts/floci.sh --cloud gcp run "ocel-gcp-live-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" -- go test -race -count=1 -timeout 30m -run '^TestLive' -json ./platform/gcp/provider/... ./platform/gcp/runtime/... ./scripts/flocidispatch/... | tee live-gcp.json

      - name: Assert the gcp live suite ran
        if: matrix.group.name == 'gcp' && steps.gate-gcp-live.outputs.green != 'true'
        run: scripts/assert-ran.sh live-gcp.json TestLive

      - name: Record that what the gcp live suite reads has passed
        if: matrix.group.name == 'gcp' && steps.gate-gcp-live.outputs.green != 'true'
        uses: ./.github/actions/suite-passed
        with:
          suite: gcp-live
          key: ${{ steps.gate-gcp-live.outputs.key }}

      - name: No gcp emulator left behind
        if: ${{ always() && matrix.group.name == 'gcp' }}
        run: |
          name="ocel-gcp-live-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          scripts/floci.sh --cloud gcp destroy "$name" || echo "could not destroy $name"

      - name: Log in to the registry the emulator image lives in
        if: matrix.group.name == 'aws' && (steps.gate-live.outputs.green != 'true' || steps.gate-lifecycle.outputs.green != 'true')
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull the emulator both suites run against
        if: matrix.group.name == 'aws' && (steps.gate-live.outputs.green != 'true' || steps.gate-lifecycle.outputs.green != 'true')
        run: docker pull "$OCEL_FLOCI_IMAGE"

      - name: Run the live conformance suite
        if: matrix.group.name == 'aws' && steps.gate-live.outputs.green != 'true'
        run: |
          set -euo pipefail
          scripts/floci.sh run "ocel-aws-live-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" -- go test -race -count=1 -timeout 30m -run '^TestLive' -json ./platform/aws/provider/... ./platform/aws/runtime/... | tee live.json

      - name: Assert the live suite ran
        if: matrix.group.name == 'aws' && steps.gate-live.outputs.green != 'true'
        run: scripts/assert-ran.sh live.json TestLive

      - name: Record that what the live suite reads has passed
        if: matrix.group.name == 'aws' && steps.gate-live.outputs.green != 'true'
        uses: ./.github/actions/suite-passed
        with:
          suite: aws-live
          key: ${{ steps.gate-live.outputs.key }}

      - name: The node bundle the CLI binary is built around
        if: matrix.group.name == 'aws' && steps.gate-lifecycle.outputs.green != 'true'
        run: |
          set -euo pipefail
          pnpm turbo run build --filter=ocel
          go generate -C cli ./...

      - name: Run the lifecycle suite on an emulator of its own
        if: matrix.group.name == 'aws' && steps.gate-lifecycle.outputs.green != 'true'
        run: |
          set -euo pipefail
          scripts/floci.sh run "ocel-aws-lifecycle-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" -- go test -race -count=1 -timeout 30m -run '^TestLifecycle' -json ./platform/aws/provider/... ./platform/aws/runtime/... | tee lifecycle.json

      - name: Assert the lifecycle suite ran
        if: matrix.group.name == 'aws' && steps.gate-lifecycle.outputs.green != 'true'
        run: scripts/assert-ran.sh lifecycle.json TestLifecycle

      - name: Record that what the lifecycle suite reads has passed
        if: matrix.group.name == 'aws' && steps.gate-lifecycle.outputs.green != 'true'
        uses: ./.github/actions/suite-passed
        with:
          suite: aws-lifecycle
          key: ${{ steps.gate-lifecycle.outputs.key }}

      - name: No emulator left behind
        if: ${{ always() && matrix.group.name == 'aws' }}
        run: |
          for name in "ocel-aws-live-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" "ocel-aws-lifecycle-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"; do
            scripts/floci.sh destroy "$name" || echo "could not destroy $name"
          done
