name: Go

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - "cli/**"
      - "sdk/**"
      - "pkg/**"
      - "platform/**"
      - "packages/ocel/**"
      - "tests/fixtures/sdk/go/**"
      - "tests/fixtures/deploy/go/**"
      - "tests/fixtures/sdk/python/**"
      - "tests/fixtures/sdk/rust/**"
      - "tests/fixtures/sdk/rust-workspace/**"
      - "go.work"
      - "go.work.sum"
      - "crates/**"
      - "python/**"
      - "pnpm-lock.yaml"
      - "turbo.json"
      - "scripts/floci.sh"
      - "scripts/assert-ran.sh"
      - "scripts/redactvet/**"
      - ".golangci.yml"
      - ".github/workflows/go.yml"
      - ".github/actions/go/**"
      - ".github/actions/node-workspace/**"
      - ".github/actions/suite-gate/**"
      - ".github/actions/suite-passed/**"
  workflow_dispatch:

concurrency:
  group: go-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write
  packages: read

env:
  OCEL_FLOCI_IMAGE: ghcr.io/ocelhq/floci:2.0.1-ocel.2
  OCEL_FLOCI_GCP_IMAGE: floci/floci-gcp:0.8.0

jobs:
  go:
    if: github.event.action != 'closed'
    name: ${{ matrix.group.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        group:
          - name: cli
            dirs: cli sdk pkg/naming pkg/proto pkg/channel pkg/configdoc pkg/constants pkg/target tests/fixtures/sdk/go tests/fixtures/deploy/go/server scripts/redactvet
          - name: aws
            dirs: platform/aws/provider platform/aws/runtime platform/aws/connector
          - name: gcp
            dirs: platform/gcp/provider platform/gcp/runtime platform/gcp/connector
          - name: providerkit
            dirs: platform/vps/provider platform/vps/runtime platform/vps/connector platform/s3 pkg/providerkit pkg/providerkit/pulumi pkg/costkit pkg/transformkit pkg/runtimekit pkg/connectorkit platform/edge/cloudflare/deploy platform/edge/contract
    env:
      DIRS: ${{ matrix.group.dirs }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: ./.github/actions/go

      - name: The matrix names every go.work module, and nothing else
        if: matrix.group.name == 'cli'
        run: |
          set -euo pipefail
          diff -u \
            <(sed -n 's/^ *dirs: //p' .github/workflows/go.yml | tr ' ' '\n' | sort) \
            <(go list -m -f '{{.Dir}}' | sed "s|^$PWD/||" | sort)

      - uses: ./.github/actions/node-workspace
        with:
          turbo-token: ${{ secrets.TURBO_TOKEN }}
          turbo-team: ${{ vars.TURBO_TEAM }}

      - name: Has the live suite already passed what it reads
        id: gate-live
        if: matrix.group.name == 'aws'
        uses: ./.github/actions/suite-gate
        with:
          suite: aws-live
          task: "@platform/aws-payloads#live"

      - name: Has the lifecycle suite already passed what it reads
        id: gate-lifecycle
        if: matrix.group.name == 'aws'
        uses: ./.github/actions/suite-gate
        with:
          suite: aws-lifecycle
          task: "@platform/aws-payloads#lifecycle"

      - name: Has the gcp live suite already passed what it reads
        id: gate-gcp-live
        if: matrix.group.name == 'gcp'
        uses: ./.github/actions/suite-gate
        with:
          suite: gcp-live
          task: "@platform/gcp-suite#live"

      - name: Setup uv
        if: matrix.group.name == 'cli'
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: python/uv.lock

      - name: The python sdk the discovery suite runs
        if: matrix.group.name == 'cli'
        run: uv sync --all-extras --frozen --directory python

      - name: The musl targets the rust compile suite builds for
        if: matrix.group.name == 'cli'
        run: rustup target add x86_64-unknown-linux-musl aarch64-unknown-linux-musl

      - name: The musl C cross compiler the rust compile suite links a C dependency with
        if: matrix.group.name == 'cli'
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: The ocel package the cli e2e deploys against
        if: matrix.group.name == 'cli'
        run: pnpm turbo run build --filter=ocel

      - name: go generate (embedded dist)
        if: matrix.group.name == 'cli'
        run: go generate -C cli ./...

      - name: go generate (provider payloads the cli tests build)
        if: matrix.group.name == 'cli' || matrix.group.name == 'aws'
        run: go generate -C platform/aws/provider ./...

      - name: go generate (the gcp provider's embedded runtime)
        if: matrix.group.name == 'gcp'
        run: go generate -C platform/gcp/provider ./...

      - name: go generate (the vps provider's embedded dist)
        if: matrix.group.name == 'providerkit'
        run: go generate -C platform/vps/provider ./...

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          install-only: true
          skip-cache: true

      - name: golangci-lint
        run: |
          set -euo pipefail
          for dir in $DIRS; do
            (cd "$dir" && golangci-lint run ./...)
          done

      - name: redactvet
        run: |
          set -euo pipefail
          go build -o "$RUNNER_TEMP/redactvet" ./scripts/redactvet
          for dir in $DIRS; do
            (cd "$dir" && go vet -vettool="$RUNNER_TEMP/redactvet" ./...)
          done

      - name: go build
        run: |
          set -euo pipefail
          packages=()
          for dir in $DIRS; do
            packages+=("./$dir/...")
          done
          go build "${packages[@]}"

      - name: go test -race
        run: |
          set -euo pipefail
          packages=()
          for dir in $DIRS; do
            packages+=("./$dir/...")
          done
          go test -race -count=1 "${packages[@]}"

      - name: Run the dev stack's live suite on the runner's docker
        if: matrix.group.name == 'cli'
        env:
          OCEL_LIVE_DOCKER: "1"
        run: |
          set -euo pipefail
          go test -race -count=1 -timeout 20m -run '^TestDocker' -json ./cli/internal/devstack/... | tee live-devstack.json

      - name: Assert the dev stack's live suite ran
        if: matrix.group.name == 'cli'
        run: scripts/assert-ran.sh live-devstack.json TestDocker

      - name: Pull the gcp emulator
        if: matrix.group.name == 'gcp' && steps.gate-gcp-live.outputs.green != 'true'
        run: docker pull "$OCEL_FLOCI_GCP_IMAGE"

      - name: Run the gcp live suite
        if: matrix.group.name == 'gcp' && steps.gate-gcp-live.outputs.green != 'true'
        run: |
          set -euo pipefail
          scripts/floci.sh --cloud gcp run "ocel-gcp-live-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" -- go test -C platform/gcp/provider -race -count=1 -timeout 30m -run '^TestLive' -json ./... | tee live-gcp.json

      - name: Assert the gcp live suite ran
        if: matrix.group.name == 'gcp' && steps.gate-gcp-live.outputs.green != 'true'
        run: scripts/assert-ran.sh live-gcp.json TestLive

      - name: Record that what the gcp live suite reads has passed
        if: matrix.group.name == 'gcp' && steps.gate-gcp-live.outputs.green != 'true'
        uses: ./.github/actions/suite-passed
        with:
          suite: gcp-live
          key: ${{ steps.gate-gcp-live.outputs.key }}

      - name: No gcp emulator left behind
        if: ${{ always() && matrix.group.name == 'gcp' }}
        run: |
          name="ocel-gcp-live-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          scripts/floci.sh --cloud gcp destroy "$name" || echo "could not destroy $name"

      - name: Log in to the registry the emulator image lives in
        if: matrix.group.name == 'aws' && (steps.gate-live.outputs.green != 'true' || steps.gate-lifecycle.outputs.green != 'true')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull the emulator both suites run against
        if: matrix.group.name == 'aws' && (steps.gate-live.outputs.green != 'true' || steps.gate-lifecycle.outputs.green != 'true')
        run: docker pull "$OCEL_FLOCI_IMAGE"

      - name: Run the live conformance suite
        if: matrix.group.name == 'aws' && steps.gate-live.outputs.green != 'true'
        run: |
          set -euo pipefail
          scripts/floci.sh run "ocel-aws-live-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" -- go test -race -count=1 -timeout 30m -run '^TestLive' -json ./platform/aws/provider/... ./platform/aws/runtime/... | tee live.json

      - name: Assert the live suite ran
        if: matrix.group.name == 'aws' && steps.gate-live.outputs.green != 'true'
        run: scripts/assert-ran.sh live.json TestLive

      - name: Record that what the live suite reads has passed
        if: matrix.group.name == 'aws' && steps.gate-live.outputs.green != 'true'
        uses: ./.github/actions/suite-passed
        with:
          suite: aws-live
          key: ${{ steps.gate-live.outputs.key }}

      - name: The node bundle the CLI binary is built around
        if: matrix.group.name == 'aws' && steps.gate-lifecycle.outputs.green != 'true'
        run: |
          set -euo pipefail
          pnpm turbo run build --filter=ocel
          go generate -C cli ./...

      - name: Run the lifecycle suite on an emulator of its own
        if: matrix.group.name == 'aws' && steps.gate-lifecycle.outputs.green != 'true'
        run: |
          set -euo pipefail
          scripts/floci.sh run "ocel-aws-lifecycle-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" -- go test -race -count=1 -timeout 30m -run '^TestLifecycle' -json ./platform/aws/provider/... ./platform/aws/runtime/... | tee lifecycle.json

      - name: Assert the lifecycle suite ran
        if: matrix.group.name == 'aws' && steps.gate-lifecycle.outputs.green != 'true'
        run: scripts/assert-ran.sh lifecycle.json TestLifecycle

      - name: Record that what the lifecycle suite reads has passed
        if: matrix.group.name == 'aws' && steps.gate-lifecycle.outputs.green != 'true'
        uses: ./.github/actions/suite-passed
        with:
          suite: aws-lifecycle
          key: ${{ steps.gate-lifecycle.outputs.key }}

      - name: No emulator left behind
        if: ${{ always() && matrix.group.name == 'aws' }}
        run: |
          for name in "ocel-aws-live-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" "ocel-aws-lifecycle-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"; do
            scripts/floci.sh destroy "$name" || echo "could not destroy $name"
          done
