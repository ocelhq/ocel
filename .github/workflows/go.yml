name: Go

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - "cli/**"
      - "sdk/**"
      - "pkg/**"
      - "platform/**"
      - "packages/ocel/**"
      - "pnpm-lock.yaml"
      - "turbo.json"
      - "scripts/floci.sh"
      - "scripts/assert-ran.sh"
      - ".golangci.yml"
      - ".github/workflows/go.yml"
      - ".github/actions/gobuildcache/**"
      - ".github/actions/node-workspace/**"
      - ".github/actions/suite-gate/**"
      - ".github/actions/suite-passed/**"
  workflow_dispatch:

concurrency:
  group: go-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write
  packages: read

env:
  OCEL_FLOCI_IMAGE: ghcr.io/ocelhq/floci:2.0.1-ocel.1

jobs:
  go:
    if: github.event.action != 'closed'
    name: ${{ matrix.group.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        group:
          - name: cli
            dirs: cli sdk pkg/naming pkg/proto pkg/channel
            packages: ./cli/... ./sdk/... ./pkg/naming/... ./pkg/proto/... ./pkg/channel/...
            sums: |
              cli/go.sum
              sdk/go.sum
              pkg/naming/go.sum
              pkg/proto/go.sum
              pkg/channel/go.sum
              platform/aws/provider/go.sum
          - name: aws
            dirs: platform/aws/provider
            packages: ./platform/aws/provider/...
            sums: |
              platform/aws/provider/go.sum
              cli/go.sum
          - name: providerkit
            dirs: platform/vps/provider pkg/providerkit pkg/providerkit/pulumi platform/edge/cloudflare/deploy platform/edge/contract
            packages: ./platform/vps/provider/... ./pkg/providerkit/... ./pkg/providerkit/pulumi/... ./platform/edge/cloudflare/deploy/... ./platform/edge/contract/...
            sums: |
              platform/vps/provider/go.sum
              pkg/providerkit/go.sum
              pkg/providerkit/pulumi/go.sum
              platform/edge/cloudflare/deploy/go.sum
              platform/edge/contract/go.sum
    env:
      DIRS: ${{ matrix.group.dirs }}
      PACKAGES: ${{ matrix.group.packages }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache-dependency-path: ${{ matrix.group.sums }}

      - name: Setup gobuildcache
        uses: ./.github/actions/gobuildcache
        with:
          bucket: ${{ vars.GOBUILDCACHE_S3_BUCKET }}
          region: ${{ vars.GOBUILDCACHE_AWS_REGION }}
          role-to-assume: ${{ secrets.GOBUILDCACHE_AWS_ROLE_ARN }}

      - uses: ./.github/actions/node-workspace
        with:
          turbo-token: ${{ secrets.TURBO_TOKEN }}
          turbo-team: ${{ vars.TURBO_TEAM }}

      - name: Has the live suite already passed what it reads
        id: gate-live
        if: matrix.group.name == 'aws'
        uses: ./.github/actions/suite-gate
        with:
          suite: aws-live
          task: "@platform/aws-payloads#live"

      - name: Has the lifecycle suite already passed what it reads
        id: gate-lifecycle
        if: matrix.group.name == 'aws'
        uses: ./.github/actions/suite-gate
        with:
          suite: aws-lifecycle
          task: "@platform/aws-payloads#lifecycle"

      - name: The ocel package the cli e2e deploys against
        if: matrix.group.name == 'cli'
        run: pnpm turbo run build --filter=ocel

      - name: go generate (embedded dist)
        if: matrix.group.name == 'cli'
        run: go generate -C cli ./...

      - name: go generate (provider payloads the cli tests build)
        if: matrix.group.name == 'cli' || matrix.group.name == 'aws'
        run: go generate -C platform/aws/provider ./...

      - name: go generate (the vps provider's embedded dist)
        if: matrix.group.name == 'providerkit'
        run: go generate -C platform/vps/provider ./...

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2

      - name: golangci-lint
        run: |
          set -euo pipefail
          for dir in $DIRS; do
            (cd "$dir" && golangci-lint run ./...)
          done

      - name: go build
        run: go build $PACKAGES

      - name: go test -race
        run: go test -race -count=1 $PACKAGES

      - name: Log in to the registry the emulator image lives in
        if: matrix.group.name == 'aws' && (steps.gate-live.outputs.green != 'true' || steps.gate-lifecycle.outputs.green != 'true')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull the emulator both suites run against
        if: matrix.group.name == 'aws' && (steps.gate-live.outputs.green != 'true' || steps.gate-lifecycle.outputs.green != 'true')
        run: docker pull "$OCEL_FLOCI_IMAGE"

      - name: Run the live conformance suite
        if: matrix.group.name == 'aws' && steps.gate-live.outputs.green != 'true'
        run: |
          set -euo pipefail
          scripts/floci.sh run "ocel-aws-live-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" -- go test -C platform/aws/provider -race -count=1 -timeout 30m -run '^TestLive' -json ./... | tee live.json

      - name: Assert the live suite ran
        if: matrix.group.name == 'aws' && steps.gate-live.outputs.green != 'true'
        run: scripts/assert-ran.sh live.json TestLive

      - name: Record that what the live suite reads has passed
        if: matrix.group.name == 'aws' && steps.gate-live.outputs.green != 'true'
        uses: ./.github/actions/suite-passed
        with:
          suite: aws-live
          key: ${{ steps.gate-live.outputs.key }}

      - name: The node bundle the CLI binary is built around
        if: matrix.group.name == 'aws' && steps.gate-lifecycle.outputs.green != 'true'
        run: |
          set -euo pipefail
          pnpm turbo run build --filter=ocel
          go generate -C cli ./...

      - name: Run the lifecycle suite on an emulator of its own
        if: matrix.group.name == 'aws' && steps.gate-lifecycle.outputs.green != 'true'
        run: |
          set -euo pipefail
          scripts/floci.sh run "ocel-aws-lifecycle-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" -- go test -C platform/aws/provider -race -count=1 -timeout 30m -run '^TestLifecycle' -json ./... | tee lifecycle.json

      - name: Assert the lifecycle suite ran
        if: matrix.group.name == 'aws' && steps.gate-lifecycle.outputs.green != 'true'
        run: scripts/assert-ran.sh lifecycle.json TestLifecycle

      - name: Record that what the lifecycle suite reads has passed
        if: matrix.group.name == 'aws' && steps.gate-lifecycle.outputs.green != 'true'
        uses: ./.github/actions/suite-passed
        with:
          suite: aws-lifecycle
          key: ${{ steps.gate-lifecycle.outputs.key }}

      - name: No emulator left behind
        if: ${{ always() && matrix.group.name == 'aws' }}
        run: |
          for name in "ocel-aws-live-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" "ocel-aws-lifecycle-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"; do
            scripts/floci.sh destroy "$name" || echo "could not destroy $name"
          done
