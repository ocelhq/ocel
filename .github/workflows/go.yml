name: Go

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - "cli/**"
      - "sdk/**"
      - "pkg/**"
      - "platform/**"
      - "packages/ocel/**"
      - "pnpm-lock.yaml"
      - "turbo.json"
      - ".github/workflows/go.yml"
      - ".github/actions/gobuildcache/**"
      - ".github/actions/node-workspace/**"
  workflow_dispatch:

concurrency:
  group: go-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  go:
    if: github.event.action != 'closed'
    name: ${{ matrix.module }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - cli
          - sdk
          - pkg/channel
          - pkg/naming
          - pkg/proto
          - pkg/providerkit
          - pkg/providerkit/pulumi
          - platform/edge/contract
          - platform/aws/provider
          - platform/vps/provider
          - platform/edge/cloudflare/deploy
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: Setup gobuildcache
        uses: ./.github/actions/gobuildcache
        with:
          bucket: ${{ vars.GOBUILDCACHE_S3_BUCKET }}
          region: ${{ vars.GOBUILDCACHE_AWS_REGION }}
          role-to-assume: ${{ secrets.GOBUILDCACHE_AWS_ROLE_ARN }}

      - if: matrix.module == 'cli' || matrix.module == 'platform/aws/provider'
        uses: ./.github/actions/node-workspace

      - name: The ocel package the cli e2e deploys against
        if: matrix.module == 'cli'
        working-directory: .
        run: pnpm turbo run build --filter=ocel

      - name: go generate (embedded dist)
        if: matrix.module == 'cli' || matrix.module == 'platform/aws/provider' || matrix.module == 'platform/vps/provider'
        run: go generate ./...

      - name: go generate (provider payloads the cli tests build)
        if: matrix.module == 'cli'
        working-directory: platform/aws/provider
        run: go generate ./...

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test -race
        run: go test -race -count=1 ./...

      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.7.0-0.dev.0.20260824195211-6cb65e58a558 ./...
