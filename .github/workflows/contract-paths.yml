name: Contract paths

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: contract-paths-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  maintainers:
    name: contract-paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the base branch, never the pull request
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Only a branch of this repository or a maintainer's fork changes a contract path
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
          CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          ASSOCIATION: ${{ github.event.pull_request.author_association }}
        run: |
          gh api "repos/$REPOSITORY/pulls/$NUMBER/files" --paginate --jq '.[]' > "$RUNNER_TEMP/files"
          node scripts/contract-paths.mjs < "$RUNNER_TEMP/files"
