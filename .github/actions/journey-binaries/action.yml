name: journey-binaries
description: >-
  The snapshot binaries the binary job built, put back under dist/, executable
  again after the artifact dropped their mode, with OCEL_BIN naming the CLI a
  journey drives and OCEL_PROVIDERS_DIR the providers of its own version.

runs:
  using: composite
  steps:
    - name: Download them
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: journey-binaries
        path: dist

    - name: Give them back the bit the artifact dropped
      shell: bash
      run: |
        set -euo pipefail
        chmod +x dist/journey/ocel
        find dist/providers -type f -exec chmod +x {} +
        {
          echo "OCEL_BIN=$GITHUB_WORKSPACE/dist/journey/ocel"
          echo "OCEL_PROVIDERS_DIR=$GITHUB_WORKSPACE/dist/providers"
        } >> "$GITHUB_ENV"
