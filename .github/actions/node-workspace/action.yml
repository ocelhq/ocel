name: Node workspace
description: >-
  pnpm, Node, Bun and an installed workspace, with turbo pointed at the
  remote cache so build, typecheck and test only redo what changed since
  any earlier run.

inputs:
  turbo-token:
    description: Token for the turbo remote cache. Empty disables remote caching.
    required: false
    default: ""
  turbo-team:
    description: Team slug the remote cache belongs to.
    required: false
    default: ""
  registry-url:
    description: npm registry to configure for publishing.
    required: false
    default: ""
  working-directory:
    description: Repository root, when the checkout is not at the workspace root.
    required: false
    default: "."

runs:
  using: composite
  steps:
    - name: Take the versions the repository pins
      id: versions
      uses: ./.github/actions/versions
      with:
        working-directory: ${{ inputs.working-directory }}

    - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      with:
        version: ${{ steps.versions.outputs.pnpm }}

    - name: Name the installed workspace after the lockfile, node and pnpm
      id: modules
      shell: bash
      env:
        NODE: ${{ steps.versions.outputs.node }}
        PNPM: ${{ steps.versions.outputs.pnpm }}
      run: echo "key=node-modules-$RUNNER_OS-$RUNNER_ARCH-node$NODE-pnpm$PNPM-${{ hashFiles(format('{0}/pnpm-lock.yaml', inputs.working-directory), format('{0}/pnpm-workspace.yaml', inputs.working-directory)) }}" >> "$GITHUB_OUTPUT"

    - name: The workspace as main last installed it
      id: installed
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ runner.temp }}/node-modules.tar
        key: ${{ steps.modules.outputs.key }}

    - name: Keep pnpm's store outside the directory pnpm is installed into
      shell: bash
      run: echo "pnpm_config_store_dir=$RUNNER_TEMP/pnpm-store" >> "$GITHUB_ENV"

    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: ${{ steps.versions.outputs.node }}
        cache: ${{ steps.installed.outputs.cache-hit != 'true' && 'pnpm' || '' }}
        cache-dependency-path: ${{ inputs.working-directory }}/pnpm-lock.yaml
        registry-url: ${{ inputs.registry-url }}

    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: ${{ steps.versions.outputs.bun }}

    - name: Put its node_modules back
      if: steps.installed.outputs.cache-hit == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: tar -xf "$RUNNER_TEMP/node-modules.tar"

    - name: Install dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: pnpm install --frozen-lockfile

    - name: Pack node_modules for the runs after this one
      id: pack
      if: steps.installed.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail
        find . -name node_modules -type d -prune -not -path './.git/*' -print0 \
          | tar --null -cf "$RUNNER_TEMP/node-modules.tar" -T -

    - name: Keep them
      if: steps.pack.outcome == 'success'
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ runner.temp }}/node-modules.tar
        key: ${{ steps.modules.outputs.key }}

    - name: Point turbo at the remote cache
      if: inputs.turbo-token != ''
      shell: bash
      env:
        TOKEN: ${{ inputs.turbo-token }}
        TEAM: ${{ inputs.turbo-team }}
      run: |
        echo "TURBO_TOKEN=$TOKEN" >> "$GITHUB_ENV"
        echo "TURBO_TEAM=$TEAM" >> "$GITHUB_ENV"
