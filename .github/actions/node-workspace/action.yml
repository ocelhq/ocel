name: Node workspace
description: >-
  pnpm, Node, Bun and an installed workspace, with the turbo task cache
  restored from earlier runs so build, typecheck and test only redo what
  changed.

inputs:
  registry-url:
    description: npm registry to configure for publishing.
    required: false
    default: ""
  working-directory:
    description: Repository root, when the checkout is not at the workspace root.
    required: false
    default: "."

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
      with:
        version: 11.10.0

    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm
        cache-dependency-path: ${{ inputs.working-directory }}/pnpm-lock.yaml
        registry-url: ${{ inputs.registry-url }}

    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.4.0

    - name: Install dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: pnpm install --frozen-lockfile

    - uses: actions/cache@v4
      with:
        path: ${{ inputs.working-directory }}/.turbo/cache
        key: turbo-${{ runner.os }}-${{ github.job }}-${{ github.sha }}
        restore-keys: |
          turbo-${{ runner.os }}-${{ github.job }}-
          turbo-${{ runner.os }}-
