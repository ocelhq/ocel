name: ocel binary
description: >-
  The ocel CLI on PATH. Built from this checkout, it comes with the providers
  of its own version under OCEL_PROVIDERS_DIR; installed from the latest
  release, it fetches the providers that release published.

inputs:
  source:
    description: head builds the CLI from this checkout, release installs the published one.
    required: false
    default: head
  turbo-token:
    description: Token for the turbo remote cache. Empty disables remote caching.
    required: false
    default: ""
  turbo-team:
    description: Team slug the remote cache belongs to.
    required: false
    default: ""
  gobuildcache-bucket:
    description: S3 bucket holding the Go build cache.
    required: false
    default: ""
  gobuildcache-region:
    description: AWS region of that bucket.
    required: false
    default: ""
  gobuildcache-role-to-assume:
    description: ARN of the build-cache role.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: ./.github/actions/node-workspace
      with:
        turbo-token: ${{ inputs.turbo-token }}
        turbo-team: ${{ inputs.turbo-team }}

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version-file: cli/go.mod
        cache-dependency-path: |
          cli/go.sum
          platform/aws/provider/go.sum
          pkg/proto/go.sum
          sdk/go.sum

    - name: Setup gobuildcache
      uses: ./.github/actions/gobuildcache
      with:
        bucket: ${{ inputs.gobuildcache-bucket }}
        region: ${{ inputs.gobuildcache-region }}
        role-to-assume: ${{ inputs.gobuildcache-role-to-assume }}

    - name: Build the node halves the binaries embed
      shell: bash
      run: pnpm turbo run build --filter=ocel

    - uses: ./.github/actions/goreleaser
      if: inputs.source != 'release'

    - name: Build the binaries this deploy drives
      if: inputs.source != 'release'
      shell: bash
      run: |
        set -euo pipefail
        node scripts/snapshot.mjs > "$RUNNER_TEMP/snapshot.env"
        cat "$RUNNER_TEMP/snapshot.env" >> "$GITHUB_ENV"
        . "$RUNNER_TEMP/snapshot.env"
        dirname "$OCEL_BIN" >> "$GITHUB_PATH"

    - name: Take the CLI from the latest release
      if: inputs.source == 'release'
      shell: bash
      run: npm install --global ocel@latest

    - name: Say which CLI this run drives
      shell: bash
      run: |
        set -euo pipefail
        command -v ocel
        ocel --version
