name: ocel binary
description: >-
  The ocel CLI on PATH. Built from this checkout, or taken prebuilt from the
  binaries job of this run, it comes with the providers of its own version
  under OCEL_PROVIDERS_DIR; installed from the latest release, it fetches the
  providers that release published.

inputs:
  source:
    description: head builds the CLI from this checkout, prebuilt takes the one the binaries job built, release installs the published one.
    required: false
    default: head
  turbo-token:
    description: Token for the turbo remote cache. Empty disables remote caching.
    required: false
    default: ""
  turbo-team:
    description: Team slug the remote cache belongs to.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: ./.github/actions/node-workspace
      with:
        turbo-token: ${{ inputs.turbo-token }}
        turbo-team: ${{ inputs.turbo-team }}

    - name: Setup Go
      if: inputs.source == 'head'
      uses: ./.github/actions/go

    - name: Build the node halves the binaries embed
      shell: bash
      run: pnpm turbo run build --filter=ocel

    - uses: ./.github/actions/goreleaser
      if: inputs.source == 'head'

    - name: Build the binaries this deploy drives
      if: inputs.source == 'head'
      shell: bash
      run: |
        set -euo pipefail
        node scripts/snapshot.mjs > "$RUNNER_TEMP/snapshot.env"
        cat "$RUNNER_TEMP/snapshot.env" >> "$GITHUB_ENV"
        . "$RUNNER_TEMP/snapshot.env"
        dirname "$OCEL_BIN" >> "$GITHUB_PATH"

    - name: Take the binaries the binaries job built
      if: inputs.source == 'prebuilt'
      uses: ./.github/actions/journey-binaries

    - name: Put that CLI on PATH
      if: inputs.source == 'prebuilt'
      shell: bash
      run: dirname "$OCEL_BIN" >> "$GITHUB_PATH"

    - name: Take the CLI from the latest release
      if: inputs.source == 'release'
      shell: bash
      run: npm install --global ocel@latest

    - name: Say which CLI this run drives
      shell: bash
      run: |
        set -euo pipefail
        command -v ocel
        ocel --version
