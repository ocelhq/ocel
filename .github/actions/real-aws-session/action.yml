name: Real AWS session
description: >-
  Node, pnpm and a short-lived AWS role session guarded to the expected AWS and
  Cloudflare accounts — the preamble every job that reaches the disposable
  real-aws accounts needs.

inputs:
  node-version:
    description: Node version to install.
    required: true
  pnpm-version:
    description: pnpm version to install.
    required: true
  bun-version:
    description: Bun version to install.
    required: true
  aws-region:
    description: Region the role session is minted in.
    required: true
  role-to-assume:
    description: ARN of the E2E deploy role.
    required: true
  role-session-name:
    description: Session name, per job, so CloudTrail attributes the calls.
    required: true
  role-duration-seconds:
    description: How long the session lives. Must outlive the calling job.
    required: false
    default: "7200"
  guard-script:
    description: >-
      Path, from the workspace, to the account guard this run's checkout layout
      puts the script at.
    required: true
  expected-aws-account-id:
    description: The only AWS account this workflow may deploy into.
    required: true
  expected-cloudflare-account-id:
    description: The only Cloudflare account this workflow may deploy into.
    required: true
  managed-session-policies:
    description: >-
      ARNs, one per line, of the managed policies the session is bounded by on
      top of the role's own permissions. Empty means the session is granted
      everything the role has.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node-version }}

    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        version: ${{ inputs.pnpm-version }}

    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: ${{ inputs.bun-version }}

    - name: Assume the E2E deploy role
      uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
      with:
        role-to-assume: ${{ inputs.role-to-assume }}
        aws-region: ${{ inputs.aws-region }}
        role-session-name: ${{ inputs.role-session-name }}
        role-duration-seconds: ${{ inputs.role-duration-seconds }}
        managed-session-policies: ${{ inputs.managed-session-policies }}

    - name: Guard the target accounts
      shell: bash
      env:
        EXPECTED_AWS_ACCOUNT_ID: ${{ inputs.expected-aws-account-id }}
        EXPECTED_CLOUDFLARE_ACCOUNT_ID: ${{ inputs.expected-cloudflare-account-id }}
      run: ${{ inputs.guard-script }}
