name: preview
description: >-
  Deploys this pull request's preview of Ocel's own app into the account Ocel
  deploys itself into; the CLI reports it to the console, which says so on the
  pull request. The job checks out the head branch first, and names OCEL_CONFIG,
  OCEL_CONSOLE_PROJECT_ID and OCEL_CONSOLE_URL in its environment.

inputs:
  source:
    description: prebuilt takes the CLI the Binaries job of this run built, release installs the published one.
    required: true
  turbo-token:
    default: ""
  turbo-team:
    default: ""
  role-to-assume:
    required: true
  aws-region:
    required: true
  expected-aws-account-id:
    required: true
  cloudflare-api-token:
    required: true
  cloudflare-account-id:
    required: true
  variables-key:
    required: true

runs:
  using: composite
  steps:
    - name: Take the CLI this preview is deployed with
      uses: ./.github/actions/ocel-binary
      with:
        source: ${{ inputs.source }}
        turbo-token: ${{ inputs.turbo-token }}
        turbo-team: ${{ inputs.turbo-team }}

    - name: Enter the account Ocel deploys itself into
      uses: ./.github/actions/dogfood-session
      with:
        role-to-assume: ${{ inputs.role-to-assume }}
        aws-region: ${{ inputs.aws-region }}
        role-session-name: ocel-preview-${{ github.run_id }}
        expected-aws-account-id: ${{ inputs.expected-aws-account-id }}
        cloudflare-api-token: ${{ inputs.cloudflare-api-token }}
        cloudflare-account-id: ${{ inputs.cloudflare-account-id }}
        variables-key: ${{ inputs.variables-key }}

    - name: Deploy the preview
      shell: bash
      env:
        OCEL_PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        set -euo pipefail
        ocel preview up --yes 2>&1 | tee "$RUNNER_TEMP/preview.log"

    - name: Drop the deployments this preview has outgrown
      shell: bash
      run: ocel preview prune --yes

    - name: Keep what the preview reported
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: preview-result
        path: |
          .ocel/deploy-report.json
          ${{ runner.temp }}/preview.log
        if-no-files-found: warn
