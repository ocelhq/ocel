name: Dogfood session
description: >-
  The account Ocel deploys itself into, with the Cloudflare edge account named
  beside it. Given a role, a short-lived session on that role guarded to the
  expected AWS account; given none, the CLI takes its credential from the
  console and refuses one for any account but the target's.

inputs:
  role-to-assume:
    description: ARN of the dogfood deploy role, for a job the console issues no credential to.
    default: ""
  aws-region:
    description: Region the account is deployed in.
    required: true
  role-session-name:
    description: Session name, per job, so CloudTrail attributes the calls.
    default: ""
  expected-aws-account-id:
    description: The only AWS account a role session may deploy into.
    default: ""
  cloudflare-api-token:
    description: Token for the Cloudflare account the edge is served from.
    required: true
  cloudflare-account-id:
    description: That Cloudflare account's id.
    required: true
  variables-key:
    description: ARN of the KMS key the project's variables are sealed with.
    required: true

runs:
  using: composite
  steps:
    - name: Assume the dogfood deploy role
      if: inputs.role-to-assume != ''
      uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
      with:
        role-to-assume: ${{ inputs.role-to-assume }}
        aws-region: ${{ inputs.aws-region }}
        role-session-name: ${{ inputs.role-session-name }}

    - name: Guard the account this session may touch
      if: inputs.role-to-assume != ''
      shell: bash
      env:
        EXPECTED: ${{ inputs.expected-aws-account-id }}
      run: |
        set -euo pipefail
        account=$(aws sts get-caller-identity --query Account --output text)
        [ -n "$EXPECTED" ] || { echo "no expected account is named" >&2; exit 1; }
        [ "$account" = "$EXPECTED" ] || { echo "session is account $account, not $EXPECTED" >&2; exit 1; }

    - name: Name the accounts and the key the config reads
      shell: bash
      env:
        TOKEN: ${{ inputs.cloudflare-api-token }}
        ACCOUNT: ${{ inputs.cloudflare-account-id }}
        REGION: ${{ inputs.aws-region }}
        VARIABLES_KEY: ${{ inputs.variables-key }}
      run: |
        set -euo pipefail
        {
          echo "CLOUDFLARE_API_TOKEN=$TOKEN"
          echo "CLOUDFLARE_ACCOUNT_ID=$ACCOUNT"
          echo "OCEL_AWS_REGION=$REGION"
          echo "OCEL_AWS_VARIABLES_KEY=$VARIABLES_KEY"
        } >> "$GITHUB_ENV"
