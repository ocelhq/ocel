name: go
description: >-
  Go at the version go.work pins, with the module, build and lint caches the
  job asks for put back from the ones the warm workflow seeds from main. Each
  cache has a key of its own, so a job extracts only what it reads. A module
  cache restored from any key but its own is completed here, with retries, so
  no later step fetches a module. Nothing here saves: a cache a pull request
  saved only that pull request could read, and it would evict the ones every
  ref shares.

inputs:
  go-version-file:
    description: The file whose go directive names the version.
    required: false
    default: go.work
  caches:
    description: >-
      Which caches to restore, comma separated: modules (GOMODCACHE), build
      (GOCACHE, needs build-scope) and lint (golangci-lint's). Empty restores none.
    required: false
    default: modules
  build-scope:
    description: Whose compiled packages the build cache holds, named by the work that fills it.
    required: false
    default: ""

outputs:
  modules-key:
    description: The key the warm workflow saves the module cache under.
    value: ${{ steps.names.outputs.modules-key }}
  modules-hit:
    description: Whether the module cache was restored from its own key, so nothing was fetched.
    value: ${{ steps.modules.outputs.cache-hit }}
  modules-prefix:
    description: What every module cache key starts with, for this Go.
    value: ${{ steps.names.outputs.modules-prefix }}
  modules-path:
    description: The directory the module cache saves.
    value: ${{ steps.names.outputs.modules-path }}
  build-key:
    description: The key the warm workflow saves the build cache of this scope under.
    value: ${{ steps.names.outputs.build-key }}
  build-prefix:
    description: What every build cache key of this scope starts with, for this Go.
    value: ${{ steps.names.outputs.build-prefix }}
  build-path:
    description: The directory the build cache saves.
    value: ${{ steps.names.outputs.build-path }}
  lint-key:
    description: The key the warm workflow saves the lint cache under.
    value: ${{ steps.names.outputs.lint-key }}
  lint-prefix:
    description: What every lint cache key starts with, for this Go.
    value: ${{ steps.names.outputs.lint-prefix }}
  lint-path:
    description: The directory the lint cache saves.
    value: ${{ steps.names.outputs.lint-path }}

runs:
  using: composite
  steps:
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: ${{ inputs.go-version-file }}
        cache: false

    - name: Every build trims source paths, as mise.toml has it locally
      shell: bash
      run: echo "GOFLAGS=${GOFLAGS:+$GOFLAGS }-trimpath" >> "$GITHUB_ENV"

    - name: Race-built test processes exit without the race detector's one-second sleep
      shell: bash
      run: echo "GORACE=${GORACE:+$GORACE }atexit_sleep_ms=0" >> "$GITHUB_ENV"

    - name: Name the caches
      id: names
      shell: bash
      env:
        CACHES: ${{ inputs.caches }}
        SCOPE: ${{ inputs.build-scope }}
      run: |
        set -euo pipefail
        sums=$(find . \( -name node_modules -o -name .git \) -prune -o \( -name go.sum -o -name go.work.sum \) -print | sort | xargs sha256sum | sha256sum)
        base="$RUNNER_OS-$RUNNER_ARCH-$(go env GOVERSION)-"
        wants() { [[ ",${CACHES// /}," == *",$1,"* ]]; }
        if wants build && [ -z "$SCOPE" ]; then
          echo "::error::caches names build, and build-scope names no scope"
          exit 1
        fi
        {
          for name in modules build lint; do
            if wants "$name"; then echo "$name=true"; else echo "$name=false"; fi
          done
          echo "modules-prefix=go-modules-$base"
          echo "modules-key=go-modules-$base${sums%% *}"
          echo "modules-path=$(go env GOMODCACHE)/cache/download"
          echo "build-prefix=go-build-$SCOPE-$base"
          echo "build-key=go-build-$SCOPE-$base$GITHUB_SHA"
          echo "build-path=$(go env GOCACHE)"
          echo "lint-prefix=go-lint-$base"
          echo "lint-key=go-lint-$base$GITHUB_SHA"
          echo "lint-path=$HOME/.cache/golangci-lint"
        } >> "$GITHUB_OUTPUT"

    - name: The modules main last downloaded
      id: modules
      if: steps.names.outputs.modules == 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.names.outputs.modules-path }}
        key: ${{ steps.names.outputs.modules-key }}
        restore-keys: ${{ steps.names.outputs.modules-prefix }}

    - name: Every module the workspace and each of its modules alone resolve, fetched with retries
      if: steps.names.outputs.modules == 'true' && steps.modules.outputs.cache-hit != 'true'
      shell: bash
      env:
        GO_VERSION_FILE: ${{ inputs.go-version-file }}
      run: |
        set -euo pipefail
        cd "$(dirname "$GO_VERSION_FILE")"
        fetch() {
          local attempt=1 delay
          until "$@"; do
            if [ "$attempt" -ge 4 ]; then
              echo "::error::$* failed $attempt times"
              return 1
            fi
            delay=$((5 * 2 ** attempt + RANDOM % 5))
            echo "::warning::$* failed on attempt $attempt; retrying in ${delay}s"
            sleep "$delay"
            attempt=$((attempt + 1))
          done
        }
        fetch go mod download
        scratch=$(mktemp -d -p "$RUNNER_TEMP")
        for dir in $(go list -m -f '{{.Dir}}'); do
          mkdir -p "$scratch$dir"
          cp "$dir/go.mod" "$scratch$dir/"
          if [ -f "$dir/go.sum" ]; then cp "$dir/go.sum" "$scratch$dir/"; fi
          (cd "$dir" && fetch env GOWORK=off go mod download -modfile="$scratch$dir/go.mod" all)
        done

    - name: The packages main last compiled for this scope
      if: steps.names.outputs.build == 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.names.outputs.build-path }}
        key: ${{ steps.names.outputs.build-key }}
        restore-keys: ${{ steps.names.outputs.build-prefix }}

    - name: What main's golangci-lint last analysed
      if: steps.names.outputs.lint == 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.names.outputs.lint-path }}
        key: ${{ steps.names.outputs.lint-key }}
        restore-keys: ${{ steps.names.outputs.lint-prefix }}
