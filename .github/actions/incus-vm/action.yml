name: incus-vm
description: >-
  The toolchain and host every incus-backed live suite needs: Go with the
  embedded node bundle and flip helper generated, incus with the qemu driver,
  and a Docker daemon keeping images in containerd.

inputs:
  turbo-token:
    default: ""
  turbo-team:
    default: ""
  gobuildcache-bucket:
    default: ""
  gobuildcache-region:
    default: ""
  gobuildcache-role-to-assume:
    default: ""

runs:
  using: composite
  steps:
    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version-file: platform/vps/provider/go.mod
        cache-dependency-path: |
          platform/vps/provider/go.sum
          cli/go.sum

    - name: Setup gobuildcache
      uses: ./.github/actions/gobuildcache
      with:
        bucket: ${{ inputs.gobuildcache-bucket }}
        region: ${{ inputs.gobuildcache-region }}
        role-to-assume: ${{ inputs.gobuildcache-role-to-assume }}

    - uses: ./.github/actions/node-workspace
      with:
        turbo-token: ${{ inputs.turbo-token }}
        turbo-team: ${{ inputs.turbo-team }}

    - name: The node bundle the CLI binary is built around
      shell: bash
      run: |
        set -euo pipefail
        pnpm turbo run build --filter=ocel
        go generate -C cli ./...

    - name: The flip helper the provider embeds
      shell: bash
      run: go generate -C platform/vps/provider ./...

    - name: Virtualisation the qemu driver hard-requires
      shell: bash
      run: |
        sudo modprobe vhost_vsock || true
        ls -l /dev/kvm /dev/vsock

    - name: Install incus
      shell: bash
      run: |
        set -euo pipefail
        printf 'Acquire::http::Timeout "10";\nAcquire::https::Timeout "10";\nAcquire::Retries "3";\n' \
          | sudo tee /etc/apt/apt.conf.d/99-fail-over-fast > /dev/null
        sudo apt-get update
        sudo apt-get install -y incus qemu-system-x86 ovmf btrfs-progs
        sudo incus admin init --auto --storage-backend btrfs --storage-create-loop 60
        sudo incus network set incusbr0 ipv6.address=none ipv6.nat=false
        sudo usermod -aG incus-admin "$(id -un)"

    - name: Run the Docker every box ocel bootstraps runs
      shell: bash
      run: |
        set -euo pipefail
        curl -fsSL --retry 5 --retry-delay 2 https://get.docker.com | sudo sh
        docker version --format 'client {{.Client.Version}} server {{.Server.Version}}'

    - name: Keep images in containerd, as every build the cli accepts does, and keep every layer a lane builds
      shell: bash
      run: |
        set -euo pipefail
        sudo mkdir -p /etc/docker
        if [ -s /etc/docker/daemon.json ]; then
          jq '.features."containerd-snapshotter" = true | .builder.gc.enabled = false' /etc/docker/daemon.json > /tmp/daemon.json
        else
          echo '{"features":{"containerd-snapshotter":true},"builder":{"gc":{"enabled":false}}}' > /tmp/daemon.json
        fi
        sudo install -m 0644 /tmp/daemon.json /etc/docker/daemon.json
        cat /etc/docker/daemon.json
        sudo systemctl restart docker
        for _ in $(seq 1 30); do
          if docker info >/dev/null 2>&1; then break; fi
          sleep 1
        done
        docker info --format '{{json .DriverStatus}}'
        if ! docker info --format '{{json .DriverStatus}}' | grep -q 'containerd.snapshotter'; then
          echo "the containerd image store did not take: the daemon still keeps images in its classic store," >&2
          echo "so the live transfer would export an archive production never exports and prove nothing." >&2
          docker info >&2
          exit 1
        fi

    - name: Let the incus bridge past Docker's FORWARD drop
      shell: bash
      run: |
        set -euo pipefail
        for cmd in iptables ip6tables; do
          sudo "$cmd" -nL DOCKER-USER >/dev/null 2>&1 || continue
          sudo "$cmd" -I DOCKER-USER -i incusbr0 -j ACCEPT
          sudo "$cmd" -I DOCKER-USER -o incusbr0 -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT
        done

    - name: Guests fetch from the mirror the runner itself uses, since archive.ubuntu.com stalls from Azure
      shell: bash
      run: |
        set -euo pipefail
        mirror=$(apt-get indextargets --format '$(REPO_URI)' 2>/dev/null | grep -m1 -E 'archive\.ubuntu\.com/ubuntu' || true)
        echo "OCEL_INCUS_APT_MIRROR=${mirror:-http://azure.archive.ubuntu.com/ubuntu/}" >> "$GITHUB_ENV"
