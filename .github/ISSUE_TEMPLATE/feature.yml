name: Feature
description: Ocel should do something it does not do yet.
type: Feature
labels: [needs-triage]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [cli, sdk, provider, vps, aws, gcp, edge, console, frameworks, docs]
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do, and what stops you today.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: A solution
      description: Optional. The problem above is what gets decided on.
