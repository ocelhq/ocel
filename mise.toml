[tools]
golangci-lint = "2.13.2"
goreleaser = "2.18.2"
act = "0.2.89"
buf = "1.72.0"
changie = "1.26.0"
bun = "1.4.0"
go = "1.27.0"
"go:github.com/richardartoul/gobuildcache" = "1.7.0"
node = "26.7.0"

[env]
OCEL_ENV = 'dev'
_.path = "{{config_root}}/dist/bin"

[tasks.oc]
description = "Build ocel and its providers from this checkout, runnable as oc"
run = '''
#!/usr/bin/env bash
set -euo pipefail
pnpm turbo run build --filter=ocel
eval "$(node scripts/snapshot.mjs)"
mkdir -p dist/bin
printf '#!/bin/sh\nOCEL_PROVIDERS_DIR=%q exec %q "$@"\n' "$OCEL_PROVIDERS_DIR" "$OCEL_BIN" > dist/bin/oc
chmod +x dist/bin/oc
'''
