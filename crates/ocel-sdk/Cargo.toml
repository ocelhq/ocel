[package]
name = "ocel-sdk"
description = "Declare the infrastructure a Rust app needs from the app itself"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
include = ["/src", "/tests", "/LICENSE", "/NOTICE"]

[lib]
name = "ocel"

[features]
postgres = ["dep:sqlx"]
schemars = ["dep:schemars"]
kv = ["dep:redis"]
axum = ["dep:axum"]
realtime = [
    "dep:base64",
    "dep:boon",
    "dep:ring",
    "dep:rustls",
    "dep:rustls-native-certs",
    "dep:tokio-rustls",
]

[dependencies]
ocel-macros = { path = "../ocel-macros", version = "0.0.0" }
buffa = { version = "0.9", features = ["json"] }
buffa-types = { version = "0.9", features = ["json"] }
bytes = "1"
axum = { version = "0.8", default-features = false, optional = true }
base64 = { version = "0.22", optional = true }
boon = { version = "0.6", optional = true }
connectrpc = { version = "0.9", features = ["client"] }
futures-core = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
inventory = "0.3"
redis = { version = "1.7", default-features = false, features = ["tokio-comp", "tokio-rustls-comp"], optional = true }
ring = { version = "0.17", optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
rustls-native-certs = { version = "0.8", optional = true }
schemars = { version = "1", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
thiserror = "2"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "tls-rustls"], optional = true }
tokio = { version = "1", default-features = false, features = ["io-util", "net", "rt", "rt-multi-thread", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"], optional = true }
tokio-util = { version = "0.7", default-features = false, features = ["io"] }

[dev-dependencies]
schemars = "1"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "test-util", "time"] }
tower = { version = "0.5", features = ["util"] }
trybuild = "1.0"
