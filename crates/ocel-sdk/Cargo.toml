[package]
name = "ocel-sdk"
description = "Declare the infrastructure a Rust app needs from the app itself"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
documentation = "https://docs.rs/ocel-sdk"
keywords = ["infrastructure", "cloud", "deploy", "serverless", "iac"]
categories = ["api-bindings", "web-programming", "development-tools"]
include = ["/src", "/tests", "/LICENSE", "/NOTICE", "/README.md"]

[lib]
name = "ocel"

[features]
postgres = ["dep:sqlx"]
schemars = ["dep:schemars"]
kv = ["dep:redis"]
axum = ["dep:axum"]
realtime = ["dep:boon", "dep:ring"]

[dependencies]
ocel-macros = { path = "../ocel-macros", version = "0.0.5" }
buffa = { version = "0.9", features = ["json"] }
buffa-types = { version = "0.9", features = ["json"] }
bytes = "1"
axum = { version = "0.8", default-features = false, optional = true }
boon = { version = "0.6", optional = true }
connectrpc = { version = "0.9", features = ["client"] }
futures-core = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1", "server"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "ring", "tls12"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
inventory = "0.3"
redis = { version = "1.7", default-features = false, features = ["tokio-comp", "tokio-rustls-comp"], optional = true }
ring = { version = "0.17", optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
schemars = { version = "1", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
thiserror = "2"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "tls-rustls"], optional = true }
tokio = { version = "1", default-features = false, features = ["io-util", "net", "rt", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", default-features = false, features = ["io"] }
webpki-roots = "1"

[dev-dependencies]
schemars = "1"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "test-util", "time"] }
tower = { version = "0.5", features = ["util"] }
trybuild = "1.0"
