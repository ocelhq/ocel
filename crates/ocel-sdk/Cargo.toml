[package]
name = "ocel-sdk"
description = "Declare the infrastructure a Rust app needs from the app itself"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
include = ["/src", "/tests", "/LICENSE", "/NOTICE"]

[lib]
name = "ocel"

[features]
postgres = ["dep:sqlx"]

[dependencies]
ocel-macros = { path = "../ocel-macros", version = "0.0.0" }
buffa = { version = "0.9", features = ["json"] }
buffa-types = { version = "0.9", features = ["json"] }
bytes = "1"
connectrpc = { version = "0.9", features = ["client"] }
futures-core = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
http = "1"
http-body-util = "0.1"
inventory = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "tls-rustls"], optional = true }
tokio = { version = "1", default-features = false, features = ["io-util", "rt", "sync"] }
tokio-util = { version = "0.7", default-features = false, features = ["io"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }
trybuild = "1.0"
