[package]
name = "ocel-macros"
description = "The attribute macros of the ocel-sdk crate"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
documentation = "https://docs.rs/ocel-macros"
keywords = ["infrastructure", "cloud", "deploy", "derive", "macros"]
categories = ["development-tools::procedural-macro-helpers"]
include = ["/src", "/LICENSE", "/NOTICE", "/README.md"]

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }

[dev-dependencies]
sdk = { package = "ocel-sdk", path = "../ocel-sdk", features = ["kv", "realtime", "schemars"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
