[package]
name = "ocel"
description = "Declare the infrastructure a Rust app needs from the app itself"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
postgres = ["dep:sqlx"]

[dependencies]
ocel-macros = { path = "../ocel-macros", version = "0.0.1-alpha.0" }
buffa = { version = "0.9", features = ["json"] }
buffa-types = { version = "0.9", features = ["json"] }
connectrpc = { version = "0.9", features = ["client"] }
inventory = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres"], optional = true }
tokio = { version = "1", default-features = false, features = ["rt", "sync"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }
