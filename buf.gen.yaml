version: v2
clean: true
inputs:
  - directory: proto
    exclude_paths:
      - proto/cli/stream
      - proto/common/environment
      - proto/common/plan
      - proto/common/progress
      - proto/provider
plugins:
  - local: protoc-gen-es
    out: packages/ocel/src/gen/proto
    include_imports: true
    opt:
      - target=ts
      - import_extension=js

  - remote: buf.build/bufbuild/py:v0.4.0
    out: python/ocel/src/ocel/gen
    include_imports: true

  - remote: buf.build/connectrpc/py:v0.11.1
    out: python/ocel/src/ocel/gen

  - remote: buf.build/anthropics/buffa:v0.9.2
    out: crates/ocel-sdk/src/proto
    opt:
      - views=true
      - json=true
      - file_per_package=true

  - remote: buf.build/connectrpc/rust:v0.9.0
    out: crates/ocel-sdk/src/proto
    opt: buffa_module=crate::proto

  - local: [go, tool, protoc-gen-go]
    out: sdk/internal/proto
    opt:
      - paths=source_relative
      - Mapp/bucket/v1/bucket.proto=ocel.dev/internal/proto/app/bucket/v1;bucketv1
      - Mapp/resources/v1/resources.proto=ocel.dev/internal/proto/app/resources/v1;resourcesv1
      - Mapp/resources/v1/variables.proto=ocel.dev/internal/proto/app/resources/v1;resourcesv1
      - Mcommon/bindings/v1/bindings.proto=ocel.dev/internal/proto/common/bindings/v1;bindingsv1

  - local: [go, tool, protoc-gen-connect-go]
    out: sdk/internal/proto
    opt:
      - paths=source_relative
      - Mapp/bucket/v1/bucket.proto=ocel.dev/internal/proto/app/bucket/v1;bucketv1
      - Mapp/resources/v1/resources.proto=ocel.dev/internal/proto/app/resources/v1;resourcesv1
      - Mapp/resources/v1/variables.proto=ocel.dev/internal/proto/app/resources/v1;resourcesv1
      - Mcommon/bindings/v1/bindings.proto=ocel.dev/internal/proto/common/bindings/v1;bindingsv1
      - simple
