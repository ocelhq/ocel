version: v2
clean: true
inputs:
  - directory: proto
    exclude_paths:
      - proto/cli/stream
      - proto/common/environment
      - proto/common/plan
      - proto/common/progress
      - proto/provider
plugins:
  - local: protoc-gen-es
    out: packages/ocel/src/gen/proto
    include_imports: true
    opt:
      - target=ts
      - import_extension=js

  - remote: buf.build/bufbuild/py:v0.4.0
    out: python/ocel/src/ocel/gen
    include_imports: true

  - remote: buf.build/connectrpc/py:v0.11.1
    out: python/ocel/src/ocel/gen

  - remote: buf.build/anthropics/buffa:v0.9.2
    out: crates/ocel/src/proto
    opt:
      - views=true
      - json=true
      - file_per_package=true

  - remote: buf.build/connectrpc/rust:v0.9.0
    out: crates/ocel/src/proto
    opt: buffa_module=crate::proto
