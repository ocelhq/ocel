version: v2
clean: true
inputs:
  - directory: proto
    paths:
      - proto/cli/stream
plugins:
  - local:
      [go, run, github.com/sudorandom/protoc-gen-connect-openapi@v0.28.0]
    out: research/proto-jsonschema/gen/connect-openapi
    opt:
      - format=jsonschema
      - path=ocel.cli.jsonschema.json
