changesDir: .changes
unreleasedDir: unreleased
headerPath: header.tpl.md
changelogPath: CHANGELOG.md
versionExt: md
versionFormat: '## {{.Version}} - {{.Time.Format "2006-01-02"}}'
kindFormat: '### {{.Kind}}'
changeFormat: '- **{{.Component}}**: {{.Body}}'
components:
  - cli
  - providers/aws
  - providers/gcp
  - providers/vps
  - edge
  - sdk/ts
  - sdk/go
  - sdk/python
  - sdk/rust
  - adapters/sst
  - adapters/pulumi
  - transforms
  - frameworks/next
  - frameworks/node
kinds:
  - label: Breaking
    auto: patch
  - label: Added
    auto: patch
  - label: Changed
    auto: patch
  - label: Deprecated
    auto: patch
  - label: Removed
    auto: patch
  - label: Fixed
    auto: patch
  - label: Security
    auto: patch
newlines:
  afterChangelogHeader: 1
  beforeKind: 1
  afterKind: 1
  beforeChangelogVersion: 1
  endOfVersion: 1
envPrefix: CHANGIE_
