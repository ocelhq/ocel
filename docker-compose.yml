services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  ocel-cloud:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - ocel_cloud_data:/var/lib/postgresql/data

  minio:
    image: minio/minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${OCEL_BLOB_ACCESS_KEY_ID:?set OCEL_BLOB_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${OCEL_BLOB_SECRET_ACCESS_KEY:?set OCEL_BLOB_SECRET_ACCESS_KEY}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio-createbucket:
    image: minio/mc
    environment:
      MINIO_ROOT_USER: ${OCEL_BLOB_ACCESS_KEY_ID:?set OCEL_BLOB_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${OCEL_BLOB_SECRET_ACCESS_KEY:?set OCEL_BLOB_SECRET_ACCESS_KEY}
      MINIO_BUCKET: ${OCEL_BLOB_BUCKET:-ocel-dev}
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/$${MINIO_BUCKET}
      "

  dynamodb:
    image: amazon/dynamodb-local
    restart: unless-stopped
    command: ["-jar", "DynamoDBLocal.jar", "-inMemory", "-sharedDb"]
    ports:
      - "8000:8000"

volumes:
  postgres_data:
  ocel_cloud_data:
  minio_data:
