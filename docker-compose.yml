services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 12

  pricing-createdb:
    image: postgres:16
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: postgres
    entrypoint: >
      /bin/sh -c "
      psql -h postgres -U postgres -tc \"SELECT 1 FROM pg_database WHERE datname = 'pricing'\" | grep -q 1 ||
      createdb -h postgres -U postgres pricing
      "

  pricing:
    build:
      context: .
      dockerfile: pricing/Dockerfile
    restart: unless-stopped
    depends_on:
      pricing-createdb:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/pricing
      PORT: "8090"
    ports:
      - "8090:8090"

  ocel-cloud:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - ocel_cloud_data:/var/lib/postgresql/data

  pricing-ingest:
    build:
      context: .
      dockerfile: pricing/Dockerfile
    depends_on:
      pricing-createdb:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/pricing
      GCP_BILLING_API_KEY: ${GCP_BILLING_API_KEY:-}
    entrypoint: ["/usr/local/bin/pricing-ingest"]
    restart: "no"

  minio:
    image: quay.io/minio/minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio-createbucket:
    image: quay.io/minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/ocel-dev
      "

  dynamodb:
    image: amazon/dynamodb-local
    restart: unless-stopped
    command: ["-jar", "DynamoDBLocal.jar", "-inMemory", "-sharedDb"]
    ports:
      - "8000:8000"

volumes:
  postgres_data:
  ocel_cloud_data:
  minio_data:
