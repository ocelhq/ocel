[project]
name = "ocel"
version = "0.0.1a0"
description = "Declare the infrastructure a Python app needs from the app itself"
requires-python = ">=3.12"
dependencies = ["connectrpc>=0.12.1"]

[project.optional-dependencies]
postgres = ["asyncpg>=0.30"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ocel"]
