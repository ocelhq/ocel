[project]
name = "ocel"
version = "0.0.0"
description = "Declare the infrastructure a Python app needs from the app itself"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = ["connectrpc>=0.12.1,<0.13", "protobuf-py>=0.4,<0.5", "pyqwest>=0.10,<0.11"]

[project.optional-dependencies]
postgres = ["asyncpg>=0.30"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ocel"]
