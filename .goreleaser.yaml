version: 2

project_name: ocel

before:
  hooks:
    - go generate -C cli ./...
    - go generate -C platform/aws/provider ./...
    - go generate -C platform/gcp/provider ./...
    - go generate -C platform/vps/provider ./...

builds:
  - id: ocel
    dir: cli
    main: ./ocel
    binary: ocel
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/ocelhq/ocel/cli/internal/version.Version={{ .Version }}
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64

  - id: provider-aws
    dir: platform/aws/provider
    main: ./cmd/deploy
    binary: provider-aws
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64

  - id: provider-gcp
    dir: platform/gcp/provider
    main: ./cmd/deploy
    binary: provider-gcp
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64

  - id: provider-vps
    dir: platform/vps/provider
    main: ./cmd/deploy
    binary: provider-vps
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: cli
    ids: [ocel]
    name_template: "ocel_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: []
    format_overrides:
      - goos: windows
        formats: [zip]

  - id: provider-aws
    ids: [provider-aws]
    name_template: "ocel-{{ .Binary }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: []
    format_overrides:
      - goos: windows
        formats: [zip]

  - id: provider-gcp
    ids: [provider-gcp]
    name_template: "ocel-{{ .Binary }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: []
    format_overrides:
      - goos: windows
        formats: [zip]

  - id: provider-vps
    ids: [provider-vps]
    name_template: "ocel-{{ .Binary }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: []
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt
  algorithm: sha256

snapshot:
  version_template: "{{ .Version }}-snapshot-{{ .ShortCommit }}"

changelog:
  disable: true

release:
  github:
    owner: ocelhq
    name: ocel
  prerelease: auto

brews:
  - name: ocel
    ids: [cli]
    repository:
      owner: ocelhq
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: https://ocel.dev
    description: Deploys apps into your own cloud
    license: MIT
    commit_author:
      name: github-actions[bot]
      email: 41898282+github-actions[bot]@users.noreply.github.com
    install: |
      bin.install "ocel"
    test: |
      system bin/"ocel", "--version"
