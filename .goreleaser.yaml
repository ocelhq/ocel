version: 2

project_name: ocel

before:
  hooks:
    - go generate -C cli ./...
    - go generate -C platform/aws/provider ./...
    - go generate -C platform/gcp/provider ./...
    - go generate -C platform/vps/provider ./...

builds:
  - id: ocel
    dir: cli
    main: ./ocel
    binary: ocel
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/ocelhq/ocel/cli/internal/version.Version={{ .Version }}
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64

  - id: provider-aws
    dir: platform/aws/provider
    main: ./cmd/deploy
    binary: provider-aws
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64

  - id: provider-gcp
    dir: platform/gcp/provider
    main: ./cmd/deploy
    binary: provider-gcp
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64

  - id: provider-vps
    dir: platform/vps/provider
    main: ./cmd/deploy
    binary: provider-vps
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64

  - id: connector-aws
    dir: platform/aws/connector
    main: .
    binary: connector-aws
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos: [linux]
    goarch: [arm64]

  - id: connector-gcp
    dir: platform/gcp/connector
    main: .
    binary: connector-gcp
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos: [linux]
    goarch: [amd64]

  - id: connector-vps
    dir: platform/vps/connector
    main: .
    binary: connector-vps
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos: [linux]
    goarch: [amd64, arm64]

archives:
  - id: cli
    ids: [ocel]
    name_template: "ocel_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: []
    format_overrides:
      - goos: windows
        formats: [zip]

  - id: provider-aws
    ids: [provider-aws]
    name_template: "ocel-{{ .Binary }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: []
    format_overrides:
      - goos: windows
        formats: [zip]

  - id: provider-gcp
    ids: [provider-gcp]
    name_template: "ocel-{{ .Binary }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: []
    format_overrides:
      - goos: windows
        formats: [zip]

  - id: provider-vps
    ids: [provider-vps]
    name_template: "ocel-{{ .Binary }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: []
    format_overrides:
      - goos: windows
        formats: [zip]

  - id: connector-aws
    ids: [connector-aws]
    name_template: "ocel-{{ .Binary }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: []

  - id: connector-gcp
    ids: [connector-gcp]
    name_template: "ocel-{{ .Binary }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: []

  - id: connector-vps
    ids: [connector-vps]
    name_template: "ocel-{{ .Binary }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: []

checksum:
  name_template: checksums.txt
  algorithm: sha256

sboms:
  - id: archives
    artifacts: archive

signs:
  - id: checksums
    cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - --yes
      - "--bundle=${signature}"
      - "${artifact}"
    artifacts: checksum
    output: true

snapshot:
  version_template: "{{ .Version }}-snapshot-{{ .ShortCommit }}"

changelog:
  disable: true

release:
  github:
    owner: ocelhq
    name: ocel
  prerelease: auto
  make_latest: "{{ if .Prerelease }}false{{ else }}true{{ end }}"
  replace_existing_artifacts: true
  preflight:
    fail_on_error: true

homebrew_casks:
  - name: ocel
    ids: [cli]
    binaries: [ocel]
    skip_upload: true
    repository:
      owner: ocelhq
      name: homebrew-tap
      branch: main
    homepage: https://ocel.dev
    description: Deploys apps into your own cloud
    license: MIT
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/ocel"]
          end
