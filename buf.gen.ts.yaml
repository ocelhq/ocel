version: v2
# The TypeScript SDK is kept lightweight: dev- and deployment-only services
# are CLI/control-plane concerns and are excluded from client codegen.
inputs:
  - directory: proto
    exclude_paths:
      - proto/dev
      - proto/deployments
      # The variable store is reached only through the provider binary, so its
      # service has no client. Excluded by file, not by directory: the rest of
      # proto/env is SDK-facing.
      - proto/env/v1/vars.proto
plugins:
  - local: protoc-gen-es
    out: packages/ocel/src/gen/proto
    include_imports: true
    opt:
      - target=ts
      - import_extension=js
