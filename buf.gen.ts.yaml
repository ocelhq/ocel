version: v2
inputs:
  - directory: proto
    exclude_paths:
      - proto/dev
      - proto/deployments
      - proto/environment
      - proto/envvars
      - proto/progress
plugins:
  - local: protoc-gen-es
    out: packages/ocel/src/gen/proto
    include_imports: true
    opt:
      - target=ts
      - import_extension=js
