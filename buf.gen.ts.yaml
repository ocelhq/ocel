version: v2
inputs:
  - directory: proto
    exclude_paths:
      - proto/cli/stream
      - proto/common/environment
      - proto/common/plan
      - proto/common/progress
      - proto/provider
plugins:
  - local: protoc-gen-es
    out: packages/ocel/src/gen/proto
    include_imports: true
    opt:
      - target=ts
      - import_extension=js
